name: Aiven Operational Core Staging (manual, guarded)

# Offline source snapshot of the 15 first-slice operational tables.
# Existing guild-config seed/shadow/history tables are never changed.
# No production bot runtime routing, source writes, pruning or Discloud deploy.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview first, then separately install and stage original source records"
        required: true
        type: choice
        options: [preview, install, stage]
        default: preview
      confirmation:
        description: "Exact owner confirmation for install or stage, as shown in docs"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: dankshield-aiven-core-staging
  cancel-in-progress: false

jobs:
  core-staging:
    if: ${{ github.repository == 'UglyGameFace/Dank-Shield' && github.ref == 'refs/heads/main' && github.actor == 'UglyGameFace' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse stale main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Main advanced; rerun a fresh core staging preview."
            exit 1
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated PostgreSQL and test clients
        # The lifecycle contract imports verification_reminders, guild_config,
        # and other production modules; match the existing PG17 contract CI.
        run: |
          python -m pip install -q "pytest>=8,<10" "psycopg[binary]>=3.2,<4" "discord.py>=2.6,<3" "supabase>=2.24,<3" "python-dotenv>=1,<1.1"
      - name: Verify focused operational staging contracts
        run: python -m pytest -q --tb=short tests/test_aiven_core_operational_stage.py tests/test_postgres_data_lifecycle.py
      - name: Preview, install or stage preserved originals
        env:
          DANK_SOURCE_DATABASE_URL: ${{ secrets.DANK_SOURCE_DATABASE_URL }}
          AIVEN_POSTGRES_URI: ${{ secrets.AIVEN_POSTGRES_URI }}
          AIVEN_POSTGRES_CA_PEM: ${{ secrets.AIVEN_POSTGRES_CA_PEM }}
          AIVEN_CORE_MODE: ${{ inputs.mode }}
          AIVEN_CORE_CONFIRMATION: ${{ inputs.confirmation }}
        run: python -m tools.aiven_core_operational_stage
