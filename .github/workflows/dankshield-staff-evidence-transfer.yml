name: Dedicated Supabase Staff Evidence Copy (manual)

# Explicit owner action, main branch only, isolated target credentials.
# No production routing changes or Discord API calls.
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        options: [preview, stage]
        default: preview
      confirmation:
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: dankshield-staff-evidence-history-copy
  cancel-in-progress: false

jobs:
  evidence:
    if: ${{ github.repository == 'UglyGameFace/Dank-Shield' && github.ref == 'refs/heads/main' && github.actor == 'UglyGameFace' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert current main has not changed
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Main changed; repeat preview on exact main."
            exit 1
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded PostgreSQL connector
        run: python -m pip install -q "psycopg[binary]>=3.2,<4"
      - name: Read-only preflight or explicitly stage staff evidence
        env:
          DANK_SOURCE_DATABASE_URL: ${{ secrets.DANK_SOURCE_DATABASE_URL }}
          DANK_FRESH_DATABASE_URL: ${{ secrets.DANK_FRESH_DATABASE_URL }}
          DANK_STAFF_HISTORY_MODE: ${{ inputs.mode }}
          DANK_STAFF_HISTORY_CONFIRMATION: ${{ inputs.confirmation }}
        run: python -m tools.stage_dankshield_staff_evidence
