name: DS-STICKY-026 Finalizer

on:
  push:
    branches:
      - feature/ds-sticky-026-smart-community-tools
    paths:
      - ".github/workflows/ds-sticky-026-finalizer.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ds-sticky-026-smart-community-tools
          fetch-depth: 0

      - name: Harden poll permissions and sticky-poll validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("stoney_verify/commands_ext/public_community_tools.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one source match, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "    normalize_https_url,\n    reset_sticky_poll,",
              "    normalize_https_url,\n    normalize_poll,\n    reset_sticky_poll,",
          )

          replace_once(
              '''def _manage_webhooks(interaction: discord.Interaction) -> bool:\n    member = interaction.user\n    if not isinstance(member, discord.Member):\n        return False\n    return bool(member.guild_permissions.administrator or member.guild_permissions.manage_webhooks)\n\n\nasync def _private(''',
              '''def _manage_webhooks(interaction: discord.Interaction) -> bool:\n    member = interaction.user\n    if not isinstance(member, discord.Member):\n        return False\n    return bool(member.guild_permissions.administrator or member.guild_permissions.manage_webhooks)\n\n\ndef _can_send_messages(interaction: discord.Interaction) -> bool:\n    channel = _text_channel(interaction)\n    member = interaction.user\n    if channel is None or not isinstance(member, discord.Member):\n        return False\n    return bool(channel.permissions_for(member).send_messages)\n\n\nasync def _private(''',
          )

          replace_once(
              '''    async def poll(self, interaction: discord.Interaction, button: discord.ui.Button) -> None:\n        _ = button\n        if _text_channel(interaction) is None:\n            return await _private(interaction, "❌ Create polls inside a normal text channel.")\n        await interaction.response.send_modal(NativePollModal())''',
              '''    async def poll(self, interaction: discord.Interaction, button: discord.ui.Button) -> None:\n        _ = button\n        if _text_channel(interaction) is None:\n            return await _private(interaction, "❌ Create polls inside a normal text channel.")\n        if not _can_send_messages(interaction):\n            return await _private(interaction, "❌ You need **Send Messages** in this channel to create a poll.")\n        await interaction.response.send_modal(NativePollModal())''',
          )

          replace_once(
              '''        try:\n            existing = await get_sticky(int(channel.id))\n            sticky = StickyConfig(''',
              '''        try:\n            validated_poll = normalize_poll(poll)\n            existing = await get_sticky(int(channel.id))\n            sticky = StickyConfig(''',
          )

          replace_once(
              '''            saved_sticky = await save_sticky(sticky)\n            saved_poll = await save_sticky_poll(poll)''',
              '''            saved_sticky = await save_sticky(sticky)\n            saved_poll = await save_sticky_poll(validated_poll)''',
          )

          replace_once(
              '''    async def on_submit(self, interaction: discord.Interaction) -> None:\n        channel = _text_channel(interaction)\n        if channel is None:\n            return await _private(interaction, "❌ Create polls inside a normal text channel.")\n        options = []''',
              '''    async def on_submit(self, interaction: discord.Interaction) -> None:\n        channel = _text_channel(interaction)\n        if channel is None:\n            return await _private(interaction, "❌ Create polls inside a normal text channel.")\n        if not _can_send_messages(interaction):\n            return await _private(interaction, "❌ You need **Send Messages** in this channel to create a poll.")\n        options = []''',
          )

          path.write_text(text, encoding="utf-8")

          static_path = Path("tools/test_community_tools_static.py")
          static = static_path.read_text(encoding="utf-8")
          marker = '''\ndef test_image_ai_is_explicitly_provider_gated() -> None:\n'''
          addition = '''\ndef test_poll_posting_respects_member_channel_permissions_and_validates_before_sticky_write() -> None:\n    assert UI.count("_can_send_messages(interaction)") >= 2\n    assert "You need **Send Messages** in this channel to create a poll." in UI\n\n    sticky_poll = UI.split("class StickyPollModal", 1)[1].split("class StickyPollControlView", 1)[0]\n    assert "validated_poll = normalize_poll(poll)" in sticky_poll\n    assert sticky_poll.index("validated_poll = normalize_poll(poll)") < sticky_poll.index("saved_sticky = await save_sticky(sticky)")\n    assert "save_sticky_poll(validated_poll)" in sticky_poll\n\n\n'''
          if marker not in static:
              raise SystemExit("static test insertion marker missing")
          if "test_poll_posting_respects_member_channel_permissions" not in static:
              static = static.replace(marker, addition + marker, 1)
          static_path.write_text(static, encoding="utf-8")
          PY

      - name: Run focused static guard
        shell: bash
        run: python tools/test_community_tools_static.py

      - name: Commit final safety changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- stoney_verify/commands_ext/public_community_tools.py tools/test_community_tools_static.py; then
            echo "No finalizer changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stoney_verify/commands_ext/public_community_tools.py tools/test_community_tools_static.py
          git commit -m "fix: harden community poll safety"
          git push origin HEAD:feature/ds-sticky-026-smart-community-tools
