name: DS-DESIGN-030 Final Majority Audit

on:
  push:
    branches:
      - fix/dank-design-consistency-locks

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Derive majority strength from detected layout
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path("stoney_verify/services/server_design_majority_layout.py")
          text = service_path.read_text(encoding="utf-8")
          old = '    out["strength"] = max(desired_strength, min(5, _safe_int(out.get("strength"), desired_strength)))\n'
          new = '    out["strength"] = desired_strength\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one majority strength assignment, found {count}")
          service_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_server_design_majority_layout.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_majority_strength_is_derived_from_detected_components_not_old_draft()"
          if marker not in tests:
              tests += '''


def test_majority_strength_is_derived_from_detected_components_not_old_draft():
    names = [
        "💬│general",
        "📢│announcements",
        "🎮│gaming",
    ]
    analysis = majority.infer_live_majority_layout(studio, _records(names))
    options = majority.apply_majority_to_options(
        studio,
        {"theme_id": "gothic_clean", "strength": 5},
        analysis,
    )

    assert analysis["font"]["id"] == "normal"
    assert options["separator_id"] == "bar_thin"
    assert options["strength"] == 2
'''
          test_path.write_text(tests, encoding="utf-8")
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest
      - name: Validate final majority repair
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
        run: |
          python -m compileall -q stoney_verify tests/test_server_design_majority_layout.py
          python -m pytest tests/test_server_design_majority_layout.py tests/test_server_design_category_aware_auto_detect.py tests/test_server_design_majority_repair_safety.py tests/test_dank_design_consistency_030.py -q --tb=short
          python tools/audit_dank_design_smart_auto_detect.py
          git diff --check
      - name: Commit clean final repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ds-design-030-final-audit.yml
          git add stoney_verify/services/server_design_majority_layout.py tests/test_server_design_majority_layout.py
          git commit -m "DS-DESIGN-030: derive majority strength from live layout"
          git push origin HEAD:fix/dank-design-consistency-locks
