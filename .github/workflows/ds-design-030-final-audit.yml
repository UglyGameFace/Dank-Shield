name: DS-DESIGN-030 Final Majority Audit

on:
  push:
    branches:
      - fix/dank-design-consistency-locks

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply final majority repair
        run: python .github/scripts/ds_design_030_final_audit.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest
      - name: Validate final majority repair
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
        run: |
          python -m compileall -q stoney_verify tests/test_server_design_majority_layout.py
          python -m pytest tests/test_server_design_majority_layout.py tests/test_server_design_category_aware_auto_detect.py tests/test_server_design_majority_repair_safety.py tests/test_dank_design_consistency_030.py -q --tb=short
          python tools/audit_dank_design_smart_auto_detect.py
          git diff --check
      - name: Commit clean final repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ds-design-030-final-audit.yml .github/scripts/ds_design_030_final_audit.py
          git add stoney_verify/services/server_design_majority_layout.py tests/test_server_design_majority_layout.py
          git commit -m "DS-DESIGN-030: derive majority strength from live layout"
          git push origin HEAD:fix/dank-design-consistency-locks
