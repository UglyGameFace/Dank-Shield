name: UI First Full Test Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Run complete unit suite and capture output
        id: pytest
        continue-on-error: true
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
        run: |
          set +e
          python -m pytest tests/ -q --tb=long --disable-warnings > /tmp/ui-first-full-pytest.log 2>&1
          status=$?
          set -e
          cat /tmp/ui-first-full-pytest.log
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload complete failure log
        uses: actions/upload-artifact@v4
        with:
          name: ui-first-full-pytest-log
          path: /tmp/ui-first-full-pytest.log
          if-no-files-found: error
          retention-days: 1

      - name: Preserve failing status
        if: steps.pytest.outputs.status != '0'
        run: exit 1
