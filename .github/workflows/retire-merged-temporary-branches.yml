name: Retire merged temporary branches

# Only opt-in temporary branch namespaces are eligible. This is deliberately
# separate from the owner-reviewed historical cleanup workflow.
on:
  push:
    branches:
      - main # Also run after validated integration; scheduled triggers may be delayed or disabled
  schedule:
    - cron: '*/5 * * * *' # Frequent guarded cleanup; GitHub may delay scheduled starts
  # Called only by the owner-validated issue_comment relay on main.
  # Keep all deletion checks in this one authoritative workflow.
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      confirmation:
        required: false
        type: string
      live_discloud_branch:
        required: false
        type: string
      live_discloud_branch_ack:
        required: false
        type: string
      batch_index:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview only, or retire verified merged temporary branches'
        required: true
        type: choice
        options:
          - preview
          - delete
          - preview-reviewed-merged
          - delete-reviewed-merged
        default: preview
      batch_index:
        description: 'Stable zero-based opt-in batch index for owner preview/delete (default 0)'
        type: string
        required: false
      confirmation:
        description: 'Exact token from reviewed preview'
        type: string
        required: false
      live_discloud_branch:
        description: 'Owner-verified current Discloud-linked branch (optional manual override)'
        type: string
        required: false
      live_discloud_branch_ack:
        description: 'Type I_VERIFIED_LIVE_DISCLOUD_BRANCH for manual override'
        type: string
        required: false

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: guarded-merged-branch-cleanup
  cancel-in-progress: false

jobs:
  merged-ephemeral-only:
    if: ${{ github.repository == 'UglyGameFace/Dank-Shield' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify merger and exact head before retiring temporary branches
        uses: actions/github-script@v7
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          LINKED_PRODUCTION_BRANCH: ${{ vars.DANK_DISCLOUD_DEPLOY_BRANCH }}
          MANUAL_DEPLOY_BRANCH: ${{ inputs.live_discloud_branch }}
          MANUAL_DEPLOY_ACK: ${{ inputs.live_discloud_branch_ack }}
          CLEANUP_CONFIRMATION: ${{ inputs.confirmation }}
          CLEANUP_BATCH_INDEX: ${{ inputs.batch_index }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const fullName = owner + '/' + repo;
            if (fullName !== 'UglyGameFace/Dank-Shield') {
              throw new Error('Unexpected repo');
            }
            const repoMetadata = (await github.rest.repos.get({ owner, repo })).data;
            const defaultBranch = repoMetadata.default_branch;
            if (defaultBranch !== 'main') {
              throw new Error('Fail closed: default branch changed');
            }

            // A branch name opts in to automation. Backups, deployment,
            // recovery, old feat/fix and all other namespaces are excluded.
            const eligible = [
              /^work\/dankshield-[a-z0-9-]+-20\d{6}$/,
              /^migration\/dankshield-[a-z0-9-]+-20\d{6}$/
            ];
            const isEligible = name => eligible.some(pattern => pattern.test(name));
            const configuredDeployBranch = String(process.env.LINKED_PRODUCTION_BRANCH || '').trim();
            // Reusable workflow calls inherit the caller's issue_comment
            // event and actor. Never treat arbitrary comments as owner review.
            const ownerCommentRelay = context.eventName === 'issue_comment' &&
              context.actor === 'UglyGameFace' &&
              context.payload.comment?.user?.login === 'UglyGameFace' &&
              context.payload.issue?.number === 788 &&
              Boolean(context.payload.issue?.pull_request) &&
              String(context.payload.comment?.body || '').startsWith('DANK_SHIELD_CLEANUP_V1 ');
            const isManual = context.eventName === 'workflow_dispatch' || ownerCommentRelay;
            const mode = isManual ? process.env.REQUESTED_MODE : 'delete';
            // Owner can attest the actual Discloud-linked branch in a manual
            // preview/delete pair without changing repository variables.
            // Scheduled and push runs NEVER accept an input override.
            const manualDeployBranch = isManual
              ? String(process.env.MANUAL_DEPLOY_BRANCH || '').trim() : '';
            if (manualDeployBranch) {
              if (context.actor !== 'UglyGameFace' ||
                  process.env.MANUAL_DEPLOY_ACK !== 'I_VERIFIED_LIVE_DISCLOUD_BRANCH') {
                throw new Error('Manual deployment ref requires owner attestation');
              }
              if (configuredDeployBranch && configuredDeployBranch !== manualDeployBranch) {
                throw new Error('Manual deployment ref disagrees with configured ref; resolve conflict first');
              }
            }
            const effectiveDeployBranch = manualDeployBranch || configuredDeployBranch;
            const protectedHeads = new Set([
              'main',
              'aaa-cinema-pre-pregateway-bind',
              'backup/stoneyverify-stable-7fdc331-20261008',
              configuredDeployBranch,
              effectiveDeployBranch
            ]);
            // An owner-entered branch name is not sufficient by itself:
            // verify that the ref still exists before permitting deletion.
            let deploymentBranchConfigured = false;
            if (effectiveDeployBranch) {
              try {
                const deployed = (await github.rest.repos.getBranch({
                  owner, repo, branch: effectiveDeployBranch
                })).data;
                deploymentBranchConfigured = Boolean(deployed.commit?.sha);
              } catch (error) {
                core.warning('Discloud deployment branch cannot be resolved; deletion disabled');
              }
            }
            if (!['preview', 'delete', 'preview-reviewed-merged', 'delete-reviewed-merged'].includes(mode) &&
                !['preview-rejected', 'delete-rejected', 'preview-reconciled', 'delete-reconciled'].includes(mode)) {
              throw new Error('Unsupported branch hygiene mode');
            }
            if (isManual && mode === 'delete' && context.actor !== 'UglyGameFace') {
              throw new Error('Manual deletion requires repository owner');
            }
            // No deletion path may run without a resolved deployment ref.
            // Scheduled runs remain archive-only until this evidence exists.
            if (isManual && mode === 'delete' && !deploymentBranchConfigured) {
              throw new Error('Verify DANK_DISCLOUD_DEPLOY_BRANCH before deleting any refs');
            }
            const deleting = mode === 'delete' && deploymentBranchConfigured;

            // Historical squash/rebase PR heads can retain unique commit IDs.
            // Require exact changed-path equivalence at their immutable PR
            // merge commit; never infer integration from PR status alone.
            // A squash/rebase PR can leave unique commit IDs even when every
            // changed path was integrated. Prove equivalence against the
            // actual PR merge commit, NOT moving main (which may later edit
            // the same files). Never infer equivalence from PR status alone.
            // The original branch SHA is archived before any deletion.
            const equivalentAtMerge = async (branch, pr, graph) => {
              const fork = graph.merge_base_commit?.sha;
              if (!fork || !Number.isInteger(graph.ahead_by) ||
                  graph.ahead_by < 1 || graph.ahead_by > 100) return false;
              const delta = (await github.rest.repos.compareCommits({
                owner, repo, base: fork, head: branch.commit.sha
              })).data;
              // GitHub's compare files cap is 300. Hold oversized/unknown
              // changes rather than accidentally comparing a partial list.
              if (delta.status !== 'ahead' || delta.ahead_by !== graph.ahead_by ||
                  !Number.isInteger(delta.total_commits) || delta.total_commits > 100 ||
                  !Array.isArray(delta.files) ||
                  !delta.files.length || delta.files.length >= 300) return false;
              const paths = new Set();
              for (const file of delta.files) {
                if (!['added','modified','removed','renamed','copied','changed']
                    .includes(file.status) || !file.filename) return false;
                paths.add(file.filename);
                if (file.previous_filename) paths.add(file.previous_filename);
              }
              const [merged, branchTree] = await Promise.all([
                github.rest.git.getTree({
                  owner, repo, tree_sha: pr.merge_commit_sha, recursive: 'true'
                }),
                github.rest.git.getTree({
                  owner, repo, tree_sha: branch.commit.sha, recursive: 'true'
                }),
              ]);
              if (merged.data.truncated || branchTree.data.truncated ||
                  !Array.isArray(merged.data.tree) ||
                  !Array.isArray(branchTree.data.tree)) return false;
              const entries = tree => new Map(tree.data.tree
                .filter(x => x.type !== 'tree')
                .map(x => [x.path, {sha:x.sha, mode:x.mode, type:x.type}]));
              const mergedFiles = entries(merged);
              const branchFiles = entries(branchTree);
              // Absence on both sides proves an intentional deletion. Match
              // object SHA, type and executable/symlink mode for every path.
              return [...paths].every(path => {
                const a = mergedFiles.get(path), b = branchFiles.get(path);
                return (!a && !b) || (a && b &&
                  a.sha === b.sha && a.mode === b.mode && a.type === b.type);
              });
            };
            // Feature recovery/release behavior is not a recovery or release checkpoint.
            // Continue holding recovery/*, backups, deployment, database and
            // rollback refs. All candidates still need exact PR/main proof.
            const hasHeldHistoricalSegment = (name, held) =>
              name.split(/[\\/_-]+/).some(part => {
                const segment = part.toLowerCase();
                const feature = name.startsWith('feat/');
                const fix = name.startsWith('fix/');
                // Recovery and release describe product behavior in these
                // namespaces, not a deployment/restore checkpoint.
                const functional = (segment === 'recovery' && (feature || fix)) ||
                  (segment === 'release' && feature);
                return held.has(segment) && !functional;
              });
            const reviewed = mode === 'preview-reviewed-merged' || mode === 'delete-reviewed-merged';
            if (reviewed) {
              if (!isManual || context.actor !== 'UglyGameFace') {
                throw new Error('Owner dispatch required');
              }
              const deleteReviewed = mode === 'delete-reviewed-merged';
              if (deleteReviewed && !deploymentBranchConfigured) {
                throw new Error('Verify and set DANK_DISCLOUD_DEPLOY_BRANCH before deleting reviewed refs');
              }
              const mainSha = (await github.rest.repos.getBranch({
                owner, repo, branch: 'main'
              })).data.commit.sha;
              const branches = await github.paginate(github.rest.repos.listBranches, {
                owner, repo, per_page: 100
              });
              const openPRs = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', per_page: 100
              });
              const inUse = new Set();
              for (const pr of openPRs) {
                if (pr.head.repo?.full_name === fullName) inUse.add(pr.head.ref);
                if (pr.base.repo?.full_name === fullName) inUse.add(pr.base.ref);
              }
              const prefixes = ['feat/', 'fix/', 'hotfix/', 'extract/', 'docs/', 'audit/', 'chore/'];
              const heldPrefixes = [
                'aaa-', 'archive/', 'backup/', 'recovery/', 'integration/',
                'reconcile/', 'release/', 'deploy/', 'ops/', 'ci/', 'migration/'
              ];
              const sensitive = new Set([
                'backup','restore','recovery','archive','release','deploy',
                'deployment','discloud','staging','migration','supabase',
                'database','postgres','production','rollback','revert',
                'snapshot','stable','known','good'
              ]);
              // Exact historical integration refs reviewed against main on 2026-11-02.
              // Despite sensitive words in their names, each has ZERO commits
              // ahead of main. Preserve the immutable head in an archive tag
              // before retirement. This exception is never valid for a
              // divergent ref, a backup/archive/recovery namespace, or a
              // protected/active branch; the deletion leases remain mandatory.
              // PR #745 merged this read-only audit into main. Its exact branch
              // tip is an ancestor of main; archiving the commit preserves the
              // historical rollback/backup documentation without retaining a
              // redundant audit branch. Do not broaden to backup/* or other
              // production checkpoint refs.
              const integratedCleanupRefs = new Set([
                'audit/idle-grow-discloud-backup-retire-aiven-20261026',
                'extract/discloud-packaging-gate-20261025',
                'fix/dankshield-live-migration-history-20261031',
                'fix/dankshield-live-migration-target-20261022',
                'fix/discloud-pg-audit-test-20261027',
                'fix/discloud-pg-guild-readiness-20261027',
                'fix/discloud-pg-readiness-regression-20261027',
                'fix/discloud-pg-runtime-inventory-20261027',
                'fix/postgres-production-caller-inventory-20261028',
                'fix/supabase-egress-configuration-20261028',
              ]);
              // PR #789's original branch head was proven byte-for-byte equal
              // to its merged tree on every changed path, and its merge commit
              // is an ancestor of main. It is an obsolete implementation ref,
              // not a deployment, rollback, or backup. Do not open the work/
              // namespace generally: only this SHA may enter reviewed cleanup.
              const reconciledWorkHeads = new Map([
                ['work/dankshield-owner-cleanup-relay-20261101',
                 'bafe17a86225d71700f65496fb8339190418792f'],
              ]);
              const safeName = name =>
                (prefixes.some(p => name.startsWith(p)) ||
                 reconciledWorkHeads.has(name)) &&
                !heldPrefixes.some(p => name.startsWith(p)) &&
                !protectedHeads.has(name) &&
                (!hasHeldHistoricalSegment(name, sensitive) ||
                 integratedCleanupRefs.has(name));
              // Owner-reviewed cleanup has an exact-SHA preview token and
              // fresh main/PR/ref leases. The 48-hour cooldown remains on
              // unattended cleanup, not on explicitly approved owner batches.
              // Fetch the PR history once, not once per branch. With hundreds
              // of stale refs, per-ref pagination can exhaust the 12m job
              // before the owner receives an actionable preview. Preserve
              // the original exactly-one-PR and exact-head requirements.
              const allPRs = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'all', per_page: 100
              });
              // Two stacked feature heads: #724 reached main, but #725 merged
              // into the feature branch. PR #803 explicitly ports #725 into
              // main. Retire only these exact SHAs, after that integration
              // merges, exact-main CI passes, and current main still contains
              // its executable tests and UI hooks. This is NOT a blanket
              // exception for old feature branches or backup refs.
              const stackedPickerHeads = new Map([
                ['fix/legacy-use-this-channel-20261025',
                 '65992a7c414ea09a9557c47ac2065636d01faa34'],
                ['fix/shared-use-this-channel-20261025',
                 '2416f81a002b3a57da678c6bab1e3c1b84ba3eed']
              ]);
              const prsByHead = new Map();
              for (const pr of allPRs) {
                if (pr.head?.repo?.full_name !== fullName || !pr.head.ref) continue;
                const matches = prsByHead.get(pr.head.ref) || [];
                matches.push(pr);
                prsByHead.set(pr.head.ref, matches);
              }
              const eligible = [];
              for (const branch of branches) {
                if (branch.protected || inUse.has(branch.name) || !safeName(branch.name) ||
                  (reconciledWorkHeads.has(branch.name) &&
                   reconciledWorkHeads.get(branch.name) !== branch.commit.sha)) continue;
                const prs = prsByHead.get(branch.name) || [];
                // Owner-reviewed fast-forward ancestry proof: a branch with zero
                // commits ahead of main is already contained byte-for-byte in
                // main's history. Still require exact-SHA preview, archive and
                // deletion leases below. Never extend to divergent branches.
                const branchGraph = (await github.rest.repos.compareCommits({
                  owner, repo, base: mainSha, head: branch.commit.sha
                })).data;
                if (integratedCleanupRefs.has(branch.name) &&
                    (branchGraph.ahead_by !== 0 ||
                     !['behind', 'identical'].includes(branchGraph.status))) continue;
                if (branchGraph.ahead_by === 0 &&
                    ['behind', 'identical'].includes(branchGraph.status)) {
                  eligible.push({name: branch.name, sha: branch.commit.sha,
                    pr: null, proof: 'ancestor-of-main'});
                  continue;
                }
                if (stackedPickerHeads.has(branch.name)) {
                  if (stackedPickerHeads.get(branch.name) !== branch.commit.sha) continue;
                  const port = allPRs.find(pr => pr.number === 803);
                  if (!port || port.state !== 'closed' || !port.merged_at ||
                      port.base?.ref !== 'main' ||
                      port.base?.repo?.full_name !== fullName ||
                      port.head?.repo?.full_name !== fullName ||
                      !port.merge_commit_sha) continue;
                  const portAncestry = (await github.rest.repos.compareCommits({
                    owner, repo, base: port.merge_commit_sha, head: mainSha
                  })).data;
                  if (portAncestry.behind_by !== 0 ||
                      !['ahead','identical'].includes(portAncestry.status)) continue;
                  const runs = (await github.rest.actions.listWorkflowRunsForRepo({
                    owner,repo,head_sha:mainSha,per_page:100
                  })).data.workflow_runs || [];
                  if (!runs.some(run => run.name === 'Dank Shield CI' &&
                      run.status === 'completed' && run.conclusion === 'success')) continue;
                  const requirements = [
                    ['tests/test_use_this_channel_legacy.py', null,
                     'e3b842b66709667651229cd5e4717a81fedc1f60'],
                    ['stoney_verify/commands_ext/public_setup_picker.py',
                     '_CurrentLogTargetMenu'],
                    ['stoney_verify/commands_ext/public_setup_recommend.py',
                     'GuidedUseCurrentChannelButton'],
                    ['stoney_verify/commands_ext/public_live_captions.py',
                     '_save_output_channel'],
                    ['stoney_verify/roles_center_services.py',
                     'Use This Channel: Pronouns']
                  ];
                  let verified = true;
                  for (const [path, marker, expectedSha] of requirements) {
                    const file = (await github.rest.repos.getContent({
                      owner,repo,path,ref:mainSha
                    })).data;
                    if (Array.isArray(file) || !file.sha ||
                        (expectedSha && file.sha !== expectedSha) ||
                        (marker && !Buffer.from(file.content || '', 'base64')
                          .toString('utf8').includes(marker))) {
                      verified = false;
                      break;
                    }
                  }
                  if (!verified) continue;
                  eligible.push({name:branch.name,sha:branch.commit.sha,
                    pr:803,proof:'stacked-picker-ported-to-main-and-tested'});
                  continue;
                }
                if (prs.length !== 1) continue;
                const pr = prs[0];
                if (!pr.merged_at || pr.state !== 'closed' ||
                    (!Number.isFinite(Date.parse(pr.merged_at)) ||
                     Date.parse(pr.merged_at) > Date.now()) ||
                    pr.base?.ref !== 'main' || pr.base?.repo?.full_name !== fullName ||
                    pr.head?.repo?.full_name !== fullName ||
                    pr.head.sha !== branch.commit.sha || !pr.merge_commit_sha) continue;
                // A merged PR does not prove its branch tip is in main:
                // squash/rebase histories can retain unique commits. Hold
                // those refs for explicit content reconciliation instead.
                if (branchGraph.ahead_by !== 0 ||
                    !['behind', 'identical'].includes(branchGraph.status)) {
                  if (!await equivalentAtMerge(branch, pr, branchGraph)) continue;
                }
                const graph = (await github.rest.repos.compareCommits({
                  owner, repo, base: pr.merge_commit_sha, head: mainSha
                })).data;
                if (graph.behind_by !== 0 ||
                    !['ahead', 'identical'].includes(graph.status)) continue;
                eligible.push({name: branch.name, sha: branch.commit.sha, pr: pr.number});
              }
              eligible.sort((a,b) => a.name.localeCompare(b.name));
              const batch = eligible.slice(0, 12);
              const fingerprint = require('crypto').createHash('sha256')
                .update(JSON.stringify({mainSha,batch,effectiveDeployBranch})).digest('hex')
                .slice(0, 16).toUpperCase();
              const token = 'DELETE_REVIEWED_' + fingerprint;
              // The action run summary is not accessible to all authorized
              // GitHub connectors. Log the exact owner-only preview plan and
              // SHA-bound confirmation so a verified owner can execute it.
              // The token is not a credential: the target still verifies the
              // authenticated actor, live ref, current main and branch leases.
              if (!deleteReviewed) {
                core.info('Reviewed retirement preview: ' + JSON.stringify({
                  mainSha, effectiveDeployBranch, eligible: eligible.length,
                  before: branches.length, batch
                }));
                core.info('Reviewed retirement confirmation token: ' + token);
              }
              if (deleteReviewed && process.env.CLEANUP_CONFIRMATION !== token) {
                throw new Error('Delete requires exact preview token bound to main and branch SHAs');
              }
              const retired = [], held = [];
              for (const item of batch) {
                if (!deleteReviewed) continue;
                try {
                  const currentMain = (await github.rest.repos.getBranch({
                    owner, repo, branch: 'main'
                  })).data.commit.sha;
                  const current = (await github.rest.repos.getBranch({
                    owner, repo, branch: item.name
                  })).data;
                  const nowOpen = await github.paginate(github.rest.pulls.list, {
                    owner, repo, state: 'open', per_page: 100
                  });
                  if (currentMain !== mainSha || current.protected ||
                      current.commit.sha !== item.sha ||
                      nowOpen.some(pr => pr.head.ref === item.name || pr.base.ref === item.name)) {
                    held.push(item.name + ': branch, main or PR changed');
                    continue;
                  }
                  const tag = 'tags/branch-retirement-reviewed-20261031/' + item.name;
                  let archive;
                  try {
                    archive = (await github.rest.git.getRef({owner,repo,ref:tag})).data;
                  } catch (error) {
                    if (error.status !== 404) throw error;
                    await github.rest.git.createRef({
                      owner,repo,ref:'refs/' + tag,sha:item.sha
                    });
                    archive = (await github.rest.git.getRef({owner,repo,ref:tag})).data;
                  }
                  if (archive.object.type !== 'commit' || archive.object.sha !== item.sha) {
                    held.push(item.name + ': archive mismatch');
                    continue;
                  }
                  const lease = (await github.rest.git.getRef({
                    owner,repo,ref:'heads/' + item.name
                  })).data;
                  if (lease.object.sha !== item.sha) {
                    held.push(item.name + ': SHA lease changed');
                    continue;
                  }
                  await github.rest.git.deleteRef({owner,repo,ref:'heads/' + item.name});
                  retired.push(item);
                } catch (error) {
                  held.push(item.name + ': ' + String(error.message || error));
                }
              }
              const after = await github.paginate(github.rest.repos.listBranches, {
                owner,repo,per_page:100
              });
              await core.summary.addHeading('Reviewed merged-branch retirement')
                .addRaw('Main: ' + mainSha + '; eligible: ' + eligible.length +
                  '; batch: ' + batch.length + '; before: ' + branches.length +
                  '; after: ' + after.length + '; deleted: ' + retired.length + '.\n')
                .addRaw('Exact preview token: ' + token + '\n')
                .addCodeBlock(JSON.stringify({batch,retired,held},null,2),'json').write();
              if (held.length) core.setFailed('Some reviewed refs were held');
              return;
            }


            // Explicit owner rejection: these exact historical feature heads have
            // no requested runtime integration. Preserve their entire commits in
            // immutable-SHA archive refs before deleting their branch pointers.
            // No wildcard names, no automatic/scheduled invocation.
            if (['preview-rejected', 'delete-rejected', 'preview-reconciled', 'delete-reconciled'].includes(mode)) {
              if (!isManual || !ownerCommentRelay || context.actor !== 'UglyGameFace' ||
                  !deploymentBranchConfigured) {
                throw new Error('Rejected-work retirement requires owner relay and verified deployment branch');
              }
              const reconciled = mode.endsWith('-reconciled');
              const deleting = mode.startsWith('delete-');
              // Reconciled refs require a proven merged replacement, not just
              // an owner's desire to remove an old branch.
              if (reconciled) {
                const replacement = (await github.rest.pulls.get({owner,repo,pull_number:806})).data;
                if (!replacement.merged_at || replacement.base?.ref !== 'main' ||
                    replacement.head?.ref !== 'fix/reconcile-private-interaction-ingress-tracing-20261102' ||
                    !replacement.merge_commit_sha) {
                  throw new Error('PR #806 replacement is not merged into main');
                }
                const currentMain = (await github.rest.repos.getBranch({owner,repo,branch:'main'})).data.commit.sha;
                const ancestry = (await github.rest.repos.compareCommits({
                  owner,repo,base:replacement.merge_commit_sha,head:currentMain
                })).data;
                if (ancestry.behind_by !== 0 || !['ahead','identical'].includes(ancestry.status)) {
                  throw new Error('PR #806 replacement merge is not an ancestor of main');
                }
                // PR #310 was closed explicitly as superseded by merged #311.
                // Its six unique commits are not an excuse to discard work:
                // verify exact original head, the replacement's main ancestry,
                // and the current canonical panel aliases/restart regression.
                const historical = (await github.rest.pulls.get({
                  owner,repo,pull_number:310
                })).data;
                if (historical.state !== 'closed' || historical.merged_at ||
                    historical.head?.ref !== 'fix/ticket-panel-legacy-interaction-recovery-20260924' ||
                    historical.head?.sha !== '51d28415d13ba5b08b6632d04ea4f48e7ab29e6e' ||
                    !String(historical.body || '').includes('Superseded by PR #311')) {
                  throw new Error('PR #310 is not verified superseded at its exact head');
                }
                const ticketReplacement = (await github.rest.pulls.get({
                  owner,repo,pull_number:311
                })).data;
                if (!ticketReplacement.merged_at || ticketReplacement.base?.ref !== 'main' ||
                    !ticketReplacement.merge_commit_sha) {
                  throw new Error('PR #311 ticket replacement is not merged into main');
                }
                const ticketAncestry = (await github.rest.repos.compareCommits({
