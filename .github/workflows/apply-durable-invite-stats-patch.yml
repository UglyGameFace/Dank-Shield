name: Apply Durable Invite Stats Patch

on:
  push:
    branches:
      - fix/dank-stats-invite-block-counting
    paths:
      - tools/apply_durable_invite_stats_patch.py
      - .github/workflows/apply-durable-invite-stats-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dank-stats-invite-block-counting
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact source edits
        run: python tools/apply_durable_invite_stats_patch.py
      - name: Commit exact source edits and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Wire durable invite-block stats into central policy"
          git push origin HEAD:fix/dank-stats-invite-block-counting
