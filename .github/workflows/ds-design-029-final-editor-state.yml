                          await interaction.response.send_modal(StyleChangeFixMissingEmojiModal(items=missing[:5], separator_id=_safe_str(pending.get("separator_id"), "none"), pending_created_at=self.pending_created_at))
                      await _guard_design_action(interaction, "design.style_change.fix_missing_icons_modal", action, defer=False)


              class StyleChangePreviewView(DesignPreviewView):
                  def __init__(self, *, can_apply: bool, has_blockers: bool = False, pending_created_at: float) -> None:
                      super().__init__(can_apply=can_apply, pending_created_at=pending_created_at)
                      if has_blockers:
                          self.add_item(StyleChangeFixMissingEmojiButton(row=2, pending_created_at=pending_created_at))
                          self.add_item(StyleChangeApplySafeOnlyButton(row=2, pending_created_at=pending_created_at))
              ''').lstrip(),
              "style change state controls",
          )

          # Review Name Drift and Preview Saved Design are also immutable reviewed plans.
          home_start = text.index("class DesignHomeView")
          home_end = text.index("class DesignPreviewView", home_start)
          home = text[home_start:home_end]
          home = replace_once(
              home,
              '        key = _key(int(guild.id), int(interaction.user.id))\n        _PENDING[key] = {\n            "created_at": time.time(),\n            "items": items,\n            "options": dict(repair_options),\n            "mode": "consistency_check",\n        }\n',
              '        created_at = _store_pending(int(guild.id), int(interaction.user.id), {"items": items, "options": dict(repair_options), "mode": "consistency_check"})\n',
              "home consistency pending",
          )
          home = replace_once(
              home,
              "            view=DesignPreviewView(can_apply=not has_blockers and has_changes),\n",
              "            view=DesignPreviewView(can_apply=not has_blockers and has_changes, pending_created_at=created_at),\n",
              "home consistency timestamp",
          )
          home = replace_once(
              home,
              '        _PENDING[_key(int(guild.id), int(interaction.user.id))] = {\n            "created_at": time.time(),\n            "items": items,\n            "options": dict(options),\n            "mode": "preview_server",\n        }\n',
              '        created_at = _store_pending(int(guild.id), int(interaction.user.id), {"items": items, "options": dict(options), "mode": "preview_server"})\n',
              "home saved preview pending",
          )
          home = replace_once(
              home,
              "            view=DesignPreviewView(can_apply=not has_blockers and any(item.get(\"status\") == \"changed\" for item in items)),\n",
              "            view=DesignPreviewView(can_apply=not has_blockers and any(item.get(\"status\") == \"changed\" for item in items), pending_created_at=created_at),\n",
              "home saved preview timestamp",
          )
          text = text[:home_start] + home + text[home_end:]

          # Use the shared predicate in the Apply view too.
          text = replace_once(
              text,
              '        if self.pending_created_at is not None:\n            current_created_at = float(payload.get("created_at") or 0.0)\n            if current_created_at != self.pending_created_at:\n                await interaction.response.send_message(\n                    "❌ This Apply button belongs to an older preview. Reopen the editor and preview the current choices before applying.",\n                    ephemeral=True,\n                )\n                return\n',
              '        if not _pending_matches(payload, self.pending_created_at):\n            await interaction.response.send_message(\n                "❌ This Apply button belongs to an older or invalidated preview. Preview the current choices before applying.",\n                ephemeral=True,\n            )\n            return\n',
              "apply stale predicate",
          )

          path.write_text(text, encoding="utf-8")

          # Majority-guided previews use the same immutable pending identity and
          # count exact manual-name rules as saved owner intent.
          path = Path("stoney_verify/startup_guards/server_design_majority_layout_guard.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '    for key in ("category_format_locks", "channel_format_locks"):\n',
              '    for key in ("category_format_locks", "channel_format_locks", "manual_name_overrides"):\n',
              "majority saved rule count",
          )
          text = replace_once(
              text,
              '            command_guard._PENDING[command_guard._key(int(guild.id), int(interaction.user.id))] = {\n                "created_at": command_guard.time.time(),\n                "items": items,\n                "options": dict(requested),\n                "mode": "consistency_smart_auto_detect",\n            }\n            await interaction.edit_original_response(\n                embed=command_guard._consistency_embed(guild, items, requested),\n                view=command_guard.DesignPreviewView(can_apply=live_apply_allowed),\n            )',
              '            created_at = command_guard._store_pending(\n                int(guild.id), int(interaction.user.id),\n                {"items": items, "options": dict(requested), "mode": "consistency_smart_auto_detect"},\n            )\n            await interaction.edit_original_response(\n                embed=command_guard._consistency_embed(guild, items, requested),\n                view=command_guard.DesignPreviewView(can_apply=live_apply_allowed, pending_created_at=created_at),\n            )',
              "majority smart preview identity",
          )
          text = replace_once(
              text,
              '            command_guard._PENDING[command_guard._key(int(guild.id), int(interaction.user.id))] = {\n                "created_at": command_guard.time.time(),\n                "items": items,\n                "options": dict(options),\n                "mode": "consistency_saved_layout",\n            }\n            await interaction.edit_original_response(\n                embed=_saved_embed(items),\n                view=command_guard.DesignPreviewView(can_apply=not counts.get("failed") and bool(counts.get("needs_fix"))),\n            )',
              '            created_at = command_guard._store_pending(\n                int(guild.id), int(interaction.user.id),\n                {"items": items, "options": dict(options), "mode": "consistency_saved_layout"},\n            )\n            await interaction.edit_original_response(\n                embed=_saved_embed(items),\n                view=command_guard.DesignPreviewView(\n                    can_apply=not counts.get("failed") and bool(counts.get("needs_fix")),\n                    pending_created_at=created_at,\n                ),\n            )',
              "majority saved preview identity",
          )
          path.write_text(text, encoding="utf-8")

          # Strict helper is native-path activated now; tests must load the native
          # module exactly as production does before invoking it.
          path = Path("tests/test_server_design_strict_layout_guard.py")
          text = path.read_text(encoding="utf-8")
          if "from stoney_verify.commands_ext import public_design_studio" not in text:
              text = text.replace(
                  "from stoney_verify.services import server_design_studio as studio\n",
                  "from stoney_verify.services import server_design_studio as studio\nfrom stoney_verify.commands_ext import public_design_studio  # noqa: F401\n",
                  1,
              )
          path.write_text(text, encoding="utf-8")

          # Extend regressions around the user-visible authority contract.
          path = Path("tests/test_dank_design_editor_state_authority.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from stoney_verify.services import server_design_studio as studio\n",
              "from stoney_verify.services import server_design_studio as studio\nfrom stoney_verify.commands_ext import public_design_studio as public_studio\n",
              1,
          )
          addition = dedent('''


          def test_manual_name_override_preserves_literal_name_without_normalizing() -> None:
              item = public_studio._manual_name_override_plan_item(
                  "old-category",
                  "My Exact Category Name",
                  kind="category",
                  channel_id=123,
                  category_id=123,
              )
              assert item["after"] == "My Exact Category Name"
              assert item["status"] == "changed"
              assert item["format_lock_scope"] == "manual_name"


          def test_direct_rename_runs_inside_guard_and_saves_exact_name() -> None:
              start = PUBLIC_STUDIO.index("class DirectRenameModal")
              end = PUBLIC_STUDIO.index("def _category_action_embed", start)
              block = PUBLIC_STUDIO[start:end]
              assert 'await _guard_design_action(interaction, "design.direct_rename", action, defer=False)' in block
              assert "await _save_manual_name_override(" in block
              assert block.index("guild = interaction.guild") < block.index("await channel.edit(")


          def test_direct_rename_refresh_prefers_live_api() -> None:
              start = PUBLIC_STUDIO.index("async def _direct_rename_fetch_target")
              end = PUBLIC_STUDIO.index("def _direct_rename_result_value", start)
              block = PUBLIC_STUDIO[start:end]
              assert "await guild.fetch_channel" in block
              assert block.index("await guild.fetch_channel") < block.index("return cached if cached is not None else fallback")


          def test_manual_name_override_outranks_style_plan_and_is_unlockable() -> None:
              assert 'manual_override = _manual_name_override_for(options, channel_id)' in PUBLIC_STUDIO
              assert '"format_lock_scope": "manual_name"' in PUBLIC_STUDIO
              assert 'elif scope == "manual_name":' in PUBLIC_STUDIO
              assert 'options["manual_name_overrides"] = {}' in PUBLIC_STUDIO


          def test_item_lock_buttons_capture_live_item_style_not_global_preset() -> None:
              assert 'scope="category", target_id=self.category_id, target=category' in PUBLIC_STUDIO
              assert 'scope="channel", target_id=self.channel_id, target=channel' in PUBLIC_STUDIO
              assert "async def _save_live_target_format_lock(" in PUBLIC_STUDIO


          def test_config_saves_invalidate_old_pending_previews() -> None:
              assert "def _invalidate_pending_for_guild" in PUBLIC_STUDIO
              save_start = PUBLIC_STUDIO.index("async def _save_design_options")
              save_end = PUBLIC_STUDIO.index("def _bot_missing_manage", save_start)
              assert "_invalidate_pending_for_guild(int(guild_id))" in PUBLIC_STUDIO[save_start:save_end]


          def test_style_change_issue_controls_are_bound_to_preview_identity() -> None:
              assert "class StyleChangePreviewView" in PUBLIC_STUDIO
              assert "pending_created_at=pending_created_at" in PUBLIC_STUDIO
              assert "_pending_matches(pending, self.pending_created_at)" in PUBLIC_STUDIO
          ''')
          if "test_manual_name_override_preserves_literal_name_without_normalizing" not in text:
              text = text.rstrip() + addition + "\n"
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate focused Dank Design paths
        shell: bash
