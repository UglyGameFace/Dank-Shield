name: Offline Dank Shield Ticket Precision Repair (manual)

# Separate from the read-only delta audit. Only the owner's pinned OFFLINE
# Supabase candidate may be written. Original source and Discloud excluded.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Approve exact ticket confidence precision correction in OFFLINE candidate only"
        required: true
        type: choice
        options:
          - FIX_OFFLINE_TICKET_CONFIDENCE_PRECISION_ONLY

permissions:
  contents: read

concurrency:
  group: dankshield-offline-ticket-precision-repair
  cancel-in-progress: false

jobs:
  offline-ticket-precision:
    if: ${{ github.repository == 'UglyGameFace/Dank-Shield' && github.ref == 'refs/heads/main' && github.actor == 'UglyGameFace' && inputs.confirmation == 'FIX_OFFLINE_TICKET_CONFIDENCE_PRECISION_ONLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refuse changed main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Main changed after workflow started."
            exit 1
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dedicated candidate connector
        run: python -m pip install -q "psycopg[binary]>=3.2,<4"
      - name: Correct ONLY dedicated candidate ticket precision transactionally
        env:
          DANK_FRESH_DATABASE_URL: ${{ secrets.DANK_FRESH_DATABASE_URL }}
          DANK_TICKET_PRECISION_CONFIRMATION: ${{ inputs.confirmation }}
        run: python -m tools.repair_offline_ticket_confidence_precision
