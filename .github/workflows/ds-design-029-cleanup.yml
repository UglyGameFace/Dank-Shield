name: DS-DESIGN-029 cleanup obsolete persistence shim

on:
  push:
    branches:
      - fix/dank-design-editor-state-authority

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Remove obsolete persisted-lock normalization code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def remove_between(text: str, start: str, end: str, label: str) -> str:
              if text.count(start) != 1:
                  raise SystemExit(f"{label} start count={text.count(start)}")
              start_at = text.index(start)
              end_at = text.index(end, start_at)
              return text[:start_at] + text[end_at:]

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"{label} count={text.count(old)}")
              return text.replace(old, new, 1)

          path = Path("stoney_verify/startup_guards/server_design_strict_layout_guard.py")
          text = path.read_text(encoding="utf-8")
          text = remove_between(
              text,
              "# Existing guild configs may already have locks saved with the old Gothic Clean\n",
              "def _clean_text(value: Any) -> str:\n",
              "legacy Gothic persistence constants",
          )
          text = remove_between(
              text,
              "\n\ndef _clean_key(value: Any) -> str:\n",
              "\n\ndef _frame_signature(studio: Any, value: Any) -> str:\n",
              "obsolete clean-key helper",
          )
          text = remove_between(
              text,
              "\n\ndef _lock_looks_gothic(",
              "\n\ndef _make_strict_match(",
              "obsolete persisted-lock rewrite helpers",
          )
          text = replace_once(
              text,
              "    if _PATCHED:\n        _patch_command_guard_options()\n        return True",
              "    if _PATCHED:\n        return True",
              "apply early persistence hook",
          )
          text = replace_once(
              text,
              "        _PATCHED = True\n        _patch_command_guard_options()\n",
              "        _PATCHED = True\n",
              "apply final persistence hook",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_server_design_strict_layout_guard.py")
          text = path.read_text(encoding="utf-8")
          marker = "\n\ndef test_saved_gothic_locks_preserve_owner_selected_separators():\n"
          if text.count(marker) != 1:
              raise SystemExit(f"obsolete strict normalizer test count={text.count(marker)}")
          text = text[:text.index(marker)].rstrip() + "\n"
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_dank_design_editor_state_authority.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "from stoney_verify.startup_guards import server_design_strict_layout_guard as strict_guard\n",
              "",
              "obsolete strict-guard test import",
          )
          start = "def test_saved_owner_rules_are_not_rewritten_by_gothic_default_normalizer() -> None:\n"
          end = "\n\ndef test_recommended_strength_four_applies_selected_category_frame() -> None:\n"
          replacement = '''def test_strict_layout_guard_has_no_persisted_design_option_rewriter() -> None:
              guard_source = Path("stoney_verify/startup_guards/server_design_strict_layout_guard.py").read_text(encoding="utf-8")

              assert "_patch_command_guard_options" not in guard_source
              assert "_normalize_gothic_lock" not in guard_source
              assert "command_guard._load_design_options" not in guard_source
              assert "command_guard._save_design_options" not in guard_source
          '''
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit(f"editor authority persistence test markers start={text.count(start)} end={text.count(end)}")
          start_at = text.index(start)
          end_at = text.index(end, start_at)
          text = text[:start_at] + replacement + text[end_at:]
          path.write_text(text, encoding="utf-8")

          print("DS-DESIGN-029 persistence cleanup applied")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Validate cleanup and focused regressions
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
        run: |
          python -m py_compile \
            stoney_verify/commands_ext/public_design_studio.py \
            stoney_verify/services/server_design_studio.py \
            stoney_verify/startup_guards/server_design_strict_layout_guard.py \
            tests/test_dank_design_editor_state_authority.py
          python -m pytest -q --tb=short --disable-warnings \
            tests/test_dank_design_editor_state_authority.py \
            tests/test_server_design_category_aware_auto_detect.py \
            tests/test_server_design_strict_layout_guard.py \
            tests/test_public_design_exact_native_guard_patch_static.py
          ! grep -q "_patch_command_guard_options" stoney_verify/startup_guards/server_design_strict_layout_guard.py
          ! grep -q "_normalize_gothic_lock" stoney_verify/startup_guards/server_design_strict_layout_guard.py
          git diff --check

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ds-design-029-cleanup.yml
          git add \
            stoney_verify/startup_guards/server_design_strict_layout_guard.py \
            tests/test_server_design_strict_layout_guard.py \
            tests/test_dank_design_editor_state_authority.py
          git diff --cached --check
          git commit -m "DS-DESIGN-029: remove obsolete design lock rewrite shim"
          git push origin HEAD:fix/dank-design-editor-state-authority
