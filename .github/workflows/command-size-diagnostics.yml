name: Application Command Size Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  command-size:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
      - name: Measure application command character budgets
        id: audit
        shell: bash
        run: |
          set +e
          python tools/diagnose_application_command_size.py > command-size.txt 2>&1
          status=$?
          cat command-size.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: application-command-size
          path: command-size.txt
          if-no-files-found: error
