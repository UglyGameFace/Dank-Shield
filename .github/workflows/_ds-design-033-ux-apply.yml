name: DS Design 033 Redundancy One Shot Patch

on:
  push:
    branches:
      - fix/ds-design-033-editor-separator-reset-correctness

permissions:
  contents: write

jobs:
  patch:
    if: "github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'DS-DESIGN-033: run full redundancy cleanup'"
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ds-design-033-editor-separator-reset-correctness
          fetch-depth: 0

      - name: Apply guarded redundancy cleanup
        run: |
          python tools/_fix_ds_design_033_helper.py
          python tools/_apply_ds_design_033_ux_patch.py
          python -m py_compile \
            stoney_verify/commands_ext/public_design_group.py \
            stoney_verify/commands_ext/public_design_studio.py \
            stoney_verify/commands_ext/public_design_studio_v2.py \
            stoney_verify/services/server_design_plan_service.py \
            stoney_verify/services/server_design_rule_service.py \
            stoney_verify/startup_guards/__init__.py
          git diff --check

      - name: Commit cleaned design ownership
        run: |
          if git diff --quiet; then
            echo "No redundancy cleanup changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "DS-DESIGN-033: remove redundant Dank Design ownership paths"
          git push origin HEAD:fix/ds-design-033-editor-separator-reset-correctness
