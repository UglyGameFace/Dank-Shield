name: Dedicated Supabase Private State Copy (manual)

# Owner-controlled, one-time copy from original shared source to EMPTY
# private tables on a PINNED new Supabase project; no production routing.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview only or owner-authorized private source rows import"
        required: true
        type: choice
        options:
          - preview
          - stage
        default: preview
      confirmation:
        description: "For stage only, exact required confirmation from docs"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: dankshield-dedicated-private-source-copy
  cancel-in-progress: false

jobs:
  private-state:
    if: ${{ github.repository == 'UglyGameFace/Dank-Shield' && github.ref == 'refs/heads/main' && github.actor == 'UglyGameFace' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject changes to main since dispatch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Main changed; re-preview current source and destination."
            exit 1
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install private PostgreSQL-only client and focused test runner
        run: python -m pip install -q "psycopg[binary]>=3.2,<4" "pytest>=8,<10"
      - name: Verify original/dedicated connection and state-copy safety contracts
        run: python -m pytest -q --tb=short tests/test_dedicated_private_source_copy.py
      - name: Preview or explicitly copy only 3 private tables
        env:
          DANK_SOURCE_DATABASE_URL: ${{ secrets.DANK_SOURCE_DATABASE_URL }}
          DANK_FRESH_DATABASE_URL: ${{ secrets.DANK_FRESH_DATABASE_URL }}
          DANK_PRIVATE_STAGE_MODE: ${{ inputs.mode }}
          DANK_PRIVATE_STAGE_CONFIRMATION: ${{ inputs.confirmation }}
        run: python -m tools.stage_dankshield_private_source_state
