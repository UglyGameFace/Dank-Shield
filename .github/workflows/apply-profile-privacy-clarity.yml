name: Apply profile privacy clarity

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize guarded clarity correction
        shell: bash
        run: |
          set +e
          python tools/materialize_profile_privacy_clarity.py > privacy-clarity-materialize.log 2>&1
          status=$?
          set -e
          cat privacy-clarity-materialize.log
          printf '%s' "$status" > privacy-clarity-materialize.status
      - name: Upload materialization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-privacy-clarity-materialization
          path: |
            privacy-clarity-materialize.log
            privacy-clarity-materialize.status
          if-no-files-found: error
      - name: Verify materialization
        run: test "$(cat privacy-clarity-materialize.status)" = "0"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest
      - name: Validate profile privacy and live controls
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
        run: |
          python -m py_compile \
            stoney_verify/commands_ext/public_profile_cards.py \
            stoney_verify/commands_ext/public_profile_cards_core.py \
            stoney_verify/profile_signature_studio.py \
            tests/test_profile_platform_privacy_preview_ux.py \
            tests/test_live_profile_card_interaction_safety.py
          python -m pytest \
            tests/test_profile_platform_privacy_preview_ux.py \
            tests/test_live_profile_card_interaction_safety.py \
            tests/test_live_profile_card_runtime.py \
            tests/test_ui_private_followup_payloads.py \
            -q --tb=short --disable-warnings
          git diff --check
      - name: Record clarity validation and remove temporary helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ACTIVE_TASK.md')
          source = path.read_text(encoding='utf-8')
          for item in (
              'Live switches reflect an old hidden-here override and clear it when turning back on.',
              'Privacy buttons use plain actions without Every Server/Inherit jargon.',
          ):
              source = source.replace(f'- [ ] {item}', f'- [x] {item}')
          path.write_text(source, encoding='utf-8')
          PY
          git rm -f .github/workflows/apply-profile-privacy-clarity.yml
          git rm -f .github/workflows/diagnose-profile-full-suite.yml
          git rm -f tools/materialize_profile_privacy_clarity.py
      - name: Commit verified clean profile controls
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ACTIVE_TASK.md \
            stoney_verify/commands_ext/public_profile_cards.py \
            stoney_verify/commands_ext/public_profile_cards_core.py \
            stoney_verify/profile_signature_studio.py \
            tests/test_profile_platform_privacy_preview_ux.py
          git commit -m 'Clarify profile privacy and effective live controls'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
