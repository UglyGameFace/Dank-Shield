name: Apply Live Signature Per-Member Fix

on:
  push:
    branches:
      - fix/live-signature-per-member-ownership
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-live-signature-per-member-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-signature-per-member-ownership
          fetch-depth: 1
          show-progress: false

      - name: Verify payload part 00
        run: test "$(wc -c < tools/.live-signature-fix-payload-00)" = "12000"
      - name: Verify payload part 01
        run: test "$(wc -c < tools/.live-signature-fix-payload-01)" = "12000"
      - name: Verify payload part 02
        run: test "$(wc -c < tools/.live-signature-fix-payload-02)" = "12000"
      - name: Verify payload part 03
        run: test "$(wc -c < tools/.live-signature-fix-payload-03)" = "10044"

      - name: Assemble and verify base64 payload
        shell: bash
        run: |
          set -euo pipefail
          cat tools/.live-signature-fix-payload-00 \
              tools/.live-signature-fix-payload-01 \
              tools/.live-signature-fix-payload-02 \
              tools/.live-signature-fix-payload-03 \
              > /tmp/live-signature-fix.b64
          test "$(wc -c < /tmp/live-signature-fix.b64)" = "46044"
          test "$(sha256sum /tmp/live-signature-fix.b64 | cut -d' ' -f1)" = "592e341d7d1997645f8c13d416479535087e1d84d0115cc60840a2d8f17f4138"

      - name: Decode and verify archive
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode /tmp/live-signature-fix.b64 > /tmp/live-signature-fix.tgz
          test "$(sha256sum /tmp/live-signature-fix.tgz | cut -d' ' -f1)" = "c54bf24cf58014eb9c1770198f1ed62980e13c9f8b7bf87674d3a66509f4c004"
          tar -tzf /tmp/live-signature-fix.tgz > /dev/null

      - name: Restore reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/live-signature-fix.tgz -C .
          rm -f tools/.live-signature-fix-payload-0{0,1,2,3}
          rm -f .github/workflows/apply-live-signature-per-member-fix.yml

      - name: Validate restored source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q stoney_verify tests
          python -m pytest -q \
            tests/test_profile_card_migration_safety.py \
            tests/test_live_profile_moderation_isolation.py
          git diff --check
          test ! -e .github/workflows/apply-live-signature-per-member-fix.yml
          test -z "$(find tools -maxdepth 1 -name '.live-signature-fix-payload-*' -print -quit)"

      - name: Commit clean implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix live signature ownership per member"
          git push origin HEAD:fix/live-signature-per-member-ownership
