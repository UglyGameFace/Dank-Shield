name: Dedicated Supabase Final Delta Audit (manual read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dankshield-readonly-final-delta
  cancel-in-progress: false

jobs:
  source-dedicated-delta:
    if: ${{ github.repository == 'UglyGameFace/Dank-Shield' && github.ref == 'refs/heads/main' && github.actor == 'UglyGameFace' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify main did not change before snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Main moved; restart the final-delta snapshot."
            exit 1
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install read-only PostgreSQL connector
        run: python -m pip install -q "psycopg[binary]>=3.2,<4"
      - name: Compare original source and isolated new Supabase without writes
        env:
          DANK_SOURCE_DATABASE_URL: ${{ secrets.DANK_SOURCE_DATABASE_URL }}
          DANK_FRESH_DATABASE_URL: ${{ secrets.DANK_FRESH_DATABASE_URL }}
        run: python -m tools.audit_dankshield_cutover_delta
