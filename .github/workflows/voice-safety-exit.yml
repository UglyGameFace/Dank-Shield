name: Voice Safety Decline and Exit #517

on:
  pull_request:
    paths:
      - '.github/workflows/voice-safety-exit.yml'
      - 'stoney_verify/verification_new/basic_verify.py'
      - 'stoney_verify/verification_new/decline_exit.py'
      - 'stoney_verify/commands_ext/public_voice_safety.py'
      - 'stoney_verify/voice_safety_consent.py'
      - 'stoney_verify/voice_safety_membership_sync_runtime.py'
      - 'main.py'
      - 'tests/test_voice_safety_decline_exit.py'
      - 'tests/test_voice_safety_membership_sync.py'
      - 'tests/test_voice_safety_policy.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-safety-exit:
    name: Explicit consent and exit regression
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest
      - name: Verify diff and syntax
        run: |
          git diff --check "$(git merge-base origin/main HEAD)"..HEAD
          python -m py_compile stoney_verify/verification_new/basic_verify.py stoney_verify/verification_new/decline_exit.py stoney_verify/commands_ext/public_voice_safety.py stoney_verify/voice_safety_consent.py stoney_verify/voice_safety_membership_sync_runtime.py main.py
      - name: Run #517 focused regression
        run: python -m pytest -q --tb=short --disable-warnings tests/test_voice_safety_decline_exit.py tests/test_voice_safety_membership_sync.py tests/test_voice_safety_policy.py tests/test_basic_verify_native_restart_runtime.py
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
