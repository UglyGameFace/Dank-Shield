name: Compact Profile Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  targeted:
    name: targeted (${{ matrix.test_file }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_file:
          - tests/test_compact_profile_signature_renderer.py
          - tests/test_live_profile_card_runtime.py
          - tests/test_live_profile_card_final_safety.py
          - tests/test_live_profile_card_integration_contract.py
          - tests/test_live_profile_card_interaction_safety.py
          - tests/test_profile_card_setup_picker_ux.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run targeted file
        run: python -m pytest "${{ matrix.test_file }}" -q
