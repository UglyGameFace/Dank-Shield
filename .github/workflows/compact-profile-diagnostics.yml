name: Compact Profile Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  targeted:
    name: targeted (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: renderer
            test_file: tests/test_compact_profile_signature_renderer.py
          - label: runtime
            test_file: tests/test_live_profile_card_runtime.py
          - label: final-safety
            test_file: tests/test_live_profile_card_final_safety.py
          - label: integration
            test_file: tests/test_live_profile_card_integration_contract.py
          - label: interaction
            test_file: tests/test_live_profile_card_interaction_safety.py
          - label: setup
            test_file: tests/test_profile_card_setup_picker_ux.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run targeted file
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest "${{ matrix.test_file }}" -q > "pytest-${{ matrix.label }}.txt" 2>&1
          status=$?
          cat "pytest-${{ matrix.label }}.txt"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.label }}
          path: pytest-${{ matrix.label }}.txt
          if-no-files-found: error
      - name: Fail when pytest failed
        if: steps.pytest.outputs.status != '0'
        run: exit 1
