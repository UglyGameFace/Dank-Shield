name: DS-DESIGN-030 Consistency Repair v6

on:
  push:
    branches:
      - fix/dank-design-consistency-locks

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply repair payload and corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/ds-design-030-consistency-repair.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          raw = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in raw.splitlines()]
          Path('/tmp/ds_design_030_repair.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python /tmp/ds_design_030_repair.py
          python - <<'PY'
          from pathlib import Path
          path = Path('stoney_verify/commands_ext/public_design_studio.py')
          text = path.read_text(encoding='utf-8')

          # Correct generated lock-manager rendering indentation.
          start_marker = '        for index, row in enumerate(chunk, start=1):\n'
          end_marker = '        embed.add_field(name=f"Rules page {page + 1}/{total_pages}", value="\\n".join(lines)[:1024], inline=False)\n'
          start = text.find(start_marker, text.find('def _format_lock_manager_embed'))
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f'lock manager markers not found: start={start} end={end}')
          replacement_lines = [
              '        for index, row in enumerate(chunk, start=1):',
              '            exists = "✅" if row.get("exists") else "⚠️"',
              '            scope = _safe_str(row.get("scope"), "lock")',
              '            label = _safe_str(row.get("label"), "Unknown")',
              '            if scope == "manual_name":',
              '                exact_name = _safe_str(row.get("exact_name"), label)',
              '                lines.append(f"**{index}.** {exists} **Exact Name** `{label}` → keep `{exact_name}`")',
              '            elif scope == "protection":',
              '                mode = _safe_str(row.get("protection_mode"), "never")',
              '                lines.append(f"**{index}.** {exists} **Exact Protection** `{label}` · {_protection_mode_label(mode)}")',
              '            else:',
              '                font = _safe_str(row.get("font"), "normal").replace("_", " ").title()',
              '                frame = _safe_str(row.get("category_frame_id"), "plain").replace("_", " ").title()',
              '                sep = _safe_str(row.get("separator_id"), "none").replace("_", " ").title()',
              '                strength = _safe_int(row.get("strength"), 4)',
              '                lines.append(f"**{index}.** {exists} **{scope.title()}** `{label}` · Font `{font}` · Frame `{frame}` · Separator `{sep}` · Strength `{strength}/5`")',
              '',
          ]
          text = text[:start] + '\n'.join(replacement_lines) + text[end:]

          # The payload originally left the legacy name-keyed save function after
          # inserting the new ID-keyed function. Remove that second definition so
          # there is one authority path only.
          marker = 'async def _save_protection_rule('
          first = text.find(marker)
          second = text.find(marker, first + len(marker))
          end_marker2 = 'async def _set_default_protection_rules('
          second_end = text.find(end_marker2, second)
          if first < 0 or second < 0 or second_end < 0:
              raise SystemExit(f'protection function markers invalid: first={first} second={second} end={second_end}')
          text = text[:second] + text[second_end:]
          if text.count(marker) != 1:
              raise SystemExit(f'expected one protection save path, found {text.count(marker)}')
          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_dank_design_consistency_030.py')
          test_text = test.read_text(encoding='utf-8')
          test_text = test_text.replace('assert "options["strength"] = 4" not in block', "assert 'options[\\\"strength\\\"] = 4' not in block")
          test.write_text(test_text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Focused validation
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
        run: |
          python -m compileall -q stoney_verify tests/test_dank_design_consistency_030.py
          python -m pytest tests/test_dank_design_consistency_030.py tests/test_dank_design_editor_state_authority.py tests/test_server_design_strict_layout_guard.py tests/test_server_design_category_aware_auto_detect.py tests/test_server_design_style_zones.py tests/test_server_design_repair_confidence.py -q --tb=short
          python tools/test_dank_design_safe_repair_cleanup_static.py
          python tools/audit_dank_design_smart_auto_detect.py
          git diff --check

      - name: Commit repaired source and remove temporary gates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ds-design-030-consistency-repair.yml .github/workflows/ds-design-030-consistency-repair-v2.yml .github/workflows/ds-design-030-consistency-repair-v3.yml .github/workflows/ds-design-030-consistency-repair-v4.yml .github/workflows/ds-design-030-consistency-repair-v5.yml .github/workflows/ds-design-030-consistency-repair-v6.yml
          git add stoney_verify/commands_ext/public_design_studio.py stoney_verify/services/server_design_studio.py tests/test_dank_design_consistency_030.py
          git commit -m "DS-DESIGN-030: repair Dank Design rules and consistency"
          git push origin HEAD:fix/dank-design-consistency-locks
