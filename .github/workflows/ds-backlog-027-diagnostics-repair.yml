name: DS Backlog 027 Diagnostics Repair

on:
  push:
    branches:
      - fix/ds-backlog-integrity-027
    paths:
      - '.github/workflows/ds-backlog-027-diagnostics-repair.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Add diagnostics repair handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('stoney_verify/commands_ext/public_diagnostics_group.py')
          text = p.read_text(encoding='utf-8')
          class_block = '''\n\nclass DiagnosticsActionView(discord.ui.View):\n    """Keep diagnostics read-only while offering an explicit repair handoff."""\n\n    def __init__(self, actor_id: int) -> None:\n        super().__init__(timeout=600)\n        self.actor_id = int(actor_id)\n\n    @discord.ui.button(label="Fix Channel Access", emoji="🛠️", style=discord.ButtonStyle.primary)\n    async def fix_access(self, interaction: discord.Interaction, button: discord.ui.Button) -> None:\n        _ = button\n        if interaction.user.id != self.actor_id:\n            return await interaction.response.send_message("❌ This diagnostics screen belongs to another admin.", ephemeral=True)\n        if not _admin_or_manage_guild(interaction):\n            return await interaction.response.send_message("❌ Manage Server or Administrator is required.", ephemeral=True)\n        from stoney_verify.permission_repair import open_target_permission_repair\n        await open_target_permission_repair(interaction)\n\n'''
          anchor = '\n\ndef _field_text(items: list[str], *, empty: str, limit: int = 1000) -> str:\n'
          if class_block not in text:
              if anchor not in text:
                  raise SystemExit('diagnostics class anchor missing')
              text = text.replace(anchor, class_block + anchor, 1)
          old = '''            "Read-only startup, guild-config, and activity-coverage health report. This does **not** reload guards, "\n            "change setup, grant permissions, touch tickets, or mutate server config."\n'''
          new = '''            "Read-only startup, guild-config, and activity-coverage health report. The report itself does **not** reload guards, "\n            "change setup, grant permissions, touch tickets, or mutate server config. Use **Fix Channel Access** below only when you intentionally want the separate repair workflow."\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('diagnostics description anchor missing')
              text = text.replace(old, new, 1)
          old_send = '''            embed=embed,\n            ephemeral=True,\n            allowed_mentions=discord.AllowedMentions.none(),\n'''
          new_send = '''            embed=embed,\n            view=DiagnosticsActionView(int(interaction.user.id)),\n            ephemeral=True,\n            allowed_mentions=discord.AllowedMentions.none(),\n'''
          if new_send not in text:
              if old_send not in text:
                  raise SystemExit('diagnostics send anchor missing')
              text = text.replace(old_send, new_send, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify diagnostics integration
        run: |
          python -m py_compile stoney_verify/commands_ext/public_diagnostics_group.py stoney_verify/permission_repair.py
          grep -F 'class DiagnosticsActionView' stoney_verify/commands_ext/public_diagnostics_group.py
          grep -F 'Fix Channel Access' stoney_verify/commands_ext/public_diagnostics_group.py
          grep -F 'open_target_permission_repair' stoney_verify/commands_ext/public_diagnostics_group.py
      - name: Commit diagnostics integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stoney_verify/commands_ext/public_diagnostics_group.py
          git commit -m 'Link diagnostics to selected-target Fix Access'
          git push
