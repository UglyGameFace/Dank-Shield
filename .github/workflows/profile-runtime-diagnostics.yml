name: Profile Runtime Diagnostics

on:
  pull_request:
    paths:
      - "stoney_verify/profile_card_runtime.py"
      - "stoney_verify/profile_card_runtime_core.py"
      - "stoney_verify/profile_card_service.py"
      - "stoney_verify/profile_role_visibility.py"
      - "stoney_verify/profile_signature_live_renderer.py"
      - "stoney_verify/profile_signature_studio.py"
      - "stoney_verify/startup_guards/profile_role_editor_guard.py"
      - "stoney_verify/commands_ext/public_profile_cards.py"
      - "stoney_verify/commands_ext/public_profile_cards_core.py"
      - "stoney_verify/commands_ext/public_self_roles_group.py"
      - "stoney_verify/assets/platform_logos/**"
      - "supabase/migrations/*live_profile*.sql"
      - "tests/test_live_profile*.py"
      - "tests/test_profile_card*.py"
      - "tests/test_profile_platform*.py"
      - "tests/test_profile_role*.py"
      - "tests/test_ui_first_dank_command_surface.py"
      - "tools/build_profile_platform_logos.mjs"
      - "tools/apply_profile_platform_modes*.py"
      - "tools/apply_profile_banner_roles_patch.py"
      - "tools/apply_profile_upgrade_regression_fixes.py"
      - "tools/profile_banner_roles_payload/**"
      - ".github/workflows/profile-runtime-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-materialize:
    if: ${{ github.head_ref == 'fix/live-profile-channel-spam' || github.ref_name == 'fix/live-profile-channel-spam' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-profile-channel-spam
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Materialize platform modes when needed
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'PLATFORM_MODE_LOGO' stoney_verify/profile_card_service.py; then
            test -f tools/apply_profile_platform_modes_v2.py
            python tools/apply_profile_platform_modes_v2.py
          fi

      - name: Apply premium banner and split-role payload
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          applied=false
          if ! grep -q 'ROLE_VISIBILITY_PREFERENCES' stoney_verify/profile_card_service.py; then
            if ! compgen -G 'tools/profile_banner_roles_payload/*.part' > /dev/null; then
              echo 'Profile banner payload is not present yet; validating the current branch only.'
            else
              python - <<'PY'
          import base64
          import lzma
          from pathlib import Path

          part_dir = Path("tools/profile_banner_roles_payload")
          encoded = "".join(path.read_text(encoding="ascii").strip() for path in sorted(part_dir.glob("*.part")))
          Path("/tmp/profile-lobby-roles.patch").write_bytes(lzma.decompress(base64.b64decode(encoded)))
          PY
              git apply --check /tmp/profile-lobby-roles.patch
              git apply /tmp/profile-lobby-roles.patch
              applied=true
            fi
          fi
          echo "applied=${applied}" >> "$GITHUB_OUTPUT"

      - name: Generate missing official platform logos
        if: steps.materialize.outputs.applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock \
            simple-icons@16.27.0 \
            @fortawesome/fontawesome-free@7.3.1 \
            sharp@0.34.4
          node tools/build_profile_platform_logos.mjs
          rm -rf node_modules
          rm -f package.json package-lock.json
          for key in steam epic xbox playstation nintendo riot battle_net roblox twitch youtube kick discord spotify custom; do
            test -s "stoney_verify/assets/platform_logos/${key}.png"
          done

      - name: Remove superseded transfer machinery
        if: steps.materialize.outputs.applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/profile_banner_roles_payload
          rm -f tools/apply_profile_banner_roles_patch.py
          rm -f tools/apply_profile_upgrade_regression_fixes.py
          rm -f tools/apply_profile_platform_modes_patch.py
          rm -f tools/apply_profile_platform_modes_v2.py

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile profile implementation
        run: python -m compileall -q stoney_verify tests tools

      - name: Run focused profile regression suite
        shell: bash
        run: |
          python -m pytest -q \
            tests/test_live_profile_card_runtime.py \
            tests/test_live_profile_channel_spam_regression.py \
            tests/test_live_profile_runtime_delivery_regression.py \
            tests/test_live_profile_card_cleanup.py \
            tests/test_live_profile_card_final_safety.py \
            tests/test_live_profile_card_integration_contract.py \
            tests/test_live_profile_card_lifecycle.py \
            tests/test_live_profile_card_visual_links.py \
            tests/test_live_profile_runtime_responsive.py \
            tests/test_profile_card_service.py \
            tests/test_profile_card_setup_picker_ux.py \
            tests/test_profile_card_migration_safety.py \
            tests/test_profile_platform_display_modes.py \
            tests/test_profile_platform_privacy_preview_ux.py \
            tests/test_profile_role_visibility_split.py \
            tests/test_ui_first_dank_command_surface.py

      - name: Run role-menu compatibility checks
        shell: bash
        run: |
          python tools/test_profile_cosmetic_roles_static.py
          python tools/test_profile_role_editor_guard_static.py

      - name: Inspect generated diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          test ! -d tools/profile_banner_roles_payload

      - name: Commit validated materialized implementation
        if: steps.materialize.outputs.applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No materialized changes needed.'
            exit 0
          fi
          git commit -m 'Add premium profile banners and split role visibility'
          git push origin HEAD:fix/live-profile-channel-spam
