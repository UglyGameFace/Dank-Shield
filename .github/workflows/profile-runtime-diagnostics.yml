name: Profile Runtime Diagnostics

on:
  pull_request:
    paths:
      - "stoney_verify/profile_card_runtime.py"
      - "stoney_verify/profile_card_runtime_core.py"
      - "stoney_verify/profile_card_service.py"
      - "stoney_verify/profile_signature_live_renderer.py"
      - "stoney_verify/profile_signature_studio.py"
      - "stoney_verify/commands_ext/public_profile_cards.py"
      - "stoney_verify/commands_ext/public_profile_cards_core.py"
      - "stoney_verify/assets/platform_logos/**"
      - "tests/test_profile_platform_privacy_preview_ux.py"
      - "tools/fix_profile_privacy_defaults.py"
      - ".github/workflows/profile-runtime-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: ${{ github.head_ref == 'fix/live-profile-channel-spam' || github.ref_name == 'fix/live-profile-channel-spam' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-profile-channel-spam
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Apply privacy default and preview fix
        run: python tools/fix_profile_privacy_defaults.py

      - name: Compile changed implementation
        run: |
          python -m py_compile \
            stoney_verify/commands_ext/public_profile_cards.py \
            stoney_verify/commands_ext/public_profile_cards_core.py \
            tests/test_profile_platform_privacy_preview_ux.py

      - name: Run targeted regression tests
        run: |
          python -m pytest -q \
            tests/test_profile_platform_privacy_preview_ux.py \
            tests/test_profile_platform_display_modes.py \
            tests/test_profile_role_display_separation.py

      - name: Inspect cleanup and commit source
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tools/fix_profile_privacy_defaults.py
          git diff --check
          git checkout HEAD -- .github/workflows/profile-runtime-diagnostics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix profile privacy defaults and preview controls'
          git push origin HEAD:fix/live-profile-channel-spam
