name: Profile Runtime Diagnostics

on:
  pull_request:
    paths:
      - "stoney_verify/profile_card_runtime.py"
      - "stoney_verify/profile_card_runtime_core.py"
      - "stoney_verify/profile_card_service.py"
      - "stoney_verify/profile_signature_live_renderer.py"
      - "stoney_verify/profile_signature_studio.py"
      - "stoney_verify/commands_ext/public_profile_cards.py"
      - "stoney_verify/commands_ext/public_profile_cards_core.py"
      - "stoney_verify/assets/platform_logos/**"
      - "supabase/migrations/*live_profile*.sql"
      - "tests/test_live_profile*.py"
      - "tests/test_profile_card*.py"
      - "tests/test_profile_platform*.py"
      - "tools/apply_profile_platform_modes*.py"
      - "tools/build_profile_platform_logos.mjs"
      - ".github/workflows/profile-runtime-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-platform-modes:
    if: ${{ github.head_ref == 'fix/live-profile-channel-spam' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-profile-channel-spam
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply platform modes and real-logo renderer
        run: python tools/apply_profile_platform_modes_v2.py
      - name: Use direct official SVG package paths
        run: |
          cat > tools/build_profile_platform_logos.mjs <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import sharp from "sharp";

          const outDir = path.resolve("stoney_verify/assets/platform_logos");
          fs.mkdirSync(outDir, { recursive: true });
          const readSvg = (...candidates) => {
            for (const candidate of candidates) {
              if (fs.existsSync(candidate)) {
                return fs.readFileSync(candidate, "utf8").replace("<svg ", '<svg fill="#FFFFFF" ');
              }
            }
            throw new Error(`No official SVG found in: ${candidates.join(", ")}`);
          };
          const si = (slug) => path.resolve("node_modules/simple-icons/icons", `${slug}.svg`);
          const faBrand = (slug) => path.resolve("node_modules/@fortawesome/fontawesome-free/svgs/brands", `${slug}.svg`);
          const faSolid = (slug) => path.resolve("node_modules/@fortawesome/fontawesome-free/svgs/solid", `${slug}.svg`);
          const sources = {
            steam: [si("steam"), faBrand("steam")],
            epic: [si("epicgames")],
            xbox: [faBrand("xbox")],
            playstation: [si("playstation"), faBrand("playstation")],
            nintendo: [faBrand("nintendo-switch")],
            riot: [si("riotgames")],
            battle_net: [si("battledotnet")],
            roblox: [si("roblox")],
            twitch: [si("twitch"), faBrand("twitch")],
            youtube: [si("youtube"), faBrand("youtube")],
            kick: [si("kick")],
            custom: [faSolid("link")],
          };
          for (const [key, candidates] of Object.entries(sources)) {
            await sharp(Buffer.from(readSvg(...candidates)))
              .resize(96, 96, { fit: "contain" })
              .png()
              .toFile(path.join(outDir, `${key}.png`));
          }
          console.log(`Generated ${Object.keys(sources).length} bundled platform logos.`);
          NODE
      - name: Generate bundled platform logo PNGs
        run: |
          npm install --no-save --no-package-lock \
            simple-icons@16.27.0 \
            @fortawesome/fontawesome-free@7.3.1 \
            sharp@0.34.3
          node tools/build_profile_platform_logos.mjs
      - name: Validate generated Python
        run: |
          python -m py_compile \
            stoney_verify/profile_card_service.py \
            stoney_verify/profile_card_runtime_core.py \
            stoney_verify/profile_card_runtime.py \
            stoney_verify/profile_signature_live_renderer.py \
            stoney_verify/profile_signature_studio.py \
            stoney_verify/commands_ext/public_profile_cards.py \
            stoney_verify/commands_ext/public_profile_cards_core.py \
            tests/test_live_profile_card_visual_links.py \
            tests/test_profile_platform_display_modes.py
      - name: Commit generated source and bundled logos
        shell: bash
        run: |
          rm -rf node_modules
          if git diff --quiet && [[ -z "$(git status --porcelain --untracked-files=all)" ]]; then
            echo 'No generated changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            stoney_verify/profile_card_service.py \
            stoney_verify/profile_card_runtime_core.py \
            stoney_verify/profile_card_runtime.py \
            stoney_verify/profile_signature_live_renderer.py \
            stoney_verify/profile_signature_studio.py \
            stoney_verify/commands_ext/public_profile_cards.py \
            stoney_verify/commands_ext/public_profile_cards_core.py \
            stoney_verify/assets/platform_logos \
            tests/test_live_profile_card_visual_links.py \
            tests/test_profile_platform_display_modes.py \
            tools/build_profile_platform_logos.mjs
          git commit -m 'Add real platform logos and display modes [skip platform patch]'
          git push origin HEAD:fix/live-profile-channel-spam

  focused-profile-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run focused profile runtime tests
        id: tests
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_live_profile_card_runtime.py \
            tests/test_live_profile_channel_spam_regression.py \
            tests/test_live_profile_runtime_delivery_regression.py \
            tests/test_live_profile_card_cleanup.py \
            tests/test_live_profile_card_final_safety.py \
            tests/test_live_profile_card_integration_contract.py \
            tests/test_live_profile_card_lifecycle.py \
            tests/test_live_profile_card_visual_links.py \
            tests/test_live_profile_runtime_responsive.py \
            tests/test_profile_card_setup_picker_ux.py \
            tests/test_profile_card_migration_safety.py \
            tests/test_profile_platform_display_modes.py \
            > profile-runtime-tests.txt 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          tail -n 250 profile-runtime-tests.txt
          exit 0
      - name: Upload exact test output and repository snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-runtime-diagnostics
          path: |
            profile-runtime-tests.txt
            requirements.txt
            main.py
            stoney_verify/
            tests/
            tools/
            supabase/
          if-no-files-found: error
          retention-days: 1
      - name: Fail when focused tests failed
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
