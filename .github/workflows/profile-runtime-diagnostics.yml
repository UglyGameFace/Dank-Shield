name: Profile Runtime Diagnostics

on:
  pull_request:
    paths:
      - "stoney_verify/profile_card_runtime.py"
      - "stoney_verify/profile_card_runtime_core.py"
      - "stoney_verify/profile_card_service.py"
      - "stoney_verify/profile_signature_live_renderer.py"
      - "stoney_verify/profile_signature_studio.py"
      - "stoney_verify/commands_ext/public_profile_cards.py"
      - "stoney_verify/commands_ext/public_profile_cards_core.py"
      - "stoney_verify/assets/platform_logos/**"
      - "supabase/migrations/*live_profile*.sql"
      - "tests/test_live_profile*.py"
      - "tests/test_profile_card*.py"
      - "tests/test_profile_platform*.py"
      - "tools/apply_profile_platform_modes*.py"
      - ".github/workflows/profile-runtime-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-platform-modes:
    # The PNGs below are the exact application emoji artwork uploaded in the Discord Developer Portal.
    if: ${{ github.head_ref == 'fix/live-profile-channel-spam' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-profile-channel-spam
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply platform modes and real-logo renderer
        run: python tools/apply_profile_platform_modes_v2.py
      - name: Bundle uploaded application emoji artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stoney_verify/assets/platform_logos
          download_logo() {
            local key="$1"
            local emoji_id="$2"
            curl --fail --location --silent --show-error \
              "https://cdn.discordapp.com/emojis/${emoji_id}.png?size=128&quality=lossless" \
              --output "stoney_verify/assets/platform_logos/${key}.png"
            test -s "stoney_verify/assets/platform_logos/${key}.png"
          }
          download_logo youtube 1531448153054773288
          download_logo xbox 1531448152157061130
          download_logo nintendo 1531448151255289917
          download_logo steam 1531448150173286460
          download_logo playstation 1531448147899977909
          download_logo roblox 1531448146968842240
          download_logo epic 1531448144796188702
          download_logo riot 1531448143609331835
          download_logo twitch 1531448142481064047
          download_logo kick 1531448141604323338
          rm -f tools/build_profile_platform_logos.mjs
          cat > stoney_verify/assets/platform_logos/ATTRIBUTION.md <<'EOF'
          # Platform logo assets

          These files are the application emoji artwork uploaded by the Dank Shield owner in the Discord Developer Portal. They are bundled locally so live profile cards render consistently without substituting generic Unicode emoji or making a network request for every message. Brand marks remain trademarks of their respective owners and are used only to identify the platform selected by a member.
          EOF
      - name: Validate generated Python
        run: |
          python -m py_compile \
            stoney_verify/profile_card_service.py \
            stoney_verify/profile_card_runtime_core.py \
            stoney_verify/profile_card_runtime.py \
            stoney_verify/profile_signature_live_renderer.py \
            stoney_verify/profile_signature_studio.py \
            stoney_verify/commands_ext/public_profile_cards.py \
            stoney_verify/commands_ext/public_profile_cards_core.py \
            tests/test_live_profile_card_visual_links.py \
            tests/test_profile_platform_display_modes.py
      - name: Commit generated source and uploaded logos
        shell: bash
        run: |
          if git diff --quiet && [[ -z "$(git status --porcelain --untracked-files=all)" ]]; then
            echo 'No generated changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            stoney_verify/profile_card_service.py \
            stoney_verify/profile_card_runtime_core.py \
            stoney_verify/profile_card_runtime.py \
            stoney_verify/profile_signature_live_renderer.py \
            stoney_verify/profile_signature_studio.py \
            stoney_verify/commands_ext/public_profile_cards.py \
            stoney_verify/commands_ext/public_profile_cards_core.py \
            stoney_verify/assets/platform_logos \
            tests/test_live_profile_card_visual_links.py \
            tests/test_profile_platform_display_modes.py
          git commit -m 'Add real uploaded platform logos and display modes [skip platform patch]'
          git push origin HEAD:fix/live-profile-channel-spam

  focused-profile-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run focused profile runtime tests
        id: tests
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_live_profile_card_runtime.py \
            tests/test_live_profile_channel_spam_regression.py \
            tests/test_live_profile_runtime_delivery_regression.py \
            tests/test_live_profile_card_cleanup.py \
            tests/test_live_profile_card_final_safety.py \
            tests/test_live_profile_card_integration_contract.py \
            tests/test_live_profile_card_lifecycle.py \
            tests/test_live_profile_card_visual_links.py \
            tests/test_live_profile_runtime_responsive.py \
            tests/test_profile_card_setup_picker_ux.py \
            tests/test_profile_card_migration_safety.py \
            tests/test_profile_platform_display_modes.py \
            > profile-runtime-tests.txt 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          tail -n 250 profile-runtime-tests.txt
          exit 0
      - name: Upload exact test output and repository snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-runtime-diagnostics
          path: |
            profile-runtime-tests.txt
            requirements.txt
            main.py
            stoney_verify/
            tests/
            tools/
            supabase/
          if-no-files-found: error
          retention-days: 1
      - name: Fail when focused tests failed
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
