name: Profile Runtime Diagnostics

on:
  pull_request:
    paths:
      - "tools/_apply_pr145_color_mixer.py"
      - "tools/_pr145_payload_*.txt"
      - "stoney_verify/profile_card_runtime.py"
      - "stoney_verify/profile_card_service.py"
      - "stoney_verify/profile_signature_style.py"
      - "stoney_verify/profile_signature_live_renderer.py"
      - "stoney_verify/profile_signature_studio.py"
      - "stoney_verify/commands_ext/public_profile_cards.py"
      - "stoney_verify/startup_guards/**"
      - "tests/test_profile*.py"
      - ".github/workflows/profile-runtime-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr145-native-profile-integration
  cancel-in-progress: true

jobs:
  apply-native-profile-correction:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/live-profile-channel-spam'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/live-profile-channel-spam
          fetch-depth: 0

      - name: Detect one-time materializer
        id: materializer
        shell: bash
        run: |
          if [ -f tools/_apply_pr145_color_mixer.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.materializer.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies quietly
        if: steps.materializer.outputs.present == 'true'
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt pytest

      - name: Apply and self-validate native correction
        if: steps.materializer.outputs.present == 'true'
        run: python tools/_apply_pr145_color_mixer.py

      - name: Upload exact materializer failure
        if: failure() && steps.materializer.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pr145-native-integration-failure
          path: tools/_pr145_failure.log
          if-no-files-found: error
          retention-days: 2

      - name: Compile native implementation
        if: success() && steps.materializer.outputs.present == 'true'
        run: |
          python -m py_compile \
            stoney_verify/profile_card_runtime.py \
            stoney_verify/profile_signature_style.py \
            stoney_verify/profile_signature_live_renderer.py \
            stoney_verify/profile_signature_studio.py \
            stoney_verify/commands_ext/public_profile_cards.py \
            tests/test_profile_signature_color_mixer.py \
            tests/test_profile_signature_reference_visuals.py

      - name: Remove all one-time integration material
        if: success() && steps.materializer.outputs.present == 'true'
        run: |
          rm -f tools/_apply_pr145_color_mixer.py
          rm -f tools/_pr145_failure.log
          rm -f tools/_pr145_payload_*.txt
          rm -f .github/workflows/_apply-pr145-color-mixer.yml

      - name: Package exact validated native result
        if: success() && steps.materializer.outputs.present == 'true'
        run: |
          mkdir -p /tmp/pr145-native-result
          git diff --binary > /tmp/pr145-native-result/pr145-native.patch
          git diff --name-status > /tmp/pr145-native-result/manifest.txt
          git status --short > /tmp/pr145-native-result/status.txt
          tar -czf /tmp/pr145-native-result/native-files.tgz \
            .github/workflows/profile-runtime-diagnostics.yml \
            stoney_verify/profile_card_runtime.py \
            stoney_verify/profile_signature_style.py \
            stoney_verify/profile_signature_live_renderer.py \
            stoney_verify/profile_signature_studio.py \
            stoney_verify/commands_ext/public_profile_cards.py \
            stoney_verify/startup_guards/__init__.py \
            tests/test_profile_signature_color_mixer.py \
            tests/test_profile_signature_reference_visuals.py

      - name: Upload exact validated native result
        if: success() && steps.materializer.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pr145-validated-native-result
          path: /tmp/pr145-native-result
          if-no-files-found: error
          retention-days: 2

      - name: Commit native implementation
        if: success() && steps.materializer.outputs.present == 'true'
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            git add -A &&
            git diff --cached --check &&
            git commit -m "Finish PR145 profile cards, emoji, copy, styles, and colors" &&
            git push origin HEAD:fix/live-profile-channel-spam
          } > /tmp/pr145-commit.log 2>&1
          rc=$?
          cat /tmp/pr145-commit.log
          exit "$rc"

      - name: Upload commit handoff failure
        if: failure() && steps.materializer.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pr145-commit-handoff-failure
          path: /tmp/pr145-commit.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Already integrated
        if: steps.materializer.outputs.present != 'true'
        run: echo "Native PR145 correction is already integrated; normal PR validation owns this head."
