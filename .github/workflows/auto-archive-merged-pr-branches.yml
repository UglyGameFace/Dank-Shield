name: Auto-archive completed PR branches

# Review-controlled, archive-first post-merge retirement of temporary
# audit/hotfix/chore branches. This never deletes main, deployed refs, backups,
# active PRs, or historical branches merely because they look old.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: guarded-merged-branch-cleanup
  cancel-in-progress: false

jobs:
  archive-merged-pr-heads:
    if: ${{ github.repository == 'UglyGameFace/Dank-Shield' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Preserve original commit tags before retiring finished PR refs
        uses: actions/github-script@v7
        env:
          LINKED_PRODUCTION_BRANCH: ${{ vars.DANK_DISCLOUD_DEPLOY_BRANCH }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const repoInfo = (await github.rest.repos.get({ owner, repo })).data;
            if (repoInfo.full_name !== 'UglyGameFace/Dank-Shield' ||
                repoInfo.default_branch !== 'main') {
              throw new Error('Auto-archive only operates on Dank Shield main');
            }
            const fullName = repoInfo.full_name;
            // Only brand-new ephemeral PR heads are eligible, not old history.
            const mergedAfter = '2026-10-15T00:00:00Z';
            const allowedPrefixes = ['audit/', 'hotfix/', 'chore/'];
            const protectedPrefixes = [
              'aaa-', 'backup/', 'archive/', 'recovery/', 'reconcile/',
              'integration/', 'release/', 'deploy/', 'deployment/', 'ops/',
              'ci/', 'main', 'production/', 'staging/'
            ];
            const protectedSegments = new Set([
              'backup', 'restore', 'recovery', 'archive', 'release',
              'deploy', 'deployment', 'discloud', 'staging', 'migration',
              'supabase', 'database', 'postgres', 'production',
              'rollback', 'revert', 'known', 'snapshot', 'stable'
            ]);
            const heldHeads = new Set([
              'main',
              'aaa-cinema-pre-pregateway-bind',
              'chore/guarded-merged-branch-cleanup-20261015',
              'audit/protection-picker-migration',
              String(process.env.LINKED_PRODUCTION_BRANCH || '').trim()
            ]);

            const branches = await github.paginate(
              github.rest.repos.listBranches, { owner, repo, per_page: 100 }
            );
            const openPRs = await github.paginate(
              github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 }
            );
            const openHeads = new Set(openPRs.filter(pr =>
              pr.head.repo?.full_name === fullName
            ).map(pr => pr.head.ref));
            // Recent merged records only; not a bulk historical branch sweeper.
            // A single 100-PR page silently misses eligible merged heads once
            // other closed PRs push them off page one. Paginate the full set;
            // eligibility remains constrained by date, prefix, exact head and
            // the maximum retirement batch below.
            const closedPRs = await github.paginate(
              github.rest.pulls.list, {
                owner, repo, state: 'closed', sort: 'updated',
                direction: 'desc', per_page: 100
              }
            );
            const byName = new Map(branches.map(item => [item.name, item]));

            function allowed(name) {
              if (!name || heldHeads.has(name) ||
                  !allowedPrefixes.some(prefix => name.startsWith(prefix)) ||
                  protectedPrefixes.some(prefix => name.startsWith(prefix))) {
                return false;
              }
              // This single newly reviewed automation PR is itself a
              // temporary head. Its exact merged SHA still must pass all
              // runtime checks, including tag/readback and open-PR exclusion.
              if (name === 'chore/auto-archive-merged-pr-heads-20261016') {
                return true;
              }
              return !name.split(/[\\/_-]+/).some(segment =>
                protectedSegments.has(segment.toLowerCase())
              );
            }

            const candidates = [];
            const seen = new Set();
            for (const pr of closedPRs) {
              const name = pr.head.ref;
              if (!pr.merged_at || pr.merged_at < mergedAfter ||
                  pr.base.ref !== 'main' ||
                  pr.head.repo?.full_name !== fullName ||
                  pr.head.repo?.id !== repoInfo.id ||
                  !allowed(name) || openHeads.has(name) || seen.has(name)) {
                continue;
              }
              const branch = byName.get(name);
              // EXACT merged PR head, not merely an ancestor or same file diff.
              if (!branch || branch.protected ||
                  pr.head.sha !== branch.commit.sha) {
                continue;
              }
              seen.add(name);
              candidates.push({ name, sha: branch.commit.sha, pr: pr.number });
            }

            if (candidates.length > 12) {
              throw new Error('Unexpected auto-archive batch exceeds 12; manual review required');
            }

            const retired = [];
            const skipped = [];
            for (const candidate of candidates) {
              const { name, sha, pr } = candidate;
              try {
                // Check original ref again before archive and again before deletion.
                const before = (await github.rest.repos.getBranch({
                  owner, repo, branch: name
                })).data;
                if (before.protected || before.commit.sha !== sha) {
                  skipped.push(name + ': branch changed or protected');
                  continue;
                }

                const tag = 'branch-retirement-auto/' + name;
                const ref = 'tags/' + tag;
                let archive;
                try {
                  archive = (await github.rest.git.getRef({ owner, repo, ref })).data;
                } catch (error) {
                  if (error.status !== 404) throw error;
                  await github.rest.git.createRef({
                    owner, repo, ref: 'refs/' + ref, sha
                  });
                  archive = (await github.rest.git.getRef({ owner, repo, ref })).data;
                }
                // Existing tags with a different SHA are held, never overwritten.
                if (archive.object.type !== 'commit' ||
                    archive.object.sha !== sha) {
                  skipped.push(name + ': archive tag SHA mismatch');
                  continue;
                }

                const again = (await github.rest.repos.getBranch({
                  owner, repo, branch: name
                })).data;
                const liveOpenPRs = await github.paginate(
                  github.rest.pulls.list, {
                    owner, repo, state: 'open', per_page: 100
                  }
                );
                const nowInUse = liveOpenPRs.some(item =>
                  item.head.repo?.full_name === fullName &&
                  item.head.ref === name
                );
                if (again.protected || again.commit.sha !== sha || nowInUse) {
                  skipped.push(name + ': changed, protected, or in active PR');
                  continue;
                }

                // Tag has been created AND read back at the exact original SHA.
                await github.rest.git.deleteRef({
                  owner, repo, ref: 'heads/' + name
                });
                retired.push({ name, sha, pr, tag });
              } catch (error) {
                skipped.push(name + ': ' + String(error.message || error));
              }
            }

            await core.summary
              .addHeading('Automatic archive-first completed-PR cleanup')
              .addRaw('Only reviewed temporary audit/hotfix/chore merged PR heads; other branch types stay intact.\\n')
              .addRaw('Candidates: ' + candidates.length +
                      '; retired: ' + retired.length +
                      '; held/failed: ' + skipped.length + '.\\n')
              .addCodeBlock(JSON.stringify({ retired, skipped }, null, 2), 'json')
              .write();
            if (skipped.length) {
              core.setFailed('Some branch retirements were held; branch refs remain where guardrails failed');
            }
