name: DS Setup 020 macOS Launcher

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  apply-and-test:
    if: >-
      github.event.pull_request.head.ref == 'ci/ds-setup-020-macos-trigger'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: fix/ds-setup-020-id-verification-selection
          fetch-depth: 0
          path: target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply direct source migration
        working-directory: target
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/ds_setup_020_direct_apply.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def replace_assignment_block")
          end = text.index("\ndef replace_between_in_node", start)
          segment = text[start:end]
          old = '    clean = textwrap.dedent(replacement).strip("\\n") + "\\n\\n"\n'
          if segment.count(old) != 1:
              raise RuntimeError("replace_assignment_block helper shape changed")
          segment = segment.replace(
              old,
              '    clean = textwrap.dedent(replacement).strip("\\n")\n',
              1,
          )
          path.write_text(text[:start] + segment + text[end:], encoding="utf-8")
          PY
          python -m py_compile tools/ds_setup_020_direct_apply.py
          python tools/ds_setup_020_direct_apply.py

      - name: Install dependencies
        working-directory: target
        run: python -m pip install -r requirements.txt

      - name: Compile changed modules
        working-directory: target
        shell: bash
        run: |
          python -m py_compile \
            stoney_verify/setup_service_state.py \
            stoney_verify/services/setup_permission_policy.py \
            stoney_verify/services/vc_verification_permissions.py \
            stoney_verify/startup_guards/vc_setup_one_press_fix.py \
            stoney_verify/startup_guards/vc_per_guild_access_fix.py \
            stoney_verify/commands_ext/public_setup_defaults.py \
            stoney_verify/commands_ext/public_setup_fresh_choice.py \
            stoney_verify/commands_ext/public_setup_recommend.py

      - name: Run DS-SETUP-020 tests
        working-directory: target
        shell: bash
        run: |
          pytest -q \
            tests/test_setup_service_state_behavior.py \
            tests/test_setup_aio_navigation_behavior.py \
            tests/test_setup_020_entitled_id_behavior.py \
            tests/test_setup_020_vc_permission_contract.py \
            tests/test_setup_020_no_forced_simple_channel_static.py \
            tests/test_setup_guided_one_item_behavior.py \
            tests/test_setup_create_missing_enabled_features_static.py

      - name: Commit implementation branch and remove one-shot files
        working-directory: target
        shell: bash
        env:
          BRANCH: fix/ds-setup-020-id-verification-selection
        run: |
          rm -f tools/ds_setup_020_direct_apply.py
          rm -f tools/.ds_setup_020_apply.py.gz.b64
          rm -f .github/workflows/ds-setup-020-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: honor entitled ID verification setup choices"
          git push origin "HEAD:${BRANCH}"
