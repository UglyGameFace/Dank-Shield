name: DS Backlog 027 Ticket Owner

on:
  push:
    branches:
      - fix/ds-backlog-integrity-027
    paths:
      - '.github/workflows/ds-backlog-027-ticket-owner.yml'
      - 'tools/ds_ticket_owner_migrate.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Move hardening into canonical owner
        run: python tools/ds_ticket_owner_migrate.py
      - name: Validate owner file
        run: |
          python -m py_compile stoney_verify/commands_ext/public_ticket_panel_clean.py stoney_verify/startup_guards/__init__.py
          grep -F 'async def _handle_panel_button_core' stoney_verify/commands_ext/public_ticket_panel_clean.py
          grep -F '_MENU_SESSIONS' stoney_verify/commands_ext/public_ticket_panel_clean.py
          grep -F '_CONFIRM_LOCKS' stoney_verify/commands_ext/public_ticket_panel_clean.py
          grep -F 'if not _PANEL_VIEW_REGISTERED and not _PANEL_FALLBACK_LISTENER_REGISTERED' stoney_verify/commands_ext/public_ticket_panel_clean.py
          ! grep -F 'public_ticket_panel_clean_hardening' stoney_verify/startup_guards/__init__.py
          ! grep -F 'public_ticket_confirm_hardening_guard' stoney_verify/startup_guards/__init__.py
      - name: Commit owner changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stoney_verify/commands_ext/public_ticket_panel_clean.py stoney_verify/startup_guards/__init__.py
          git commit -m 'Move ticket panel hardening into canonical owner'
          git push
