name: Run Profile Welcome UX Patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-command-payload-limit
          fetch-depth: 0
      - name: Extract reviewed patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-profile-welcome-ux.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          body = source[start:end]
          indent = min((len(line) - len(line.lstrip()) for line in body if line.strip()), default=0)
          Path('/tmp/apply_profile_welcome_ux.py').write_text(
              '\n'.join(line[indent:] if line.strip() else '' for line in body) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Run reviewed patch
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          python /tmp/apply_profile_welcome_ux.py > /tmp/profile-welcome-patch.log 2>&1
          status=$?
          cat /tmp/profile-welcome-patch.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit diagnostic when patch fails
        if: steps.patch.outputs.status != '0'
        run: |
          cp /tmp/profile-welcome-patch.log PROFILE_WELCOME_PATCH_ERROR.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PROFILE_WELCOME_PATCH_ERROR.txt
          git commit -m "Record profile welcome integration error"
          git push origin HEAD:fix/profile-command-payload-limit
      - name: Finish successful integration
        if: steps.patch.outputs.status == '0'
        run: |
          rm -f .github/workflows/run-profile-welcome-ux-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete profile and welcome setup experience"
          git push origin HEAD:fix/profile-command-payload-limit
      - name: Fail after diagnostic commit
        if: steps.patch.outputs.status != '0'
        run: exit 1
