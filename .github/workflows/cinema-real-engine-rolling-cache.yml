name: Cinema real-engine rolling-cache qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/qualify_cinema_rolling_engine.py"
      - "stoney_verify/cinema_rolling_gateway.py"
      - "stoney_verify/torrent_streaming.py"
      - "stoney_verify/api_new/torrent_stream_routes.py"
      - ".github/workflows/cinema-real-engine-rolling-cache.yml"

permissions:
  contents: read

jobs:
  rolling-torrent-proof:
    name: 52 GiB memory-only engine + signed Cinema proxy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Dank Shield
        uses: actions/checkout@v4
      - name: Set up pinned Go compiler
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache: false
      - name: Cache pinned Go engine dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go1257-torrserver-98cdbac-v1
      - name: Build isolated pinned upstream engine
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout --depth 1 https://github.com/YouROK/TorrServer.git upstream-torrserver
          cd upstream-torrserver
          git fetch --depth=1 origin 98cdbacaddfac278a21a4a4d6424bd3a9dcd407f
          git checkout --detach 98cdbacaddfac278a21a4a4d6424bd3a9dcd407f
          test "$(git rev-parse HEAD)" = "98cdbacaddfac278a21a4a4d6424bd3a9dcd407f"
          cd server
          go build -trimpath -o "$GITHUB_WORKSPACE/torrserver-test-only" ./cmd
      - name: Set up Python for real libtorrent seeder
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the same pinned libtorrent as Dank Shield
        run: python -m pip install --no-cache-dir libtorrent==2.1.1
      - name: Install rolling gateway HTTP test dependency
        run: python -m pip install --no-cache-dir 'aiohttp>=3.12.0,<4.0.0'
      - name: Verify 52 GiB logical ranges and cache eviction with real engine
        timeout-minutes: 6
        env:
          DANK_TEST_TORRSERVER_BINARY: ${{ github.workspace }}/torrserver-test-only
          PYTHONPATH: ${{ github.workspace }}
          DANK_QUALIFY_MEMORY_MODE: '1'
        run: |
          python3 -u tools/qualify_cinema_rolling_engine.py
      - name: No production deployment
        run: |
          echo 'QUALIFICATION ONLY. No binary or torrent sources are uploaded or deployed.'
