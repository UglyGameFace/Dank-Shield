name: Temporary DS Ticket Category 198 REST History Recovery

on:
  push:
    branches:
      - fix/ticket-category-preserved-selection-198
    paths:
      - tools/_tmp_patch_ticket_history_rest_198.py
      - .github/workflows/tmp-ticket-category-198-rest-history.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/ticket-category-preserved-selection-198
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Apply REST history recovery patch
        run: python tools/_tmp_patch_ticket_history_rest_198.py

      - name: Keep temporary workflow out of permanent diff
        run: git checkout -- .github/workflows/tmp-ticket-category-198-rest-history.yml

      - name: Validate focused ticket category recovery
        run: |
          python -m py_compile \
            stoney_verify/tickets_new/managed_category_service.py \
            stoney_verify/startup_guards/ticket_category_setup_guard.py \
            tests/test_ticket_category_setup_selection.py
          python -m pytest -q --tb=short \
            tests/test_ticket_category_setup_selection.py \
            tests/test_ticket_picker_legacy_default_reconciliation.py \
            tests/test_ticket_category_reset_preserves_selection.py
          python tools/audit_ticket_category_menu.py
          git diff --check

      - name: Remove temporary patch script
        run: rm -f tools/_tmp_patch_ticket_history_rest_198.py

      - name: Commit permanent runtime recovery only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            stoney_verify/tickets_new/managed_category_service.py \
            stoney_verify/startup_guards/ticket_category_setup_guard.py \
            tests/test_ticket_category_setup_selection.py \
            tools/_tmp_patch_ticket_history_rest_198.py
          git diff --cached --check
          git commit -m "fix: recover erased ticket choices through REST history" || exit 0
          git push origin HEAD:fix/ticket-category-preserved-selection-198
