name: Apply Invite Stats Bucket Isolation

on:
  push:
    branches:
      - fix/dank-stats-live-recovery

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dank-stats-live-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest
      - name: Apply clean source and regression repair
        run: python tools/apply_invite_stats_bucket_isolation.py
      - name: Validate focused repair
        run: |
          python -m compileall -q stoney_verify/durable_invite_stats.py tests/test_durable_invite_stats.py
          python -m pytest -q \
            tests/test_durable_invite_stats.py \
            tests/test_security_stats_durable_invite_overlay.py \
            tests/test_durable_invite_stats_migration.py
      - name: Commit only clean final source
        run: |
          rm -f \
            .github/workflows/apply-invite-stats-bucket-isolation.yml \
            tools/apply_invite_stats_bucket_isolation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Preserve invite stats config bucket isolation"
          git push origin HEAD:fix/dank-stats-live-recovery
