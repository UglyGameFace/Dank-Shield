name: DS-DESIGN-030 Second Audit v5

on:
  push:
    branches:
      - fix/dank-design-consistency-locks

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply second-pass repairs
        run: python .github/scripts/run_ds_design_030_second_audit.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest
      - name: Validate second-pass repairs
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
        run: |
          python -m compileall -q stoney_verify tests/test_dank_design_consistency_030.py
          python -m pytest tests/test_dank_design_consistency_030.py tests/test_dank_design_editor_state_authority.py tests/test_server_design_strict_layout_guard.py tests/test_server_design_category_aware_auto_detect.py tests/test_server_design_majority_layout.py tests/test_server_design_majority_repair_safety.py tests/test_server_design_style_zones.py tests/test_server_design_repair_confidence.py -q --tb=short
          python tools/test_dank_design_safe_repair_cleanup_static.py
          python tools/audit_dank_design_smart_auto_detect.py
          python tools/test_design_layout_helpers_not_startup.py
          git diff --check
      - name: Commit clean second-pass source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ds-design-030-second-audit.yml .github/workflows/ds-design-030-second-audit-v2.yml .github/workflows/ds-design-030-second-audit-v3.yml .github/workflows/ds-design-030-second-audit-v4.yml .github/workflows/ds-design-030-second-audit-v5.yml .github/scripts/run_ds_design_030_second_audit.py
          git add stoney_verify/commands_ext/public_design_studio.py stoney_verify/services/server_design_studio.py stoney_verify/services/server_design_majority_layout.py stoney_verify/startup_guards/server_design_majority_layout_guard.py tests/test_dank_design_consistency_030.py
          git commit -m "DS-DESIGN-030: close second-pass Dank Design inconsistencies"
          git push origin HEAD:fix/dank-design-consistency-locks
