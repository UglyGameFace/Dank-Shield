name: Profile Standalone Tool Diagnostic

on:
  pull_request:
    paths:
      - "tools/test_*.py"
      - "stoney_verify/profile_signature_studio.py"
      - "stoney_verify/commands_ext/public_self_roles_group.py"
      - "stoney_verify/startup_guards/profile_role_editor_guard.py"
      - "tests/test_ui_first_dank_command_surface.py"
      - ".github/workflows/profile-standalone-tools-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest

      - name: Run every standalone tool check
        id: tools
        shell: bash
        run: |
          set +e
          : > standalone-tools.txt
          status=0
          for file in tools/test_*.py; do
            echo "===== $file =====" | tee -a standalone-tools.txt
            python "$file" >> standalone-tools.txt 2>&1
            code=$?
            echo "exit_code=$code" | tee -a standalone-tools.txt
            if [[ $code -ne 0 ]]; then
              status=1
            fi
          done
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          tail -n 400 standalone-tools.txt
          exit 0

      - name: Upload exact standalone output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-standalone-tools-diagnostic
          path: standalone-tools.txt
          if-no-files-found: error
          retention-days: 1

      - name: Fail when a standalone tool failed
        if: steps.tools.outputs.exit_code != '0'
        run: exit 1
