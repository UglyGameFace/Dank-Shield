name: DS Design 033 One Shot Patch

on:
  push:
    branches:
      - fix/ds-design-033-editor-separator-reset-correctness

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ds-design-033-editor-separator-reset-correctness
          fetch-depth: 0

      - name: Apply guarded patch
        run: |
          python tools/_apply_ds_design_033_patch.py
          python -m py_compile \
            stoney_verify/commands_ext/public_design_studio.py \
            stoney_verify/commands_ext/public_design_studio_v2.py \
            stoney_verify/services/server_design_plan_service.py \
            stoney_verify/services/server_design_rule_service.py
          git diff --check

      - name: Commit patched sources
        run: |
          if git diff --quiet; then
            echo "No patch changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stoney_verify/commands_ext/public_design_studio.py stoney_verify/commands_ext/public_design_studio_v2.py
          git commit -m "DS-DESIGN-033: fix separator editor and reset authority"
          git push origin HEAD:fix/ds-design-033-editor-separator-reset-correctness
