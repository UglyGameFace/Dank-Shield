name: Share Router Production Reconciliation

on:
  pull_request:
    paths:
      - "stoney_verify/share_router_runtime.py"
      - "stoney_verify/share_router_private_downloads.py"
      - "stoney_verify/share_router_media_titles.py"
      - "stoney_verify/share_router_media_resolver.py"
      - "stoney_verify/share_router_download_queue.py"
      - "stoney_verify/share_router_external_links.py"
      - "stoney_verify/share_router_public_server.py"
      - "stoney_verify/share_router_resources.py"
      - "stoney_verify/commands_ext/public_share_router.py"
      - "tests/test_share_router_custom_sources.py"
      - "tests/test_share_router_native_runtime.py"
      - "tests/test_share_router_private_downloads.py"
      - "tests/test_share_router_media_titles.py"
      - "tests/test_share_router_download_queue.py"
      - "tests/test_share_router_external_links.py"
      - "tests/test_user_facing_footer_cleanup.py"
      - "tests/test_share_router_media_resolver.py"
      - ".github/workflows/share-router-production-reconcile.yml"

permissions:
  contents: read

jobs:
  share-router-production:
    name: Source creation, forwarding and safety contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
      - name: Compile canonical Share Router modules
        run: python -m py_compile stoney_verify/share_router_media_resolver.py stoney_verify/share_router_media_titles.py stoney_verify/share_router_runtime.py stoney_verify/share_router_private_downloads.py stoney_verify/share_router_download_queue.py stoney_verify/share_router_external_links.py stoney_verify/share_router_resources.py stoney_verify/commands_ext/public_share_router.py
      - name: Test per-guild routes, cleanup, media compatibility and menus
        run: python -m pytest tests/test_share_router_custom_sources.py tests/test_share_router_native_runtime.py tests/test_share_router_private_downloads.py tests/test_share_router_download_queue.py tests/test_share_router_external_links.py tests/test_share_router_media_resolver.py tests/test_share_router_media_titles.py tests/test_share_router_manifest_proxy.py tests/test_user_facing_footer_cleanup.py -q --tb=short --disable-warnings
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
