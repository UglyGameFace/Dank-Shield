name: Dedicated Supabase Source Metadata (manual, read-only)

# One private, bounded direct PostgreSQL source audit, no source writes.
# Do not upload any records or credentials, enable production cutover, or
# schedule background load against the original shared database.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Explicit metadata-only audit; no source rows or schema changes"
        required: true
        type: choice
        options: [AUDIT_DANKSHIELD_SOURCE_METADATA_ONLY]

permissions:
  contents: read

concurrency:
  group: dankshield-dedicated-source-readonly-audit
  cancel-in-progress: false

jobs:
  source-schema-inventory:
    if: ${{ github.repository == 'UglyGameFace/Dank-Shield' && github.ref == 'refs/heads/main' && github.actor == 'UglyGameFace' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main, without persisted checkout credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse stale main after newer deploy changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Main changed; rerun metadata audit on new main."
            exit 1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install isolated read-only Postgres client and tests
        run: python -m pip install -q "psycopg[binary]>=3.2,<4" "pytest>=8,<10"

      - name: Validate audit guardrails without contacting a database
        run: python -m pytest -q --tb=short tests/test_dedicated_source_metadata_audit.py

      - name: Inventory original shared Supabase table metadata only
        env:
          DANK_SOURCE_DATABASE_URL: ${{ secrets.DANK_SOURCE_DATABASE_URL }}
          DANK_SOURCE_AUDIT_CONFIRMATION: ${{ inputs.confirmation }}
        run: python -m tools.audit_dankshield_source_metadata
