name: Repair Supabase migration history

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/supabase-history-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  repair:
    name: Repair history and apply pending migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            test -n "${!name:-}" || { echo "::error::$name is not configured"; exit 1; }
          done

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        shell: bash
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show migration history before repair
        shell: bash
        run: supabase migration list --linked

      - name: Dump public schema without row data
        shell: bash
        run: supabase db dump --linked --schema public --file /tmp/public-schema.sql

      - name: Verify stale-history migrations are already represented in schema
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          for table in guild_configs member_activity_notices ticket_automation_settings ticket_automation_state; do
            if grep -Eqi "CREATE TABLE .*\"?${table}\"?[[:space:]]*\(" /tmp/public-schema.sql; then
              echo "PRESENT table=${table}"
            else
              echo "::error title=Missing legacy table::public.${table} is absent; refusing migration-history repair."
              missing=1
            fi
          done

          guild_block="$(awk '
            /CREATE TABLE .*"?guild_configs"?[[:space:]]*\(/ {capture=1}
            capture {print}
            capture && /^\);/ {exit}
          ' /tmp/public-schema.sql)"
          for column in guild_id settings metadata ticket_category_id staff_role_id updated_at; do
            if grep -Eqi "^[[:space:]]*\"?${column}\"?[[:space:]]" <<<"$guild_block"; then
              echo "PRESENT guild_configs.${column}"
            else
              echo "::error title=Missing legacy column::public.guild_configs.${column} is absent; refusing migration-history repair."
              missing=1
            fi
          done

          test "$missing" -eq 0

      - name: Remove stale remote history records
        shell: bash
        run: supabase migration repair 20260426 20260611 --status reverted --linked

      - name: Show migration history after repair
        shell: bash
        run: supabase migration list --linked

      - name: Preview all migrations absent from remote history
        shell: bash
        run: supabase db push --linked --include-all --dry-run

      - name: Apply all migrations absent from remote history
        shell: bash
        run: supabase db push --linked --include-all

      - name: Verify production is fully synchronized
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked
          supabase db push --linked --dry-run
