name: Diagnose Supabase migration history

on:
  push:
    branches:
      - fix/supabase-migration-history-drift
    paths:
      - ".github/workflows/supabase-history-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Inspect migration history and schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            test -n "${!name:-}" || { echo "::error::$name is not configured"; exit 1; }
          done

      - name: List local migrations and duplicate versions
        shell: bash
        run: |
          set -euo pipefail
          echo "=== LOCAL MIGRATION FILES ==="
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort
          echo "=== DUPLICATE VERSION PREFIXES ==="
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | awk -F_ '{count[$1]++; files[$1]=files[$1] " " $0} END {for (v in count) if (count[v] > 1) print v ":" files[v]}' \
            | sort

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        shell: bash
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show local and remote migration history
        shell: bash
        run: supabase migration list

      - name: Dump public schema without data
        shell: bash
        run: supabase db dump --linked --schema public --file /tmp/public-schema.sql

      - name: Verify legacy schema objects
        shell: bash
        run: |
          set -euo pipefail
          echo "=== REQUIRED LEGACY TABLES ==="
          for table in guild_configs member_activity_notices ticket_automation_settings ticket_automation_state; do
            if grep -Eq "CREATE TABLE (IF NOT EXISTS )?(public\.)?${table}[ (]" /tmp/public-schema.sql; then
              echo "PRESENT table=${table}"
            else
              echo "MISSING table=${table}"
            fi
          done
          echo "=== GUILD CONFIG KEY COLUMNS ==="
          for column in guild_id settings metadata ticket_category_id staff_role_id updated_at; do
            if awk '/CREATE TABLE (public\.)?guild_configs/,/;/' /tmp/public-schema.sql | grep -Eq "^[[:space:]]*${column}[[:space:]]"; then
              echo "PRESENT guild_configs.${column}"
            else
              echo "MISSING guild_configs.${column}"
            fi
          done
