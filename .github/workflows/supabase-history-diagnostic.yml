name: Diagnose Supabase migration history

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/supabase-history-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  diagnose:
    name: Inspect production history and schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            test -n "${!name:-}" || { echo "::error::$name is not configured"; exit 1; }
          done

      - name: List local migration versions
        shell: bash
        run: |
          set -euo pipefail
          echo "=== LOCAL MIGRATION FILES ==="
          find supabase/migrations -type f -name '*.sql' -printf '%P\n' | sort
          echo "=== DUPLICATE VERSION PREFIXES ==="
          find supabase/migrations -type f -name '*.sql' -printf '%f\n' \
            | awk -F_ '{count[$1]++; files[$1]=files[$1] " " $0} END {for (v in count) if (count[v] > 1) print v ":" files[v]}' \
            | sort

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        shell: bash
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show local and remote migration history
        shell: bash
        run: supabase migration list

      - name: Dump public schema without row data
        shell: bash
        run: supabase db dump --linked --schema public --file /tmp/public-schema.sql

      - name: Verify legacy schema objects
        shell: bash
        run: |
          set -euo pipefail
          echo "=== REQUIRED LEGACY TABLES ==="
          for table in guild_configs member_activity_notices ticket_automation_settings ticket_automation_state; do
            if grep -Eqi "CREATE TABLE (IF NOT EXISTS )?(public\.)?${table}[ (]" /tmp/public-schema.sql; then
              echo "PRESENT table=${table}"
            else
              echo "MISSING table=${table}"
            fi
          done

          echo "=== GUILD CONFIG KEY COLUMNS ==="
          guild_block="$(awk '/CREATE TABLE (IF NOT EXISTS )?(public\.)?guild_configs[ (]/,/;/' /tmp/public-schema.sql)"
          for column in guild_id settings metadata ticket_category_id staff_role_id updated_at; do
            if grep -Eqi "^[[:space:]]*${column}[[:space:]]" <<<"$guild_block"; then
              echo "PRESENT guild_configs.${column}"
            else
              echo "MISSING guild_configs.${column}"
            fi
          done

      - name: Stop before database changes
        shell: bash
        run: |
          echo "::error title=Read-only diagnostic complete::This intentional stop exposes the logs. No migration-history or schema writes were performed."
          exit 1
