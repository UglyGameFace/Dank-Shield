name: Dank Shield Offline Final Delta Guard Tests

on:
  pull_request:
    paths:
      - "tools/stage_dankshield_offline_final_delta.py"
      - "tests/test_dankshield_offline_final_delta.py"
      - ".github/workflows/dankshield-offline-final-delta-catchup.yml"
      - ".github/workflows/dankshield-offline-final-delta-tests.yml"

permissions:
  contents: read

jobs:
  offline-final-delta-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install credential-free test dependencies
        run: python -m pip install -q "psycopg[binary]>=3.2,<4" "pytest>=8,<10"
      - name: Compile safe offline migrator
        run: python -m py_compile tools/stage_dankshield_offline_final_delta.py
      - name: Test manual-only migration safeguards
        run: python -m pytest -q --tb=short tests/test_dankshield_offline_final_delta.py tests/test_dankshield_cutover_delta_audit.py
