name: Aiven Guild Config Shadow (guarded, manual)

# Read-only preview or explicitly authorized migration into private shadow.
# No production runtime routing, source database writes or Discloud deploy.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview first; import only after verifying matching staged source"
        required: true
        type: choice
        options: [preview, import]
        default: preview
      confirmation:
        description: "For import only: IMPORT_AIVEN_GUILD_CONFIG_SHADOW_ONLY"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: dankshield-aiven-guild-config-shadow
  cancel-in-progress: false

jobs:
  check-and-import:
    if: ${{ github.repository == 'UglyGameFace/Dank-Shield' && github.ref == 'refs/heads/main' && github.actor == 'UglyGameFace' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject stale main revision
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Main advanced; rerun a fresh shadow preview."
            exit 1
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated PostgreSQL and test clients
        run: python -m pip install -q "psycopg[binary]>=3.2,<4" "pytest>=8,<10"
      - name: Validate focused shadow safety tests
        run: python -m pytest -q --tb=short tests/test_aiven_guild_config_shadow.py tests/test_postgres_guild_config_shadow.py
      - name: Preview or import source-matched private shadow
        env:
          DANK_SOURCE_DATABASE_URL: ${{ secrets.DANK_SOURCE_DATABASE_URL }}
          AIVEN_POSTGRES_URI: ${{ secrets.AIVEN_POSTGRES_URI }}
          AIVEN_POSTGRES_CA_PEM: ${{ secrets.AIVEN_POSTGRES_CA_PEM }}
          AIVEN_SHADOW_MODE: ${{ inputs.mode }}
          AIVEN_SHADOW_CONFIRMATION: ${{ inputs.confirmation }}
        run: python -m tools.aiven_guild_config_shadow
