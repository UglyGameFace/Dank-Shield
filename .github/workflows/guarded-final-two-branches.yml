name: Guarded final two branch retirements

# Owner-only, explicit two-branch operation to expose main in Discloud.
# No deployment, PR creation, database operation, or implicit cleanup.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview both candidates or delete exactly both"
        type: choice
        options:
          - preview
          - delete
        default: preview
        required: true
      confirmation:
        description: "For delete enter DELETE_VERIFIED_FINAL_PAIR"
        type: string
        required: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: guarded-merged-branch-cleanup
  cancel-in-progress: false

jobs:
  verify-and-retire-two:
    if: ${{ github.ref == 'refs/heads/main' && github.actor == 'UglyGameFace' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate both exact replacements before any deletion
        uses: actions/github-script@v7
        env:
          PAIR_MODE: ${{ inputs.mode }}
          PAIR_CONFIRMATION: ${{ inputs.confirmation }}
        with:
          script: |
            const mode = process.env.PAIR_MODE;
            if (mode !== 'preview' && mode !== 'delete') {
              throw new Error('Unsupported final-pair mode');
            }
            if (mode === 'delete' &&
                process.env.PAIR_CONFIRMATION !== 'DELETE_VERIFIED_FINAL_PAIR') {
              throw new Error('Delete requires exact final-pair owner confirmation');
            }
            const { owner, repo } = context.repo;
            const fullName = owner + '/' + repo;
            if (fullName !== 'UglyGameFace/Dank-Shield') {
              throw new Error('Wrong repository');
            }
            const branchNames = [
              'feat/cinema-library-intelligence',
              'feat/native-welcome-cards',
            ];
            const expected = new Map([
              ['feat/cinema-library-intelligence', {
                sha: '568b779fd1f9fbbf2604178d84b91e819a3c58e6',
                oldPr: 458,
                replacementPr: 459,
                replacementHead: '0547b354fce64a1512f018600a4d50a2d87110f9',
                replacementMerge: '86af2c5dd799b8dd35d0c960ff8470918e6a09e1',
                retainedBackup: 'backup/cinema-library-standalone-interleaved-20261006',
                backupSha: '2669db2358daf1cc1ad351d2514620698f12ee07',
              }],
              ['feat/native-welcome-cards', {
                sha: '2be455b9aaddb81e7b5624023aeefdce3d103f42',
                oldPr: 114,
                replacementPr: 115,
                replacementHead: 'e59cc11d6b1011ecfba2a5d871def90cf6015e9f',
                replacementMerge: '69f25ba46944721b2ddf9e92c6278e65ba575251',
                oldBase: 'fix/member-risk-card-and-update-noise',
              }],
            ]);
            const repoInfo = (await github.rest.repos.get({owner,repo})).data;
            if (repoInfo.default_branch !== 'main') {
              throw new Error('Default branch changed');
            }
            const [allBranches, openPRs] = await Promise.all([
              github.paginate(github.rest.repos.listBranches, {owner,repo,per_page:100}),
              github.paginate(github.rest.pulls.list, {owner,repo,state:'open',per_page:100}),
            ]);
            const mainPosition = allBranches.findIndex(b => b.name === 'main');
            if (mainPosition < 0 || branchNames.length !== 2 ||
                new Set(branchNames).size !== 2) {
              throw new Error('Incomplete or ambiguous final pair');
            }
            const funcs = source => source.split(String.fromCharCode(10))
              .map(line => line.match(/^(?:async )?def ([A-Za-z_][A-Za-z0-9_]*)[(]/))
              .filter(Boolean).map(match => match[1]);
            const coverage = (historical, present) => {
              const lines = source => source.split(String.fromCharCode(10))
                .map(line => line.trim()).filter(Boolean);
              const old = lines(historical);
              const current = new Set(lines(present));
              return old.length ? old.filter(line => current.has(line)).length / old.length : 0;
            };
            const readFile = async (file, ref) => {
              const value = (await github.rest.repos.getContent({
                owner,repo,path:file,ref,
              })).data;
              if (Array.isArray(value) || value.type !== 'file') {
                throw new Error('Required replacement file unavailable: ' + file);
              }
              return {
                sha: value.sha,
                text: Buffer.from(value.content, 'base64').toString('utf8'),
              };
            };
            const isAncestorOfMain = async sha => {
              const x = (await github.rest.repos.compareCommits({
                owner,repo,base:'main',head:sha,
              })).data;
              return x.ahead_by === 0 &&
                (x.status === 'behind' || x.status === 'identical');
            };
            const validated = [];
            for (const name of branchNames) {
              const proof = expected.get(name);
              const position = allBranches.findIndex(b => b.name === name);
              if (!proof || position < 0 || position >= mainPosition) {
                throw new Error('Final pair no longer precedes main: ' + name);
              }
              const listing = allBranches[position];
              if (listing.protected || listing.commit.sha !== proof.sha ||
                  openPRs.some(pr => pr.head?.repo?.full_name === fullName &&
                    pr.head.ref === name) ||
                  openPRs.some(pr => pr.base?.repo?.full_name === fullName &&
                    pr.base.ref === name)) {
                throw new Error('Protected, changed or in-use branch: ' + name);
              }
              const [oldPR, replacement] = await Promise.all([
                github.rest.pulls.get({owner,repo,pull_number:proof.oldPr}),
                github.rest.pulls.get({owner,repo,pull_number:proof.replacementPr}),
              ]);
              const old = oldPR.data, successor = replacement.data;
              if (old.state !== 'closed' || old.merged_at ||
                  old.head?.repo?.full_name !== fullName ||
                  old.head.ref !== name || old.head.sha !== proof.sha ||
                  successor.state !== 'closed' || !successor.merged_at ||
                  successor.head?.repo?.full_name !== fullName ||
                  successor.base.ref !== 'main' ||
                  successor.head.sha !== proof.replacementHead ||
                  successor.merge_commit_sha !== proof.replacementMerge ||
                  !await isAncestorOfMain(proof.replacementMerge)) {
                throw new Error('Historical PR or merged replacement mismatch: ' + name);
              }
              if (name === 'feat/cinema-library-intelligence') {
                if (old.base.ref !== 'main' ||
                    !String(old.body || '').includes(proof.retainedBackup)) {
                  throw new Error('Cinema replacement chain not documented');
                }
                const [backupBranch, backupGraph, earlier, current, oldService,
                  newService, originalTests, newTests] = await Promise.all([
                  github.rest.repos.getBranch({
                    owner,repo,branch:proof.retainedBackup,
                  }),
                  github.rest.repos.compareCommits({
                    owner,repo,base:proof.sha,head:proof.retainedBackup,
                  }),
                  readFile('stoney_verify/cinema_library_intelligence.py', proof.sha),
                  readFile('stoney_verify/cinema_library_intelligence.py', 'main'),
                  readFile('stoney_verify/cinema_library_service.py', proof.sha),
                  readFile('stoney_verify/cinema_library_service.py', 'main'),
                  readFile('tests/test_cinema_library_intelligence.py', proof.sha),
                  readFile('tests/test_cinema_library_intelligence.py', 'main'),
                ]);
                if (backupBranch.data.commit.sha !== proof.backupSha ||
                    backupGraph.data.status !== 'behind' ||
                    backupGraph.data.ahead_by !== 0 ||
                    backupGraph.data.behind_by !== 5 ||
                    funcs(earlier.text).length !== 20 ||
                    funcs(oldService.text).length !== 33 ||
                    !funcs(earlier.text).every(fn => funcs(current.text).includes(fn)) ||
                    !funcs(oldService.text).every(fn => funcs(newService.text).includes(fn)) ||
                    coverage(earlier.text, current.text) < 0.995 ||
                    coverage(oldService.text, newService.text) < 0.995 ||
                    originalTests.sha !== newTests.sha ||
                    !newTests.text.includes('test_group_recommendations_only_expose_aggregate_fit') ||
                    !newTests.text.includes('test_library_intelligence_schema_is_service_role_only_and_idempotent') ||
                    !newTests.text.includes('test_cinema_client_exposes_bot_native_library_controls_without_raw_sources')) {
                  throw new Error('Cinema replacement or exact backup proof failed');
                }
              } else if (name === 'feat/native-welcome-cards') {
                if (old.base.ref !== proof.oldBase ||
                    !String(old.body || '').includes('merged PR #115')) {
                  throw new Error('Welcome draft not explicitly superseded');
                }
                const [oldRisk,newRisk,oldModlog,newModlog,runtime,group,tests,
                  service,renderer] = await Promise.all([
                  readFile('stoney_verify/member_risk_engine.py', proof.sha),
                  readFile('stoney_verify/member_risk_engine.py', 'main'),
                  readFile('stoney_verify/modlog.py', proof.sha),
                  readFile('stoney_verify/modlog.py', 'main'),
                  readFile('stoney_verify/welcome_card_runtime.py', 'main'),
                  readFile('stoney_verify/commands_ext/public_welcome_group.py', 'main'),
                  readFile('tests/test_welcome_card_join_wiring_static.py', 'main'),
                  readFile('stoney_verify/welcome_card_service.py', 'main'),
                  readFile('stoney_verify/welcome_card_renderer.py', 'main'),
                ]);
                if (oldRisk.sha !== newRisk.sha ||
                    coverage(oldModlog.text, newModlog.text) !== 1 ||
                    !runtime.text.includes('async def send_live_welcome_card(') ||
                    !runtime.text.includes('if not welcome_cards_enabled(cfg):') ||
                    !group.text.includes('async def welcome_card_preview(') ||
                    !group.text.includes('async def welcome_card_upload(') ||
                    !service.text.includes('async def welcome_card_file(') ||
                    !renderer.text.includes('def render_welcome_card(') ||
                    !tests.text.includes('test_join_path_uses_one_canonical_studio_owned_runtime') ||
                    !tests.text.includes('test_staff_join_audit_remains_separate_from_public_card') ||
                    !tests.text.includes('test_card_permission_health_includes_attachments')) {
                  throw new Error('Welcome replacement or risk-card parity failed');
                }
              } else {
                throw new Error('Unexpected candidate name');
              }
              validated.push({name,sha:proof.sha});
              core.info('Verified exact-head replacement: ' + name + ' at ' + proof.sha);
            }
            if (validated.length !== 2 ||
                new Set(validated.map(item => item.name)).size !== 2) {
              throw new Error('Both final branches must validate together');
            }
            core.info('Exactly two verified branches. No production or backup refs targeted.');
            if (mode === 'delete') {
              // Preserve both exact commits BEFORE any branch deletion.
              for (const item of validated) {
                const ref = 'tags/branch-retirement-20261016/' + item.name;
                let archive;
                try {
                  archive = (await github.rest.git.getRef({owner,repo,ref})).data;
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
                if (!archive) {
                  await github.rest.git.createRef({
                    owner,repo,ref:'refs/' + ref,sha:item.sha,
                  });
                  archive = (await github.rest.git.getRef({owner,repo,ref})).data;
                }
                if (archive.object?.type !== 'commit' ||
                    archive.object.sha !== item.sha) {
                  throw new Error('Archive preflight failed: ' + item.name);
                }
              }
              // Double-check BOTH leases after both tags exist.
              for (const item of validated) {
                const state = (await github.rest.repos.getBranch({
                  owner,repo,branch:item.name,
                })).data;
                if (state.protected || state.commit.sha !== item.sha) {
                  throw new Error('Branch changed after archive preflight: ' + item.name);
                }
              }
              const deleted = [];
              for (const item of validated) {
                const state = (await github.rest.repos.getBranch({
                  owner,repo,branch:item.name,
                })).data;
                if (state.protected || state.commit.sha !== item.sha) {
                  throw new Error('Partial cleanup: branch changed before deletion: ' +
                    item.name + '; deleted so far: ' + deleted.join(','));
                }
                try {
                  await github.rest.git.deleteRef({
                    owner,repo,ref:'heads/' + item.name,
                  });
                  deleted.push(item.name);
                  core.info('Deleted verified branch: ' + item.name);
                } catch (error) {
                  throw new Error('Partial cleanup: failed deleting ' + item.name +
                    '; deleted so far: ' + deleted.join(',') +
                    '; GitHub status: ' + String(error.status || 'unknown'));
                }
              }
              const remaining = await github.paginate(
                github.rest.repos.listBranches,{owner,repo,per_page:100});
              if (validated.some(item =>
                    remaining.some(branch => branch.name === item.name))) {
                throw new Error('Final pair deletion not fully reflected in GitHub');
              }
              const newPosition = remaining.findIndex(branch => branch.name === 'main') + 1;
              core.info('Final-pair deletion complete. Branches: ' +
                remaining.length + '; main alphabetically: ' + newPosition);
              if (newPosition > 30) {
                throw new Error('Pair deleted but main still outside the 30-branch cutoff');
              }
            }
            await core.summary
              .addHeading('Exact two-branch cleanup')
              .addRaw('Mode: **' + mode + '**\n\n' +
                validated.map(item => '- ' + item.name + ' at ' + item.sha)
                  .join('\n') +
                '\n\nBoth replacements and historical commits verified.')
              .write();
