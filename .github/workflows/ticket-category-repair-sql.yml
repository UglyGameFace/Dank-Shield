name: Ticket Category Repair SQL

on:
  pull_request:
    paths:
      - "supabase/migrations/20260807220000_repair_managed_ticket_category_duplicates.sql"
      - "stoney_verify/tickets_new/managed_category_service.py"
      - "stoney_verify/startup_guards/ticket_category_schema_bootstrap_guard.py"
      - ".github/workflows/ticket-category-repair-sql.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/20260807220000_repair_managed_ticket_category_duplicates.sql"
      - "stoney_verify/tickets_new/managed_category_service.py"
      - "stoney_verify/startup_guards/ticket_category_schema_bootstrap_guard.py"
      - ".github/workflows/ticket-category-repair-sql.yml"
  workflow_dispatch:

jobs:
  repair-sql:
    name: Historical duplicate repair and selection preservation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - name: Prepare pre-v2 schema and guilds
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;

          do $$
          begin
              if not exists (select 1 from pg_roles where rolname = 'anon') then create role anon; end if;
              if not exists (select 1 from pg_roles where rolname = 'authenticated') then create role authenticated; end if;
              if not exists (select 1 from pg_roles where rolname = 'service_role') then create role service_role; end if;
          end;
          $$;

          create table public.guild_configs (
              guild_id text primary key,
              updated_at timestamptz not null default now()
          );

          create table public.ticket_categories (
              id uuid primary key default gen_random_uuid(),
              guild_id text not null,
              slug text not null,
              name text not null,
              description text,
              intake_type text not null default 'general',
              match_keywords jsonb not null default '[]'::jsonb,
              button_label text,
              sort_order integer not null default 999,
              is_default boolean not null default false,
              is_enabled boolean not null default true,
              created_at timestamptz not null default now(),
              updated_at timestamptz not null default now()
          );

          insert into public.guild_configs(guild_id)
          values ('selected-guild'), ('custom-guild');

          insert into public.ticket_categories(
              guild_id, slug, name, description, intake_type,
              sort_order, is_default, is_enabled
          ) values (
              'custom-guild', 'clan_application', 'Clan Application',
              'Owner-created custom category.', 'custom', 5, true, true
          );
          SQL

      - name: Install category setup v2 and save owner selections
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260802042000_ticket_category_setup_selection.sql

          psql -v ON_ERROR_STOP=1 <<'SQL'
          select * from public.save_dank_ticket_category_selection(
              'selected-guild',
              array['verification','report','support']::text[],
              'owner-1',
              'Owner One'
          );

          select * from public.save_dank_ticket_category_selection(
              'custom-guild',
              array[]::text[],
              'owner-2',
              'Owner Two'
          );
          SQL

      - name: Inject historical corruption and visible duplicates
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          -- Correct key + canonical slug, but wrong visible label. The key/slug
          -- must win and the label must be rewritten to Bug / Technical Support.
          update public.ticket_categories
             set name = 'Support', button_label = 'Support'
           where guild_id = 'selected-guild'
             and managed_category_key = 'bug';

          -- Wrong key + correct Support slug/name. Free the question key first so
          -- the partial unique index still permits this historical bad shape.
          update public.ticket_categories
             set managed_category_key = null
           where guild_id = 'selected-guild'
             and managed_category_key = 'question';

          update public.ticket_categories
             set managed_category_key = 'question'
           where guild_id = 'selected-guild'
             and slug = 'support';

          -- Pre-managed reserved aliases: these are safe to adopt/delete because
          -- their slugs are reserved historical Dank Shield slugs.
          insert into public.ticket_categories(
              guild_id, slug, name, button_label, description, intake_type,
              sort_order, is_default, is_enabled, managed_by_dank,
              managed_catalog_version, managed_category_key
          ) values
          ('selected-guild','general-support','Support','Support','Old bot support row.','general',998,false,true,false,null,null),
          ('selected-guild','user-report','Report a Member','Report a Member','Old bot report row.','report',51,false,true,false,null,null);

          -- This is intentionally owner-created. The display name resembles a
          -- built-in, but the slug is not reserved, so repair must preserve it.
          insert into public.ticket_categories(
              guild_id, slug, name, button_label, description, intake_type,
              sort_order, is_default, is_enabled, managed_by_dank,
              managed_catalog_version, managed_category_key
          ) values (
              'selected-guild','vip_support_portal','Support','Support',
              'Owner-created VIP support flow.','custom',15,false,true,false,null,null
          );
          SQL

      - name: Apply DS-TICKET-CAT-022 repair twice
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2; do
            echo "Applying managed ticket-category repair pass ${pass}"
            psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260807220000_repair_managed_ticket_category_duplicates.sql
          done

      - name: Verify canonical shape, selections, custom preservation, and idempotency
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
              managed_total integer;
              bad_shapes integer;
              duplicate_keys integer;
              enabled_keys text[];
              setup_version integer;
              setup_required boolean;
              selected_keys jsonb;
              reserved_legacy_left integer;
              custom_alive boolean;
              custom_enabled boolean;
              custom_guild_managed_enabled integer;
              custom_guild_alive boolean;
          begin
              select count(*) into managed_total
              from public.ticket_categories
              where guild_id = 'selected-guild'
                and managed_by_dank = true;
              if managed_total <> 16 then
                  raise exception 'expected 16 managed rows after repair, got %', managed_total;
              end if;

              select count(*) into bad_shapes
              from public.ticket_categories tc
              join public.dank_ticket_category_catalog() catalog
                on catalog.category_key = tc.managed_category_key
              where tc.guild_id = 'selected-guild'
                and tc.managed_by_dank = true
                and (
                    tc.slug is distinct from catalog.slug
                    or tc.name is distinct from catalog.name
                    or tc.button_label is distinct from catalog.name
                    or tc.description is distinct from catalog.description
                    or tc.intake_type is distinct from catalog.intake_type
                    or tc.sort_order is distinct from catalog.sort_order
                    or tc.managed_catalog_version is distinct from 3
                );
              if bad_shapes <> 0 then
                  raise exception '% managed rows still have non-canonical shape', bad_shapes;
              end if;

              select count(*) into duplicate_keys
              from (
                  select managed_category_key
                  from public.ticket_categories
                  where guild_id = 'selected-guild'
                    and managed_by_dank = true
                  group by managed_category_key
                  having count(*) > 1
              ) d;
              if duplicate_keys <> 0 then
                  raise exception 'duplicate managed keys remain: %', duplicate_keys;
              end if;

              select array_agg(managed_category_key order by managed_category_key)
                         filter (where is_enabled = true)
                into enabled_keys
                from public.ticket_categories
               where guild_id = 'selected-guild'
                 and managed_by_dank = true;
              if enabled_keys <> array['report','support','verification']::text[] then
                  raise exception 'saved selection was not preserved: %', enabled_keys;
              end if;

              select ticket_category_setup_version,
                     ticket_category_setup_required,
                     ticket_category_setup_selected_keys
                into setup_version, setup_required, selected_keys
                from public.guild_configs
               where guild_id = 'selected-guild';
              if setup_version <> 2 or setup_required is true then
                  raise exception 'valid setup v2 was invalidated: version %, required %', setup_version, setup_required;
              end if;
              if selected_keys <> '["verification", "report", "support"]'::jsonb then
                  raise exception 'saved selected keys changed: %', selected_keys;
              end if;

              select count(*) into reserved_legacy_left
              from public.ticket_categories
              where guild_id = 'selected-guild'
                and managed_by_dank = false
                and slug in ('general-support','user-report');
              if reserved_legacy_left <> 0 then
                  raise exception 'reserved legacy duplicate rows remain: %', reserved_legacy_left;
              end if;

              select exists (
                  select 1 from public.ticket_categories
                  where guild_id = 'selected-guild'
                    and slug = 'vip_support_portal'
                    and managed_by_dank = false
              ), exists (
                  select 1 from public.ticket_categories
                  where guild_id = 'selected-guild'
                    and slug = 'vip_support_portal'
                    and managed_by_dank = false
                    and is_enabled = true
              ) into custom_alive, custom_enabled;
              if custom_alive is not true or custom_enabled is not true then
                  raise exception 'owner custom Support-named row was not preserved';
              end if;

              select count(*) filter (where managed_by_dank = true and is_enabled = true),
                     exists (
                         select 1 from public.ticket_categories c
                         where c.guild_id = 'custom-guild'
                           and c.slug = 'clan_application'
                           and c.managed_by_dank = false
                           and c.is_enabled = true
                     )
                into custom_guild_managed_enabled, custom_guild_alive
                from public.ticket_categories
               where guild_id = 'custom-guild';
              if custom_guild_managed_enabled <> 0 or custom_guild_alive is not true then
                  raise exception 'custom-only guild changed: managed enabled %, custom alive %', custom_guild_managed_enabled, custom_guild_alive;
              end if;
          end;
          $$;
          SQL
