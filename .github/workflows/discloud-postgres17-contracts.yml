name: Discloud PostgreSQL 17 Contracts

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/discloud-postgres17-contracts.yml"
      - "postgres/migrations/**"
      - "postgres/data_lifecycle.json"
      - "stoney_verify/core_data_stage.py"
      - "stoney_verify/postgres_storage_budget.py"
      - "tools/audit_discloud_postgres_storage.py"
      - "tools/stage_dankshield_core_data.py"
      - "tools/materialize_dankshield_pg_config.py"
      - "tests/test_postgres_storage_budget.py"
      - "stoney_verify/postgres_guild_config_repo.py"
      - "stoney_verify/postgres_guild_config_shadow.py"
      - "stoney_verify/postgres_guild_config_parity.py"
      - "tools/audit_dankshield_guild_config_parity.py"
      - "tests/test_postgres_guild_config_parity.py"
      - "stoney_verify/source_pg_backup.py"
      - "tools/backup_dankshield_supabase_source.py"
      - "tests/test_source_pg_backup.py"
      - "tests/test_source_pg_backup_pg17_integration.py"
      - ".github/workflows/verify-source-backup9-restore.yml"
      - "tools/verify_source_backup_restoration.py"
      - "tests/test_source_backup_restore_drill.py"
      - "tests/test_source_backup_restoration_pg17_integration.py"
      - "requirements-backup.txt"
      - ".github/workflows/manual-encrypted-supabase-backup.yml"
      - "tools/setup_pg17_backup_clients.sh"
      - "tests/test_manual_supabase_backup_workflow.py"
      - "tests/test_core_data_stage.py"
      - "tests/test_postgres_guild_config_repo.py"
      - "tests/test_postgres_guild_config_pg17_integration.py"
      - "tests/test_postgres_data_lifecycle.py"
      - "tests/test_aiven_history_archive.py"
      - "tools/aiven_history_archive.py"
      - ".github/workflows/aiven-compressed-history-archive.yml"
      - "supabase/migrations/20261013120000_member_activity_batch_rpc.sql"
      - "tests/test_activity_batch_sql_pg17_integration.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/discloud-postgres17-contracts.yml"
      - "postgres/migrations/**"
      - "stoney_verify/postgres_guild_config_repo.py"
      - "stoney_verify/postgres_guild_config_parity.py"
      - "tests/test_postgres_guild_config_pg17_integration.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-pg17:
    name: Real PG17 staging, CAS and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      DANK_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      RUN_CORE_PG_INTEGRATION: "1"
      RUN_PG_GUILD_CONFIG_INTEGRATION: "1"
      RUN_PG_BACKUP_INTEGRATION: "1"
      RUN_ACTIVITY_BATCH_SQL_INTEGRATION: "1"
      DANK_STARTUP_LOG_STYLE: quiet
      DANK_COMMAND_LOG_STYLE: quiet
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install -q "pytest>=8,<10" "psycopg[binary]>=3.2,<4" "discord.py>=2.6,<3" "supabase>=2.24,<3" "python-dotenv>=1,<1.1"
      - name: Install encryption tests dependencies
        run: python -m pip install -q -r requirements-backup.txt
      - name: Install staging schemas twice
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for pass in 1 2; do
            psql -v ON_ERROR_STOP=1 -f postgres/migrations/202610130002_core_staging.sql
            psql -v ON_ERROR_STOP=1 -f postgres/migrations/202610130003_guild_config_shadow.sql
            psql -v ON_ERROR_STOP=1 -f postgres/migrations/202610130004_guild_config_atomic_state.sql
          done
      - name: Verify isolated PG17 schema and concurrency
        run: |
          python -m pytest -q --tb=short \
            tests/test_postgres_storage_budget.py \
            tests/test_core_data_stage.py \
            tests/test_postgres_guild_config_repo.py \
            tests/test_postgres_guild_config_parity.py \
            tests/test_source_pg_backup.py \
            tests/test_source_pg_backup_pg17_integration.py \
            tests/test_source_backup_restore_drill.py \
            tests/test_source_backup_restoration_pg17_integration.py \
            tests/test_manual_supabase_backup_workflow.py \
            tests/test_postgres_guild_config_pg17_integration.py \
            tests/test_postgres_data_lifecycle.py \
            tests/test_aiven_history_archive.py \
            tests/test_activity_batch_sql_pg17_integration.py

  backup9-supabase-pg17:
    name: Supabase Vault PG17 recovery target
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: supabase/postgres:17.6.1.136
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_PORT: "5432"
          PGPORT: "5432"
          PGUSER: supabase_admin
          PGPASSWORD: postgres
          PGDATABASE: postgres
          PGHOST: /var/run/postgresql
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      DANK_RECOVERY_DISPOSABLE_PG17: YES_ISOLATED
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: supabase_admin
      PGPASSWORD: postgres
      PGDATABASE: postgres
      RUN_PG_BACKUP_INTEGRATION: "1"
      RUN_BACKUP9_SUPABASE_IMAGE_INTEGRATION: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated recovery test dependencies
        run: python -m pip install -q -r requirements-backup.txt "psycopg[binary]>=3.2,<4" "pytest>=8,<10"
      - name: Prove Supabase PG17 can create Vault in a fresh database
        run: |
          python -m pytest -q --tb=short \
            tests/test_source_backup_restoration_pg17_integration.py \
            -k test_supabase_recovery_service_can_create_vault_extension
