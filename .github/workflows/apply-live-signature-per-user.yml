name: Apply Live Signature Per-User Runtime

on:
  push:
    branches:
      - fix/live-signature-per-user-moderation-safe

permissions:
  contents: write

jobs:
  wire-runtime:
    if: "!contains(github.event.head_commit.message, '[skip live-runtime-wire]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-signature-per-user-moderation-safe
          fetch-depth: 0
      - name: Wire canonical runtime export
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('stoney_verify/profile_card_runtime.py')
          text = path.read_text(encoding='utf-8')
          marker = '# Canonical public runtime: per-member ownership and moderation-safe output.'
          if marker not in text:
              text = text.rstrip() + (
                  '\n\n' + marker + '\n'
                  'from .profile_card_runtime_per_user import (\n'
                  '    LiveProfileCardRuntime as LiveProfileCardRuntime,\n'
                  '    is_internal_live_signature_message as is_internal_live_signature_message,\n'
                  ')\n'
              )
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit wiring when needed
        run: |
          if git diff --quiet -- stoney_verify/profile_card_runtime.py; then
            exit 0
          fi
          git config user.name "Dank Shield CI"
          git config user.email "actions@users.noreply.github.com"
          git add stoney_verify/profile_card_runtime.py
          git commit -m "Wire per-member live signature runtime [skip live-runtime-wire]"
          git push origin HEAD:fix/live-signature-per-user-moderation-safe
