name: DS Backlog 027 Exact Patch

on:
  push:
    branches:
      - fix/ds-backlog-integrity-027
    paths:
      - '.github/workflows/ds-backlog-027-patch.yml'
      - 'tools/ds_backlog_027_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact owner-file patch
        run: python tools/ds_backlog_027_patch.py
      - name: Compile patched owners and canonical services
        run: |
          python -m py_compile \
            stoney_verify/api_new/server.py \
            stoney_verify/api_new/queued_handlers.py \
            stoney_verify/api_new/channel_builder_routes.py \
            stoney_verify/services/channel_builder_execution.py \
            stoney_verify/operation_queue.py \
            stoney_verify/commands_ext/public_members_cleanup_group.py \
            stoney_verify/members_new/cleanup_service.py
      - name: Verify obsolete forced-confirm and startup shims are unwired
        run: |
          ! grep -F 'if True:  # Safety invariant: mass cleanup always requires confirmation.' stoney_verify/commands_ext/public_members_cleanup_group.py
          grep -F 'queued_api_handler(sys.modules[__name__]' stoney_verify/api_new/server.py
          grep -F 'operation_queue=operation_queue_health_summary()' stoney_verify/api_new/server.py
          ! grep -F 'channel_builder_runtime_exports_guard' stoney_verify/startup_guards/__init__.py
          ! grep -F 'api_operation_queue_guard' stoney_verify/startup_guards/__init__.py
          ! grep -F 'operation_queue_persistence_retry_guard' stoney_verify/startup_guards/__init__.py
          grep -F 'actor_can_use_no_confirm' stoney_verify/commands_ext/public_members_cleanup_group.py
          grep -F 'finalize_cleanup_run' stoney_verify/commands_ext/public_members_cleanup_group.py
      - name: Commit patched owner files
        run: |
          if git diff --quiet; then
            echo 'owner files already patched'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            stoney_verify/api_new/server.py \
            stoney_verify/startup_guards/__init__.py \
            stoney_verify/commands_ext/public_members_cleanup_group.py
          git commit -m 'Wire canonical queue and cleanup paths directly'
          git push
