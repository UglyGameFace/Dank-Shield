name: Aiven PostgreSQL connection (manual, read-only)

# Does not run on push, deploy bot code, create DB objects, or replace Supabase.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dankshield-aiven-readonly-connection
  cancel-in-progress: false

jobs:
  check-aiven-database:
    if: ${{ github.ref == 'refs/heads/main' && github.actor == 'UglyGameFace' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out scripts (no bot deployment)
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PostgreSQL client
        run: python -m pip install -q 'psycopg[binary]>=3.2,<4'
      - name: Probe Aiven with SELECT-only SQL and TLS
        env:
          AIVEN_POSTGRES_URI: ${{ secrets.AIVEN_POSTGRES_URI }}
          # Optional. Without the CA, the probe checks encryption only.
          # Add Aiven's public project CA as this secret for verify-full.
          AIVEN_POSTGRES_CA_PEM: ${{ secrets.AIVEN_POSTGRES_CA_PEM }}
        run: python -m tools.probe_aiven_postgres
