name: Apply Live Profile Card Owner Integration

on:
  push:
    branches:
      - feature/live-profile-cards

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DANK_STARTUP_LOG_STYLE: quiet
      DANK_COMMAND_LOG_STYLE: quiet

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/live-profile-cards
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt pytest

      - name: Apply native owner integration
        id: patch
        run: |
          set +e
          python tools/apply_live_profile_card_owner_integration.py > profile-owner-patch.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload exact patch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-owner-patch-log
          path: profile-owner-patch.log
          if-no-files-found: warn
          retention-days: 3

      - name: Fail when native patch fails
        if: steps.patch.outputs.exit_code != '0'
        run: |
          cat profile-owner-patch.log
          exit 1

      - name: Remove temporary patch script
        if: steps.patch.outputs.exit_code == '0'
        run: rm -f tools/apply_live_profile_card_owner_integration.py profile-owner-patch.log

      - name: Compile changed profile modules
        if: steps.patch.outputs.exit_code == '0'
        run: |
          python -m py_compile \
            stoney_verify/profile_card_service.py \
            stoney_verify/profile_card_runtime.py \
            stoney_verify/commands_ext/public_profile_cards.py \
            stoney_verify/commands_ext/public_self_roles_group.py \
            stoney_verify/commands.py

      - name: Run focused profile-card tests
        if: steps.patch.outputs.exit_code == '0'
        run: |
          python -m pytest -q \
            tests/test_profile_card_service.py \
            tests/test_live_profile_card_runtime.py \
            tests/test_live_profile_card_integration_contract.py \
            tests/test_command_surface_uniqueness.py

      - name: Inspect whitespace and temporary cleanup
        if: steps.patch.outputs.exit_code == '0'
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check
          test ! -f tools/apply_live_profile_card_owner_integration.py

      - name: Commit validated native integration
        if: steps.patch.outputs.exit_code == '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate profile privacy into canonical profile views'
          git push origin HEAD:feature/live-profile-cards
