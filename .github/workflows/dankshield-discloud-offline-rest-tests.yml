name: Dank Shield Discloud Offline REST Probe Guard Tests

on:
  pull_request:
    paths:
      - main.py
      - stoney_verify/offline_candidate_rest_probe.py
      - stoney_verify/candidate_supabase_shadow_probe.py
      - tests/test_offline_candidate_rest_probe.py
      - tests/test_candidate_shadow_rest_probe.py
      - .github/workflows/dankshield-discloud-offline-rest-tests.yml
  push:
    branches: [main]
    paths:
      - main.py
      - stoney_verify/offline_candidate_rest_probe.py
      - stoney_verify/candidate_supabase_shadow_probe.py
      - tests/test_offline_candidate_rest_probe.py
      - tests/test_candidate_shadow_rest_probe.py
      - .github/workflows/dankshield-discloud-offline-rest-tests.yml

permissions:
  contents: read

jobs:
  discloud-offline-probe-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install no-secret test dependencies
        run: python -m pip install -q "pytest>=8,<10"
      - name: Ensure guarded entrypoint compiles
        run: python -m py_compile main.py stoney_verify/offline_candidate_rest_probe.py
      - name: Offline/no-network cutover probe regression tests
        run: python -m pytest -q --tb=short tests/test_offline_candidate_rest_probe.py tests/test_candidate_shadow_rest_probe.py
