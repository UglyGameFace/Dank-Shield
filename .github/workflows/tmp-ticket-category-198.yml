name: Temporary DS Ticket Category 198 Patcher

on:
  push:
    branches:
      - fix/ticket-category-preserved-selection-198
    paths:
      - tools/_tmp_patch_ticket_category_198.py
      - tools/_tmp_postpatch_ticket_category_198.py
      - .github/workflows/tmp-ticket-category-198.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/ticket-category-preserved-selection-198
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Apply deterministic patch
        run: |
          python tools/_tmp_patch_ticket_category_198.py
          python tools/_tmp_postpatch_ticket_category_198.py

      - name: Compile changed Python
        run: |
          python -m py_compile \
            stoney_verify/tickets_new/managed_category_service.py \
            stoney_verify/startup_guards/ticket_form_default_templates_guard.py \
            stoney_verify/startup_guards/ticket_category_schema_bootstrap_guard.py \
            tests/test_ticket_category_setup_selection.py \
            tools/audit_ticket_category_menu.py

      - name: Run focused category regressions
        run: |
          python -m pytest -q \
            tests/test_ticket_category_setup_selection.py \
            tests/test_ticket_picker_legacy_default_reconciliation.py
          python tools/audit_ticket_category_menu.py

      - name: Remove temporary patch machinery
        run: |
          rm -f tools/_tmp_patch_ticket_category_198.py
          rm -f tools/_tmp_postpatch_ticket_category_198.py
          rm -f .github/workflows/tmp-ticket-category-198.yml

      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: restore rich ticket category selection" || exit 0
          git push origin HEAD:fix/ticket-category-preserved-selection-198
