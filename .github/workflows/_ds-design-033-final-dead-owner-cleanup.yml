name: DS Design 033 Final Dead Owner Cleanup

on:
  push:
    branches:
      - fix/ds-design-033-editor-separator-reset-correctness
    paths:
      - '.github/workflows/_ds-design-033-final-dead-owner-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/ds-design-033-editor-separator-reset-correctness
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Repair drifted regression contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_dank_design_editor_reset_033.py")
          source = path.read_text(encoding="utf-8")

          replacements = {
              'updated = rules.persist_separator_authority(options, "bar_heavy")':
                  'updated = rules.persist_separator_choice(options, separator_id="bar_heavy")',
              '    assert updated["category_format_locks"] == options["category_format_locks"]\n    assert updated["channel_format_locks"] == options["channel_format_locks"]':
                  '    assert updated["category_format_locks"]["10"]["separator_id"] == "bar_heavy"\n    assert updated["category_format_locks"]["10"]["strength"] == 2\n    assert updated["channel_format_locks"]["20"]["separator_id"] == "bar_heavy"\n    assert updated["channel_format_locks"]["20"]["strength"] == 4',
              'updated, removed = rules.reset_item_overrides(options, target_id=10, current_name="staff", include_category=True)':
                  'updated, removed = rules.reset_item_overrides(options, target_id=10)',
              '    assert removed == 4':
                  '    assert removed == {"category": True, "channel": True, "manual_name": True, "protection_item": True}',
              '    assert "staff" not in updated["protection_rules"]':
                  '    assert updated["protection_rules"]["staff"] == "never"',
              '    updated, removed = rules.reset_all_overrides(options)\n    assert removed == 5':
                  '    updated = rules.reset_all_overrides(options)',
              'plan_service.legacy':
                  'legacy',
          }

          for old, new in replacements.items():
              count = source.count(old)
              if count == 0:
                  raise RuntimeError(f"expected regression drift marker missing: {old!r}")
              if old != 'plan_service.legacy' and count != 1:
                  raise RuntimeError(f"expected one regression drift marker, found {count}: {old!r}")
              source = source.replace(old, new)

          if "persist_separator_authority" in source or "plan_service.legacy" in source:
              raise RuntimeError("drifted service API references survived repair")
          if 'current_name="staff"' in source or "include_category=True" in source:
              raise RuntimeError("obsolete reset_item_overrides arguments survived repair")

          path.write_text(source, encoding="utf-8")
          PY

      - name: Remove final dead legacy owners and validate
        run: |
          # Exact AST reference ownership plus tests migrated to the consolidated V2 owners.
          python tools/_ds_design_033_final_dead_owner_cleanup.py
          python -m py_compile \
            stoney_verify/commands_ext/public_design_studio.py \
            stoney_verify/commands_ext/public_design_studio_v2.py \
            tools/audit_dank_design_redundancy_033.py
          python -m pytest -q --tb=short --disable-warnings \
            tests/test_dank_design_consistency_030.py \
            tests/test_dank_design_runtime_ownership_033.py \
            tests/test_design_studio_consolidation_032.py \
            tests/test_dank_design_editor_reset_033.py \
            tests/test_dank_design_editor_state_authority.py \
            tests/test_public_design_style_change_native_guard_applier_static.py \
            tests/test_public_design_rollback_native_guard_applier_static.py \
            tests/test_setup_design_bridge_behavior.py
          python tools/audit_dank_design_redundancy_033.py
          python tools/audit_dank_design_smart_auto_detect.py
          git diff --check

      - name: Commit validated cleanup and remove temporary machinery
        run: |
          rm tools/_ds_design_033_final_dead_owner_cleanup.py
          rm .github/workflows/_ds-design-033-final-dead-owner-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Expected final dead-owner cleanup produced no changes"
            exit 1
          fi
          git commit -m "DS-DESIGN-033: remove final dead legacy Design owners"
          git push origin HEAD:fix/ds-design-033-editor-separator-reset-correctness
