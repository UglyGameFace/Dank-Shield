name: Deploy Supabase migrations

on:
  workflow_run:
    workflows: ["Dank Shield CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact CI-green current main SHA to deploy"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Push pending migrations
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.target_sha }}

    steps:
      - name: Check out validated release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify immutable current-main target
        shell: bash
        run: |
          set -euo pipefail

          if ! printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error title=Invalid release SHA::target_sha must be a full 40-character lowercase commit SHA."
            exit 1
          fi

          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$TARGET_SHA" ]; then
            echo "::error title=Checkout mismatch::Expected $TARGET_SHA but checked out $actual_sha."
            exit 1
          fi

          git fetch --quiet origin main
          current_main_sha="$(git rev-parse origin/main)"
          if [ "$TARGET_SHA" != "$current_main_sha" ]; then
            echo "::error title=Stale release target::$TARGET_SHA is not the current canonical main head ($current_main_sha)."
            exit 1
          fi

          echo "Validated current production migration target: $TARGET_SHA"

      - name: Verify manual target passed canonical CI
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          runs="$(
            gh api --method GET \
              -f branch=main \
              -f event=push \
              -f status=success \
              -f head_sha="$TARGET_SHA" \
              -f per_page=100 \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs"
          )"

          if ! jq -e --arg sha "$TARGET_SHA" '
            .workflow_runs[]
            | select(
                .head_sha == $sha
                and .conclusion == "success"
                and .event == "push"
                and .head_branch == "main"
              )
          ' <<<"$runs" >/dev/null; then
            echo "::error title=Canonical CI not proven::No successful Dank Shield CI push run on main was found for $TARGET_SHA."
            exit 1
          fi

          echo "Canonical CI success verified for manual target: $TARGET_SHA"

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing GitHub secret::$name is not configured."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify linked project is current DankShield production
        shell: bash
        run: |
          set -euo pipefail
          # This is a public project reference, not a key or secret. The
          # immutable allowlist prevents successful writes to the old project
          # even if somebody forgets to rotate the Actions secret.
          expected_live_project="viamriafkbqhquvrsnua"
          if [ "$SUPABASE_PROJECT_ID" != "$expected_live_project" ]; then
            echo "::error title=Wrong production database::GitHub SUPABASE_PROJECT_ID does not match the live DankShield project. Migration cancelled before any link or SQL."
            exit 1
          fi
          echo "DankShield live project identity verified."

      - name: Initialize isolated live migration directory
        shell: bash
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/dankshield-live-migration-workdir"
          mkdir -p "$workdir"
          (cd "$workdir" && supabase init)
          echo "LIVE_WORKDIR=$workdir" >> "$GITHUB_ENV"

      - name: Link ONLY the approved live DankShield project
        shell: bash
        run: |
          set -euo pipefail
          cd "$LIVE_WORKDIR"
          supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Fetch already applied live migrations (read-only)
        shell: bash
        run: |
          set -euo pipefail
          cd "$LIVE_WORKDIR"
          supabase migration fetch --linked

      - name: Verify live migration baseline and stage only new SQL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import shutil
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          destination = Path(os.environ["LIVE_WORKDIR"]) / "supabase" / "migrations"
          baseline_file = root / "supabase_live" / "production_baseline_versions.txt"
          incoming_dir = root / "supabase_live" / "migrations"
          baseline = {
              line.strip()
              for line in baseline_file.read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          }
          if len(baseline) < 25 or any(not re.fullmatch(r"\d{14}", x) for x in baseline):
              raise SystemExit("Invalid known-safe production migration baseline")
          if not {"20261023014508", "20261023014518"}.issubset(baseline):
              raise SystemExit("Missing known live 4:20 production migration history")
          last_initial = max(baseline)
          def version(path: Path) -> str:
              match = re.fullmatch(r"(\d{14})_[A-Za-z0-9_]+\.sql", path.name)
              if match is None:
                  raise SystemExit(f"Invalid migration filename: {path.name}")
              return match.group(1)

          remote_files = list(destination.glob("*.sql"))
          remote = {version(path): path for path in remote_files}
          if len(remote) != len(remote_files):
              raise SystemExit("Duplicate migration versions in fetched history")
          future_files = list(incoming_dir.glob("*.sql"))
          future = {version(path): path for path in future_files}
          if len(future) != len(future_files):
              raise SystemExit("Duplicate versions in reviewed live migrations")
          if set(future) & baseline:
              raise SystemExit("Future migrations overlap already-applied baseline")
          if any(v <= last_initial for v in future):
              raise SystemExit("New migration timestamp predates live baseline")
          missing = baseline - set(remote)
          unknown = set(remote) - baseline - set(future)
          if missing or unknown:
              raise SystemExit(
                  f"Live migration history drift: missing={sorted(missing)} "
                  f"unreviewed_remote={sorted(unknown)}. No push attempted."
              )
          for v, local_file in sorted(future.items()):
              if v in remote:
                  if remote[v].read_bytes().rstrip() != local_file.read_bytes().rstrip():
                      raise SystemExit(
                          f"Already-applied migration {v} differs from committed SQL"
                      )
              else:
                  shutil.copyfile(local_file, destination / local_file.name)
          print(
              f"Verified {len(baseline)} original applied versions; "
              f"{len(future)} reviewed future migrations; "
              f"{len(set(future) - set(remote))} pending. Legacy project files excluded."
          )
          PY

      - name: Show LIVE migration status
        shell: bash
        run: |
          cd "$LIVE_WORKDIR"
          supabase migration list

      - name: Preview LIVE pending migrations
        shell: bash
        run: |
          cd "$LIVE_WORKDIR"
          supabase db push --dry-run --include-all

      - name: Apply only reviewed LIVE pending migrations
        shell: bash
        run: |
          cd "$LIVE_WORKDIR"
          supabase db push --include-all
