name: Deploy Supabase migrations

on:
  workflow_run:
    workflows: ["Dank Shield CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact CI-green commit SHA from main to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Push pending migrations
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.target_sha }}

    steps:
      - name: Check out validated release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify immutable main-history target
        shell: bash
        run: |
          set -euo pipefail

          if ! printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error title=Invalid release SHA::target_sha must be a full 40-character lowercase commit SHA."
            exit 1
          fi

          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$TARGET_SHA" ]; then
            echo "::error title=Checkout mismatch::Expected $TARGET_SHA but checked out $actual_sha."
            exit 1
          fi

          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "::error title=Untrusted release target::$TARGET_SHA is not in the canonical main history."
            exit 1
          fi

          echo "Validated production migration target: $TARGET_SHA"

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing GitHub secret::$name is not configured."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        shell: bash
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show migration status
        shell: bash
        run: supabase migration list

      - name: Preview pending migrations
        shell: bash
        run: supabase db push --dry-run --include-all

      - name: Apply pending migrations
        shell: bash
        run: supabase db push --include-all
