name: Compact Profile Full Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  full-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest
      - name: Run full pytest and capture summary
        id: pytest
        shell: bash
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
        run: |
          set +e
          python -m pytest tests/ -q --tb=short --disable-warnings > full-pytest.txt 2>&1
          status=$?
          cat full-pytest.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload full pytest output
        uses: actions/upload-artifact@v4
        with:
          name: compact-profile-full-pytest
          path: full-pytest.txt
          if-no-files-found: error
      - name: Fail when pytest failed
        if: steps.pytest.outputs.status != '0'
        run: exit 1
