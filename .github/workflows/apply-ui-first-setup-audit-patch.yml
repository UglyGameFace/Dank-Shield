name: Apply UI First Setup Audit Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-command-payload-limit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python tools/patch_ui_first_setup_audit_once.py
          rm -f tools/patch_ui_first_setup_audit_once.py .github/workflows/apply-ui-first-setup-audit-patch.yml
          git diff --check
      - run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest
      - run: |
          python tools/audit_setup_safety.py
          python -m pytest -q --tb=short --disable-warnings tests/test_setup_advanced_options_behavior.py tests/test_setup_aio_navigation_behavior.py tests/test_ui_first_dank_command_surface.py
          python tools/test_dank_command_payload.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Recognize Welcome and Join in setup safety audit"
          git push origin HEAD:fix/profile-command-payload-limit
