name: Repair Per-Member Merge Gate

on:
  push:
    branches:
      - fix/live-signature-per-user-moderation-safe

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[merge gate repaired]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-signature-per-user-moderation-safe
          fetch-depth: 0
      - name: Repair gate after concurrent finalizer commits settle
        run: |
          sleep 20
          git pull --rebase origin fix/live-signature-per-user-moderation-safe
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/merge-validated-per-member-signatures.yml')
          if path.exists():
              text = path.read_text(encoding='utf-8')
              text = text.replace(
                  '          head_message=$(git log -1 --pretty=%B)\n'
                  '          if [ "$draft" != "false" ] || [[ "$head_message" != *"[per-member finalized]"* ]]; then\n',
                  '          validated=$(git log --all --fixed-strings --grep="[per-member finalized]" -1 --pretty=%H)\n'
                  '          if [ "$draft" != "false" ] || [ -z "$validated" ]; then\n',
              )
              path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/repair-per-member-merge-gate.yml
      - name: Commit repair
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Dank Shield CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Repair validation-aware merge gate [merge gate repaired]"
          git push origin HEAD:fix/live-signature-per-user-moderation-safe
