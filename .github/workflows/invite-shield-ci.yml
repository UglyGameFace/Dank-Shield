name: Invite Shield CI

on:
  pull_request:
    paths:
      - 'stoney_verify/invite_policy_engine.py'
      - 'stoney_verify/invite_policy_message_surface_runtime.py'
      - 'stoney_verify/invite_reconciliation_runtime.py'
      - 'stoney_verify/commands_ext/public_protection_invite_ui.py'
      - 'stoney_verify/startup_guards/invite_shield_sanitize_shared.py'
      - 'tests/test_invite_live_enforcement.py'
      - 'tests/test_invite_policy_message_surface_runtime.py'
      - 'tests/test_invite_runtime_reconcile_194.py'
      - 'tests/test_startup_recovery_scaling.py'
      - 'tools/audit_invite_link_safety.py'
      - '.github/workflows/invite-shield-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'stoney_verify/invite_policy_engine.py'
      - 'stoney_verify/invite_policy_message_surface_runtime.py'
      - 'stoney_verify/invite_reconciliation_runtime.py'
      - 'stoney_verify/commands_ext/public_protection_invite_ui.py'
      - 'stoney_verify/startup_guards/invite_shield_sanitize_shared.py'
      - 'tests/test_invite_live_enforcement.py'
      - 'tests/test_invite_policy_message_surface_runtime.py'
      - 'tests/test_invite_runtime_reconcile_194.py'
      - 'tests/test_startup_recovery_scaling.py'
      - 'tools/audit_invite_link_safety.py'

permissions:
  contents: read

jobs:
  invite-shield:
    name: Invite Shield focused regressions
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Diff whitespace
        run: git diff --check "$(git merge-base origin/main HEAD)"..HEAD

      - name: Compile Invite Shield owners
        run: |
          python -m py_compile             stoney_verify/invite_policy_engine.py             stoney_verify/invite_policy_message_surface_runtime.py             stoney_verify/invite_reconciliation_runtime.py             stoney_verify/commands_ext/public_protection_invite_ui.py             stoney_verify/startup_guards/invite_shield_sanitize_shared.py             tests/test_invite_live_enforcement.py             tests/test_invite_policy_message_surface_runtime.py             tests/test_invite_runtime_reconcile_194.py             tests/test_startup_recovery_scaling.py             tools/audit_invite_link_safety.py

      - name: Focused Invite Shield tests
        run: |
          python -m pytest -q --tb=short --disable-warnings             tests/test_invite_live_enforcement.py             tests/test_invite_policy_message_surface_runtime.py             tests/test_invite_runtime_reconcile_194.py             tests/test_startup_recovery_scaling.py

      - name: Invite link safety audit
        run: python tools/audit_invite_link_safety.py
