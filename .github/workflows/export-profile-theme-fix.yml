name: Export profile theme correction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize scoped correction
        shell: bash
        run: |
          set +e
          python tools/materialize_profile_theme_fix.py > materialize.log 2>&1
          status=$?
          set -e
          cat materialize.log
          printf '%s' "$status" > materialize.status

      - name: Upload materializer diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: profile-theme-materializer-log
          path: |
            materialize.log
            materialize.status
          if-no-files-found: error

      - name: Verify materialization
        run: test "$(cat materialize.status)" = "0"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Run focused validation
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
        run: |
          python -m py_compile stoney_verify/profile_signature_style.py stoney_verify/profile_signature_studio.py stoney_verify/profile_signature_renderer.py tests/test_profile_signature_theme_application.py
          python -m pytest tests/test_profile_signature_theme_application.py tests/test_compact_profile_signature_renderer.py -q --tb=short --disable-warnings
          git diff --check

      - name: Build exact file bundle
        shell: bash
        run: |
          mkdir -p profile-theme-patch/stoney_verify profile-theme-patch/tests
          cp ACTIVE_TASK.md profile-theme-patch/ACTIVE_TASK.md
          cp stoney_verify/profile_signature_style.py profile-theme-patch/stoney_verify/profile_signature_style.py
          cp stoney_verify/profile_signature_studio.py profile-theme-patch/stoney_verify/profile_signature_studio.py
          cp stoney_verify/profile_signature_renderer.py profile-theme-patch/stoney_verify/profile_signature_renderer.py
          cp tests/test_profile_signature_theme_application.py profile-theme-patch/tests/test_profile_signature_theme_application.py

      - uses: actions/upload-artifact@v4
        with:
          name: profile-theme-patch
          path: profile-theme-patch
          if-no-files-found: error
