name: Community Hub CI

on:
  pull_request:
    paths:
      - 'stoney_verify/community_hub_service.py'
      - 'stoney_verify/community_hub_runtime.py'
      - 'stoney_verify/commands_ext/public_community_hub.py'
      - 'stoney_verify/commands_ext/public_command_surface_v2.py'
      - 'stoney_verify/interaction_guard.py'
      - 'stoney_verify/globals.py'
      - 'stoney_verify/operation_queue.py'
      - 'stoney_verify/permission_repair_core.py'
      - 'supabase/migrations/20260925193000_community_hub.sql'
      - 'supabase/migrations/20260926044000_community_hub_matchmaking_loop.sql'
      - 'tests/test_community_hub_contract.py'
      - 'tests/test_interaction_guard.py'
      - 'tests/test_component_lifecycle_runtime_policy.py'
      - 'tools/test_community_hub_static.py'
      - '.github/workflows/community-hub-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'stoney_verify/community_hub_service.py'
      - 'stoney_verify/community_hub_runtime.py'
      - 'stoney_verify/commands_ext/public_community_hub.py'
      - 'stoney_verify/interaction_guard.py'
      - 'supabase/migrations/20260925193000_community_hub.sql'
      - 'supabase/migrations/20260926044000_community_hub_matchmaking_loop.sql'
      - 'tests/test_community_hub_contract.py'
      - 'tests/test_interaction_guard.py'
      - 'tests/test_component_lifecycle_runtime_policy.py'
      - 'tools/test_community_hub_static.py'

permissions:
  contents: read

jobs:
  community-hub-python:
    name: Community Hub Python + contract
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Diff whitespace
        run: git diff --check "$(git merge-base origin/main HEAD)"..HEAD

      - name: Compile Community Hub and integration owners
        run: |
          python -m py_compile             stoney_verify/community_hub_service.py             stoney_verify/community_hub_runtime.py             stoney_verify/commands_ext/public_community_hub.py             stoney_verify/commands_ext/public_command_surface_v2.py             stoney_verify/interaction_guard.py             stoney_verify/globals.py             stoney_verify/operation_queue.py             stoney_verify/permission_repair_core.py             tools/test_community_hub_static.py             tests/test_community_hub_contract.py             tests/test_interaction_guard.py             tests/test_component_lifecycle_runtime_policy.py

      - name: Focused Community Hub and interaction lifecycle tests
        run: |
          python -m pytest -q --tb=short --disable-warnings \
            tests/test_community_hub_contract.py \
            tests/test_interaction_guard.py \
            tests/test_component_lifecycle_runtime_policy.py

      - name: Standalone static audit
        run: python tools/test_community_hub_static.py

  community-hub-sql:
    name: Community Hub PostgreSQL smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Supabase-compatible roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
              if not exists (select 1 from pg_roles where rolname = 'anon') then create role anon; end if;
              if not exists (select 1 from pg_roles where rolname = 'authenticated') then create role authenticated; end if;
              if not exists (select 1 from pg_roles where rolname = 'service_role') then create role service_role; end if;
          end;
          $$;
          SQL

      - name: Apply Community Hub migrations twice
        run: |
          set -euo pipefail
          for pass in 1 2; do
            echo "Community Hub migration pass ${pass}"
            psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260925193000_community_hub.sql
            psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260926044000_community_hub_matchmaking_loop.sql
          done

      - name: Verify security and lifecycle invariants
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
              sid uuid;
              replay_id uuid;
              member_rows integer;
              ok boolean;
              metric_value integer;
          begin
              if has_table_privilege('anon', 'public.dank_community_sessions', 'SELECT') then
                  raise exception 'anon unexpectedly has Community Hub session SELECT';
              end if;
              if has_table_privilege('authenticated', 'public.dank_community_sessions', 'SELECT') then
                  raise exception 'authenticated unexpectedly has Community Hub session SELECT';
              end if;
              if not has_table_privilege('service_role', 'public.dank_community_sessions', 'SELECT') then
                  raise exception 'service_role missing Community Hub session SELECT';
              end if;

              perform public.community_hub_create_session(
                  'guild-1','host-1','idem-1','Minecraft','smoke session',
                  4,'optional','casual','public'
              );
              select id into sid
              from public.dank_community_sessions
              where guild_id='guild-1' and idempotency_key='idem-1';

              if sid is null then
                  raise exception 'create session did not persist';
              end if;

              perform public.community_hub_create_session(
                  'guild-1','host-1','idem-1','Minecraft','smoke session',
                  4,'optional','casual','public'
              );
              if (select count(*) from public.dank_community_sessions where guild_id='guild-1') <> 1 then
                  raise exception 'idempotent create duplicated session';
              end if;

              perform public.community_hub_transition_session(
                  sid,'guild-1','host-1','publish',false,null
              );

              perform public.community_hub_join_session(sid,'guild-1','member-2');
              perform public.community_hub_join_session(sid,'guild-1','member-2');
              select count(*) into member_rows
              from public.dank_community_session_members
              where session_id=sid and user_id='member-2';
              if member_rows <> 1 then
                  raise exception 'duplicate join duplicated membership';
              end if;

              perform public.community_hub_set_ready(sid,'guild-1','member-2',true);
              perform public.community_hub_transition_session(
                  sid,'guild-1','host-1','start',false,null
              );
              perform public.community_hub_transition_session(
                  sid,'guild-1','host-1','pause',false,null
              );
              perform public.community_hub_transition_session(
                  sid,'guild-1','host-1','resume',false,null
              );
              perform public.community_hub_transition_session(
                  sid,'guild-1','host-1','lock',false,null
              );

              begin
                  perform public.community_hub_join_session(sid,'guild-1','member-3');
                  raise exception 'locked session unexpectedly accepted a join';
              exception
                  when others then
                      if position('session is locked' in sqlerrm) = 0 then
                          raise;
                      end if;
              end;

              perform public.community_hub_transition_session(
                  sid,'guild-1','host-1','unlock',false,null
              );
              perform public.community_hub_assign_member_role(
                  sid,'guild-1','host-1','member-2','cohost',false
              );
              perform public.community_hub_transition_session(
                  sid,'guild-1','host-1','begin_end',false,'smoke complete'
              );
              perform public.community_hub_finalize_end_session(
                  sid,'guild-1','host-1','cleaned'
              );

              perform public.community_hub_restart_session(
                  sid,'guild-1','host-1','replay-1'
              );
              select id into replay_id
              from public.dank_community_sessions
              where guild_id='guild-1' and idempotency_key='replay-1';

              if replay_id is null or replay_id = sid then
                  raise exception 'Play Again did not create a fresh session';
              end if;
              if (select parent_session_id from public.dank_community_sessions where id=replay_id) <> sid then
                  raise exception 'Play Again did not link to its parent session';
              end if;

              perform public.community_hub_bump_metric(
                  'guild-1',now(),'joins',2,false
              );
              perform public.community_hub_bump_metric(
                  'guild-1',now(),'joins',3,false
              );
              select joins into metric_value
              from public.dank_community_metrics_hourly
              where guild_id='guild-1' and bucket_start=date_trunc('hour',now());
              if metric_value <> 5 then
                  raise exception 'atomic metric increment expected 5 got %', metric_value;
              end if;

              ok := public.community_hub_reserve_notification(
                  'guild-1','notify-user',now(),5,300
              );
              if not ok then
                  raise exception 'first notification reservation unexpectedly failed';
              end if;
              ok := public.community_hub_reserve_notification(
                  'guild-1','notify-user',now(),5,300
              );
              if ok then
                  raise exception 'notification cooldown did not block immediate duplicate';
              end if;

              insert into public.dank_community_partner_links(
                  guild_a_id,guild_b_id,state,requested_by_guild_id,requested_by_user_id
              ) values ('100','200','pending','100','host-1');

              begin
                  insert into public.dank_community_partner_links(
                      guild_a_id,guild_b_id,state,requested_by_guild_id,requested_by_user_id
                  ) values ('200','100','pending','200','host-1');
                  raise exception 'reverse partner pair unexpectedly inserted';
              exception
                  when check_violation then null;
                  when unique_violation then null;
              end;
          end;
          $$;
          SQL

      - name: Verify Quick Match opt-in formation
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $
          declare
              result jsonb;
              sid uuid;
              replay jsonb;
              normalized jsonb;
          begin
              -- Existing rows default to discoverable-only. They must not be
              -- silently eligible for automatic matching after this migration.
              insert into public.dank_community_availability(
                  guild_id,user_id,game_key,game_name,play_style,mic_preference,note,expires_at
              ) values (
                  'match-guild','candidate-1','minecraft','Minecraft','casual','optional','ready to play',now()+interval '2 hours'
              );

              if (select auto_match from public.dank_community_availability
                  where guild_id='match-guild' and user_id='candidate-1' and game_key='minecraft') then
                  raise exception 'legacy availability unexpectedly defaulted to auto-match on';
              end if;

              result := public.community_hub_quick_match(
                  'match-guild','requester-1','Minecraft','quick-1'
              );
              if result is not null then
                  raise exception 'Quick Match used an availability row without explicit auto-match consent';
              end if;

              update public.dank_community_availability
                 set auto_match=true
               where guild_id='match-guild' and user_id='candidate-1' and game_key='minecraft';

              result := public.community_hub_quick_match(
                  'match-guild','requester-1','Minecraft','quick-1'
              );
              if coalesce((result->>'created_match')::boolean,false) is not true then
                  raise exception 'Quick Match did not form a new opted-in match';
              end if;
              if result->>'match_user_id' <> 'candidate-1' then
                  raise exception 'Quick Match selected the wrong availability candidate';
              end if;

              sid := (result->'session'->>'id')::uuid;
              if sid is null then
                  raise exception 'formed Quick Match did not return a session id';
              end if;
              if not exists (
                  select 1 from public.dank_community_session_members
                  where session_id=sid and user_id='candidate-1' and left_at is null and role='member'
              ) then
                  raise exception 'formed Quick Match did not add the opted-in member';
              end if;
              if (select auto_match from public.dank_community_availability
                  where guild_id='match-guild' and user_id='candidate-1' and game_key='minecraft') then
                  raise exception 'formed Quick Match did not claim auto-match eligibility';
              end if;

              replay := public.community_hub_quick_match(
                  'match-guild','requester-1','Minecraft','quick-1'
              );
              if (replay->'session'->>'id')::uuid <> sid or coalesce((replay->>'replayed')::boolean,false) is not true then
                  raise exception 'Quick Match idempotency did not recover the existing formed session';
              end if;

              perform public.community_hub_transition_session(
                  sid,'match-guild','requester-1','publish',false,null
              );
              normalized := public.community_hub_normalize_formation(sid,'match-guild');
              if normalized->>'state' <> 'forming' then
                  raise exception 'pre-formed Quick Match session did not normalize to forming';
              end if;

              -- Existing open groups still win over availability-based formation.
              perform public.community_hub_create_session(
                  'existing-guild','host-existing','existing-1','Minecraft','existing',
                  4,'optional','casual','public'
              );
              select id into sid
              from public.dank_community_sessions
              where guild_id='existing-guild' and idempotency_key='existing-1';
              perform public.community_hub_transition_session(
                  sid,'existing-guild','host-existing','publish',false,null
              );
              insert into public.dank_community_availability(
                  guild_id,user_id,game_key,game_name,play_style,mic_preference,note,expires_at,auto_match
              ) values (
                  'existing-guild','candidate-existing','minecraft','Minecraft','casual','optional','',now()+interval '2 hours',true
              );
              result := public.community_hub_quick_match(
                  'existing-guild','requester-existing','Minecraft','quick-existing'
              );
              if coalesce((result->>'created_match')::boolean,false) is true then
                  raise exception 'Quick Match formed a new group instead of using an existing public group';
              end if;
              if (result->'session'->>'id')::uuid <> sid then
                  raise exception 'Quick Match did not join the expected existing group';
              end if;
              if not (select auto_match from public.dank_community_availability
                  where guild_id='existing-guild' and user_id='candidate-existing' and game_key='minecraft') then
                  raise exception 'existing-group Quick Match consumed unrelated availability';
              end if;

              -- Match Safety excludes otherwise eligible automatic candidates.
              insert into public.dank_community_availability(
                  guild_id,user_id,game_key,game_name,play_style,mic_preference,note,expires_at,auto_match
              ) values (
                  'blocked-guild','candidate-blocked','minecraft','Minecraft','casual','optional','',now()+interval '2 hours',true
              );
              perform public.community_hub_set_match_block(
                  'blocked-guild','requester-blocked','candidate-blocked',true
              );
              result := public.community_hub_quick_match(
                  'blocked-guild','requester-blocked','Minecraft','quick-blocked'
              );
              if result is not null then
                  raise exception 'Quick Match ignored Match Safety exclusion';
              end if;
          end;
          $;
          SQL

      - name: Verify no public function execution leaks
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
              if has_function_privilege(
                  'anon',
                  'public.community_hub_create_session(text,text,text,text,text,integer,text,text,text)',
                  'EXECUTE'
              ) then
                  raise exception 'anon unexpectedly has Community Hub create-session EXECUTE';
              end if;
              if has_function_privilege(
                  'authenticated',
                  'public.community_hub_create_session(text,text,text,text,text,integer,text,text,text)',
                  'EXECUTE'
              ) then
                  raise exception 'authenticated unexpectedly has Community Hub create-session EXECUTE';
              end if;
              if not has_function_privilege(
                  'service_role',
                  'public.community_hub_create_session(text,text,text,text,text,integer,text,text,text)',
                  'EXECUTE'
              ) then
                  raise exception 'service_role missing Community Hub create-session EXECUTE';
              end if;
              if has_function_privilege(
                  'anon',
                  'public.community_hub_quick_match(text,text,text,text)',
                  'EXECUTE'
              ) then
                  raise exception 'anon unexpectedly has Community Hub Quick Match EXECUTE';
              end if;
              if not has_function_privilege(
                  'service_role',
                  'public.community_hub_quick_match(text,text,text,text)',
                  'EXECUTE'
              ) then
                  raise exception 'service_role missing Community Hub Quick Match EXECUTE';
              end if;
          end;
          $$;
          SQL
