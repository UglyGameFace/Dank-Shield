name: Ticket Owner Emergency Override

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  owner-emergency-security:
    name: Owner emergency security
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Compile emergency override modules
        run: |
          python -m py_compile \
            stoney_verify/tickets_new/claim_policy.py \
            stoney_verify/tickets_new/owner_emergency_override.py \
            stoney_verify/startup_guards/owner_emergency_override_guard.py \
            stoney_verify/startup_guards/owner_emergency_close_bridge.py \
            stoney_verify/startup_guards/ticket_action_lock_guard.py

      - name: Run focused owner emergency regression suite
        run: |
          python -m pytest -q --tb=short --disable-warnings \
            tests/test_ticket_owner_emergency_override.py \
            tests/test_owner_emergency_override_guard.py \
            tests/test_owner_emergency_close_context.py \
            tests/test_ticket_claim_first_policy.py
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
