name: Verify ticket counter production

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-ticket-counter-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  verify:
    name: Prove production ticket counter is synchronized
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            test -n "${!name:-}" || { echo "::error::$name is not configured"; exit 1; }
          done

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        shell: bash
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Prove migration history contains the durable counter migration
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked | tee /tmp/migration-list.txt
          line="$(grep '20260731141000' /tmp/migration-list.txt || true)"
          occurrences="$(grep -o '20260731141000' <<<"$line" | wc -l | tr -d ' ')"
          if [ "$occurrences" -lt 2 ]; then
            echo "::error title=Ticket counter migration mismatch::Expected 20260731141000 on both local and remote sides."
            exit 1
          fi

      - name: Prove no migration remains pending
        shell: bash
        run: supabase db push --linked --dry-run

      - name: Dump public schema without row data
        shell: bash
        run: supabase db dump --linked --schema public --file /tmp/public-schema.sql

      - name: Prove hardened counter objects exist
        shell: bash
        run: |
          set -euo pipefail
          grep -Eqi 'CREATE TABLE .*"?ticket_counters"?[[:space:]]*\(' /tmp/public-schema.sql
          grep -Eqi 'FUNCTION .*"?reserve_ticket_number"?\(' /tmp/public-schema.sql
          grep -Fqi 'btrim(p_guild_id)' /tmp/public-schema.sql
          grep -Fqi 'last_ticket_number' /tmp/public-schema.sql
          echo "Production schema contains the durable normalized ticket counter RPC and table."

      - name: Expose successful read-only proof logs
        shell: bash
        run: |
          echo "::error title=Expected verification marker::Production migration history, dry run, and counter schema checks all succeeded. This deliberate final failure exposes the read-only proof logs."
          exit 1
