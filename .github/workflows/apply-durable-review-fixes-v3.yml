name: Apply Durable Review Fixes V3

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/dank-stats-invite-block-counting'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dank-stats-invite-block-counting
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest
      - name: Apply reliability fixes
        run: python tools/apply_durable_review_fixes_v2.py
      - name: Run focused compile and regressions
        run: |
          python -m compileall -q stoney_verify tests/test_durable_invite_stats.py
          python -m pytest -q \
            tests/test_durable_invite_stats.py \
            tests/test_security_stats_durable_invite_overlay.py \
            tests/test_durable_invite_stats_migration.py
      - name: Commit source fixes and remove temporary machinery
        run: |
          rm -f .github/workflows/apply-durable-review-fixes-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden invite stats recovery and async persistence"
          git push origin HEAD:fix/dank-stats-invite-block-counting
