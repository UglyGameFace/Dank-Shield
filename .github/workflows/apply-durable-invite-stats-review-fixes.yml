name: Apply Durable Invite Stats Review Fixes

on:
  push:
    branches:
      - fix/dank-stats-invite-block-counting
    paths:
      - tools/apply_durable_invite_stats_review_fixes.py
      - .github/workflows/apply-durable-invite-stats-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dank-stats-invite-block-counting
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact reliability fixes
        run: python tools/apply_durable_invite_stats_review_fixes.py
      - name: Run focused compile and tests
        run: |
          python -m compileall -q stoney_verify tests/test_durable_invite_stats.py
          python -m pytest -q \
            tests/test_durable_invite_stats.py \
            tests/test_security_stats_durable_invite_overlay.py \
            tests/test_durable_invite_stats_migration.py
      - name: Commit exact fixes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden invite stats recovery and async outbox persistence"
          git push origin HEAD:fix/dank-stats-invite-block-counting
