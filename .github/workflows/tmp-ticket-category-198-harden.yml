name: Temporary DS Ticket Category 198 Hardener

on:
  push:
    branches:
      - fix/ticket-category-preserved-selection-198
    paths:
      - tools/_tmp_harden_ticket_category_198.py
      - .github/workflows/tmp-ticket-category-198-harden.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/ticket-category-preserved-selection-198
          fetch-depth: 0

      - name: Apply hardening patch
        run: python tools/_tmp_harden_ticket_category_198.py

      - name: Remove temporary machinery
        run: |
          rm -f tools/_tmp_harden_ticket_category_198.py
          rm -f .github/workflows/tmp-ticket-category-198-harden.yml

      - name: Commit hardened validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: validate v4 ticket category recovery in postgres" || exit 0
          git push origin HEAD:fix/ticket-category-preserved-selection-198
