name: Dank Shield CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  export-profile-patch:
    name: Export exact profile patch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Generate exact source bundle
        shell: bash
        run: python tools/test_emit_profile_followup_patch.py > profile-patch-output.txt 2>&1 || true

      - name: Upload exact source bundle
        uses: actions/upload-artifact@v4
        with:
          name: profile-followup-patch
          path: profile-patch-output.txt
          if-no-files-found: error
