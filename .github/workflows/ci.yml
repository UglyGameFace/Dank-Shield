name: Dank Shield CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  python-compile:
    name: Python compile check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Check committed diff whitespace
        run: git diff --check "$(git merge-base origin/main HEAD)"..HEAD

      - name: Compile Python modules
        run: python -m compileall -q stoney_verify main.py tools

      - name: Run unit test suite
        run: python -m pytest tests/ -q --tb=short --disable-warnings
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet

      - name: Run standalone tool checks
        run: |
          status=0
          for f in tools/test_*.py; do
            echo "::group::$f"
            python "$f" || status=1
            echo "::endgroup::"
          done
          exit $status
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet

      - name: Audit public setup text and isolation
        run: python tools/audit_public_setup.py

      - name: Audit canonical public command surface
        run: python tools/audit_public_command_surface.py

      - name: Audit public command surface and startup friction
        run: python tools/audit_public_command_friction.py

      - name: Audit public invite permissions
        run: python tools/audit_public_invite_permissions.py

      - name: Audit setup safety rules
        run: python tools/audit_setup_safety.py

      - name: Audit Dank Design Smart Auto-Detect
        run: python tools/audit_dank_design_smart_auto_detect.py

      - name: Audit role truth ownership
        run: python tools/audit_role_truth.py

      - name: Audit event boundary ownership
        run: python tools/audit_event_boundary.py

  integrate-live-profile-owner:
    name: Integrate canonical profile privacy paths
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'feature/live-profile-cards' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DANK_STARTUP_LOG_STYLE: quiet
      DANK_COMMAND_LOG_STYLE: quiet

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/live-profile-cards
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt pytest

      - name: Apply native profile owner integration
        id: patch
        run: |
          set +e
          python tools/apply_live_profile_card_owner_integration.py > profile-owner-patch.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload exact patch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-owner-patch-log
          path: profile-owner-patch.log
          if-no-files-found: warn
          retention-days: 3

      - name: Fail when native patch fails
        if: steps.patch.outputs.exit_code != '0'
        run: |
          cat profile-owner-patch.log
          exit 1

      - name: Remove temporary patch script
        if: steps.patch.outputs.exit_code == '0'
        run: rm -f tools/apply_live_profile_card_owner_integration.py profile-owner-patch.log

      - name: Compile changed profile modules
        if: steps.patch.outputs.exit_code == '0'
        run: |
          python -m py_compile \
            stoney_verify/profile_card_service.py \
            stoney_verify/profile_card_runtime.py \
            stoney_verify/commands_ext/public_profile_cards.py \
            stoney_verify/commands_ext/public_self_roles_group.py \
            stoney_verify/commands.py

      - name: Run focused profile-card tests
        if: steps.patch.outputs.exit_code == '0'
        id: focused
        run: |
          set +e
          python -m pytest -q \
            tests/test_profile_card_service.py \
            tests/test_live_profile_card_runtime.py \
            tests/test_live_profile_card_integration_contract.py \
            tests/test_command_surface_uniqueness.py \
            > profile-owner-tests.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload focused profile test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-owner-tests-log
          path: profile-owner-tests.log
          if-no-files-found: warn
          retention-days: 3

      - name: Fail when focused tests fail
        if: steps.patch.outputs.exit_code == '0' && steps.focused.outputs.exit_code != '0'
        run: |
          cat profile-owner-tests.log
          exit 1

      - name: Inspect cleanup and whitespace
        if: steps.patch.outputs.exit_code == '0' && steps.focused.outputs.exit_code == '0'
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -f profile-owner-tests.log
          git diff --check
          test ! -f tools/apply_live_profile_card_owner_integration.py

      - name: Commit validated native integration
        if: steps.patch.outputs.exit_code == '0' && steps.focused.outputs.exit_code == '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate profile privacy into canonical profile views'
          git push origin HEAD:feature/live-profile-cards
