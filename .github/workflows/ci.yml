name: Dank Shield CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-compile:
    name: Python compile check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Check committed diff whitespace
        run: git diff --check "$(git merge-base origin/main HEAD)"..HEAD

      - name: Compile Python modules
        run: python -m compileall -q stoney_verify main.py tools

      - name: Run unit test suite
        id: unit_tests
        shell: bash
        run: |
          set +e
          python -m pytest tests/ -q --tb=short --disable-warnings > unit-tests.txt 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          tail -n 300 unit-tests.txt
          exit 0
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet

      - name: Upload unit test failure output
        if: steps.unit_tests.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-failure-output
          path: unit-tests.txt
          if-no-files-found: error
          retention-days: 1

      - name: Fail when unit tests failed
        if: steps.unit_tests.outputs.exit_code != '0'
        run: exit 1

      - name: Run standalone tool checks
        run: |
          status=0
          for f in tools/test_*.py; do
            echo "::group::$f"
            python "$f" || status=1
            echo "::endgroup::"
          done
          exit $status
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet

      - name: Audit public setup text and isolation
        run: python tools/audit_public_setup.py

      - name: Audit canonical public command surface
        run: python tools/audit_public_command_surface.py

      - name: Audit public command surface and startup friction
        run: python tools/audit_public_command_friction.py

      - name: Audit public invite permissions
        run: python tools/audit_public_invite_permissions.py

      - name: Audit setup safety rules
        run: python tools/audit_setup_safety.py

      - name: Audit Dank Design Smart Auto-Detect
        run: python tools/audit_dank_design_smart_auto_detect.py

      - name: Audit role truth ownership
        run: python tools/audit_role_truth.py

      - name: Audit event boundary ownership
        run: python tools/audit_event_boundary.py

  ticket-claim-security:
    name: Claim-first ticket security
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Compile claim-first security modules
        run: |
          python -m py_compile \
            stoney_verify/tickets_new/claim_policy.py \
            stoney_verify/tickets_new/claim_runtime_guard.py \
            stoney_verify/tickets_new/ticket_admin_claim_guard.py \
            stoney_verify/tickets_new/api_claim_runtime_guard.py \
            stoney_verify/tickets_new/command_queue_claim_guard.py \
            stoney_verify/tickets_new/explicit_system_action_guard.py \
            stoney_verify/commands_ext/public_staff_scope.py

      - name: Run focused claim-first regression suite
        run: |
          python -m pytest -q --tb=short --disable-warnings \
            tests/test_ticket_claim_first_policy.py \
            tests/test_ticket_staff_scope_runtime.py \
            tests/test_ticket_claim_runtime_guard.py \
            tests/test_ticket_admin_claim_guard.py \
            tests/test_ticket_api_claim_guard.py \
            tests/test_ticket_command_queue_claim_guard.py \
            tests/test_ticket_explicit_system_action_guard.py
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet

  managed-category-sql:
    name: Managed category SQL smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Audit Supabase migration versions
        shell: bash
        run: |
          python - <<'PY'
          import runpy

          namespace = runpy.run_path("tests/test_supabase_migration_versions.py")
          for name in (
              "test_migration_versions_are_unique",
              "test_new_migrations_use_supabase_cli_timestamp_format",
              "test_known_broken_short_versions_do_not_return",
          ):
              namespace[name]()
              print(f"PASS {name}")
          PY

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - name: Prepare Supabase-compatible roles and guild table
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
              if not exists (select 1 from pg_roles where rolname = 'anon') then create role anon; end if;
              if not exists (select 1 from pg_roles where rolname = 'authenticated') then create role authenticated; end if;
              if not exists (select 1 from pg_roles where rolname = 'service_role') then create role service_role; end if;
          end;
          $$;
          create table public.guild_configs (guild_id text primary key);
          insert into public.guild_configs(guild_id) values ('smoke-guild-1');
          SQL

      - name: Apply managed category migrations twice
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2; do
            echo "Applying managed category migrations, pass ${pass}"
            psql -v ON_ERROR_STOP=1 -f supabase/migrations/202607310001_managed_ticket_category_catalog.sql
            psql -v ON_ERROR_STOP=1 -f supabase/migrations/202607310002_managed_ticket_category_auto_sync.sql
          done

      - name: Verify catalog, trigger, duplicates, and custom preservation
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
              category_count integer;
          begin
              select count(*) into category_count
              from public.ticket_categories
              where guild_id = 'smoke-guild-1' and managed_by_dank = true;
              if category_count <> 15 then
                  raise exception 'expected 15 managed categories for smoke-guild-1, got %', category_count;
              end if;
          end;
          $$;

          insert into public.ticket_categories(
              guild_id, slug, name, description, intake_type, match_keywords,
              sort_order, is_default, is_enabled
          ) values (
              'smoke-guild-1', 'my-technical-art', 'My Technical Art',
              'Owner-created custom category containing a formerly dangerous substring.',
              'custom', '[]'::jsonb, 500, false, true
          );

          insert into public.ticket_categories(
              guild_id, slug, name, description, intake_type, match_keywords,
              sort_order, is_default, is_enabled
          ) values (
              'smoke-guild-1', 'bug-report', 'Bug Report',
              'Legacy alias duplicate.', 'bug', '[]'::jsonb, 501, false, true
          );

          select * from public.reconcile_dank_ticket_categories('smoke-guild-1');

          do $$
          begin
              if not exists (
                  select 1 from public.ticket_categories
                  where guild_id = 'smoke-guild-1'
                    and slug = 'my-technical-art'
                    and managed_by_dank = false
                    and managed_category_key is null
              ) then
                  raise exception 'custom substring category was modified or deleted';
              end if;

              if exists (
                  select 1 from public.ticket_categories
                  where guild_id = 'smoke-guild-1' and slug = 'bug-report'
              ) then
                  raise exception 'legacy managed alias duplicate was not removed';
              end if;
          end;
          $$;

          insert into public.guild_configs(guild_id) values ('smoke-guild-2');

          do $$
          declare
              category_count integer;
          begin
              select count(*) into category_count
              from public.ticket_categories
              where guild_id = 'smoke-guild-2' and managed_by_dank = true;
              if category_count <> 15 then
                  raise exception 'new-guild trigger expected 15 managed categories, got %', category_count;
              end if;
          end;
          $$;
          SQL
