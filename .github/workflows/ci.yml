name: Dank Shield CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  python-compile:
    name: Python compile check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Check committed diff whitespace
        run: git diff --check "$(git merge-base origin/main HEAD)"..HEAD

      - name: Audit repository path portability
        run: python tools/audit_repository_path_portability.py

      - name: Compile Python modules
        run: python -m compileall -q stoney_verify main.py tools

      - name: Run unit test suite
        run: python -m pytest tests/ -q --tb=short --disable-warnings
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet

      - name: Run standalone tool checks
        id: standalone
        run: |
          set +e
          : > standalone-tools.log
          status=0
          for f in tools/test_*.py; do
            {
              echo "===== $f ====="
              python "$f"
              code=$?
              echo "exit_code=$code"
              echo
            } >> standalone-tools.log 2>&1
            if [ "$code" -ne 0 ]; then
              status=1
            fi
          done
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet

      - name: Upload standalone tool log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-tools-log
          path: standalone-tools.log
          if-no-files-found: error
          retention-days: 3

      - name: Fail when a standalone tool fails
        if: steps.standalone.outputs.exit_code != '0'
        run: |
          cat standalone-tools.log
          exit 1

      - name: Audit public setup text and isolation
        run: python tools/audit_public_setup.py

      - name: Audit canonical public command surface
        run: python tools/audit_public_command_surface.py

      - name: Audit public command surface and startup friction
        run: python tools/audit_public_command_friction.py

      - name: Audit public invite permissions
        run: python tools/audit_public_invite_permissions.py

      - name: Audit setup safety rules
        run: python tools/audit_setup_safety.py

      - name: Audit Dank Design Smart Auto-Detect
        run: python tools/audit_dank_design_smart_auto_detect.py

      - name: Audit role truth ownership
        run: python tools/audit_role_truth.py

      - name: Audit event boundary ownership
        run: python tools/audit_event_boundary.py

  integrate-profile-setup-ux:
    name: Integrate profile setup picker
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/live-profile-cards' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DANK_STARTUP_LOG_STYLE: quiet
      DANK_COMMAND_LOG_STYLE: quiet

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/live-profile-cards
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Apply setup and command separation patch
        id: patch
        run: |
          set +e
          python tools/apply_profile_card_setup_ux.py > profile-setup-patch.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload profile setup patch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-setup-patch-log
          path: profile-setup-patch.log
          if-no-files-found: error
          retention-days: 3

      - name: Fail when profile setup patch fails
        if: steps.patch.outputs.exit_code != '0'
        run: |
          cat profile-setup-patch.log
          exit 1

      - name: Remove temporary patch script
        if: steps.patch.outputs.exit_code == '0'
        run: rm -f tools/apply_profile_card_setup_ux.py profile-setup-patch.log

      - name: Compile changed runtime and setup modules
        if: steps.patch.outputs.exit_code == '0'
        run: |
          python -m py_compile \
            stoney_verify/profile_card_setup_ui.py \
            stoney_verify/commands_ext/public_profile_cards.py \
            stoney_verify/commands_ext/public_setup_recommend.py \
            stoney_verify/commands_ext/public_welcome_group.py \
            stoney_verify/welcome_event_services.py

      - name: Run focused profile setup and separation tests
        if: steps.patch.outputs.exit_code == '0'
        run: |
          python -m pytest -q \
            tests/test_profile_card_setup_picker_ux.py \
            tests/test_live_profile_card_integration_contract.py \
            tests/test_live_profile_card_runtime.py \
            tests/test_live_profile_card_lifecycle.py \
            tests/test_live_profile_card_final_safety.py \
            tests/test_profile_card_service.py
          python tools/test_profile_builder_edit_static.py

      - name: Run full unit test suite
        if: steps.patch.outputs.exit_code == '0'
        run: python -m pytest tests/ -q --tb=short --disable-warnings

      - name: Run every standalone tool check
        if: steps.patch.outputs.exit_code == '0'
        run: |
          status=0
          for f in tools/test_*.py; do
            echo "===== $f ====="
            python "$f" || status=1
          done
          exit $status

      - name: Run production audits
        if: steps.patch.outputs.exit_code == '0'
        run: |
          python tools/audit_repository_path_portability.py
          python tools/audit_public_setup.py
          python tools/audit_public_command_surface.py
          python tools/audit_public_command_friction.py
          python tools/audit_public_invite_permissions.py
          python tools/audit_setup_safety.py
          python tools/audit_dank_design_smart_auto_detect.py
          python tools/audit_role_truth.py
          python tools/audit_event_boundary.py

      - name: Inspect cleanup and whitespace
        if: steps.patch.outputs.exit_code == '0'
        run: |
          git diff --check
          test ! -f tools/apply_profile_card_setup_ux.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Commit and push validated UX fixes
        if: steps.patch.outputs.exit_code == '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate live profile cards into setup'
          git push origin HEAD:feature/live-profile-cards
