name: Fix PR142 State Write Regression

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-signature-per-member-ownership
          fetch-depth: 1
          show-progress: false

      - name: Correct the state-write regression fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_live_profile_card_runtime.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def test_failed_state_write_deletes_only_new_bot_owned_card")
          try:
              end = text.index("\ndef ", start + 1)
          except ValueError:
              end = len(text)
          section = text[start:end]
          old = """        await runtime._replace_card(
              FakeIncomingMessage(2, guild, channel, member),
              parse_live_card_config(_config(channel.id)),
              trigger,
          )
          """
          new = """        await runtime._replace_card(
              FakeIncomingMessage(2, guild, channel, member),
              parse_live_card_config(_config(channel.id)),
              trigger,
              force_reposition=True,
          )
          """
          if section.count(old) != 1:
              raise SystemExit("expected one exact state-write fixture call")
          section = section.replace(old, new, 1)
          path.write_text(text[:start] + section + text[end:], encoding="utf-8")
          PY
          rm -f .github/workflows/fix-pr142-state-write-regression.yml
          python -m compileall -q tests/test_live_profile_card_runtime.py
          git diff --check

      - name: Commit clean regression correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix live signature state-write regression fixture"
          git push origin HEAD:fix/live-signature-per-member-ownership
