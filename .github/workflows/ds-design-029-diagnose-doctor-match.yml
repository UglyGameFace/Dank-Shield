name: DS-DESIGN-029 diagnose doctor matcher
on:
  push:
    branches: [fix/dank-design-editor-state-authority]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show duplicate matcher contexts
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('stoney_verify/commands_ext/public_design_studio.py').read_text()
          needle = 'counts = _lock_count(options) if "_lock_count" in globals() else {"global": 0, "categories": 0, "channels": 0}'
          starts=[]
          pos=0
          while True:
              i=text.find(needle,pos)
              if i<0: break
              starts.append(i); pos=i+1
          print('COUNT', len(starts))
          for n,i in enumerate(starts,1):
              print(f'--- MATCH {n} ---')
              print(text[max(0,i-350):i+len(needle)+350])
          PY