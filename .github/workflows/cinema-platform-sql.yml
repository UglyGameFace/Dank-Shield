name: Dank Cinema SQL

on:
  pull_request:
    paths:
      - "supabase/migrations/20261004123000_dank_cinema_library.sql"
      - "supabase/migrations/20261006031500_dank_cinema_feed_personalization.sql"
      - "supabase/migrations/20261006050000_dank_cinema_library_intelligence.sql"
      - "supabase/migrations/20261006051500_dank_cinema_standalone_playback.sql"
      - "stoney_verify/cinema_library_intelligence.py"
      - "stoney_verify/cinema_library_service.py"
      - "stoney_verify/cinema_storage.py"
      - "stoney_verify/cinema_site.py"
      - "stoney_verify/movie_night_web.py"
      - "tests/test_cinema_full_platform.py"
      - ".github/workflows/cinema-platform-sql.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/20261004123000_dank_cinema_library.sql"
      - "supabase/migrations/20261006031500_dank_cinema_feed_personalization.sql"
      - "supabase/migrations/20261006050000_dank_cinema_library_intelligence.sql"
      - "supabase/migrations/20261006051500_dank_cinema_standalone_playback.sql"
      - "stoney_verify/cinema_library_intelligence.py"
      - "stoney_verify/cinema_library_service.py"
      - "stoney_verify/cinema_storage.py"
      - "stoney_verify/cinema_site.py"
      - "stoney_verify/movie_night_web.py"
      - "tests/test_cinema_full_platform.py"
      - ".github/workflows/cinema-platform-sql.yml"

permissions:
  contents: read

jobs:
  cinema-library-schema:
    name: Cinema library migration smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dank_cinema
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dank_cinema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: dank_cinema
      BASE_MIGRATION: supabase/migrations/20261004123000_dank_cinema_library.sql
      FEED_MIGRATION: supabase/migrations/20261006031500_dank_cinema_feed_personalization.sql
      INTELLIGENCE_MIGRATION: supabase/migrations/20261006050000_dank_cinema_library_intelligence.sql
      STANDALONE_MIGRATION: supabase/migrations/20261006051500_dank_cinema_standalone_playback.sql

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - name: Prepare Supabase-compatible roles
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon;
          create role authenticated;
          create role service_role bypassrls;
          SQL

      - name: Apply Cinema migration twice
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2; do
            echo "Applying Dank Cinema migrations, pass ${pass}"
            psql -v ON_ERROR_STOP=1 -f "$BASE_MIGRATION"
            psql -v ON_ERROR_STOP=1 -f "$FEED_MIGRATION"
            psql -v ON_ERROR_STOP=1 -f "$INTELLIGENCE_MIGRATION"
            psql -v ON_ERROR_STOP=1 -f "$STANDALONE_MIGRATION"
          done

      - name: Verify Cinema schema and permissions
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $audit$
          declare
            required_table text;
          begin
            foreach required_table in array array[
              'dank_cinema_users',
              'dank_cinema_user_media',
              'dank_cinema_feed_discoveries',
              'dank_cinema_notifications',
              'dank_cinema_feed_rules',
              'dank_cinema_user_feed_discoveries',
              'dank_cinema_feed_source_health',
              'dank_cinema_watch_sessions',
              'dank_cinema_lists',
              'dank_cinema_list_items'
            ] loop
              if to_regclass('public.' || required_table) is null then
                raise exception 'missing Cinema table: %', required_table;
              end if;

              if not exists (
                select 1
                  from pg_class c
                  join pg_namespace n on n.oid = c.relnamespace
                 where n.nspname = 'public'
                   and c.relname = required_table
                   and c.relrowsecurity
              ) then
                raise exception 'RLS is not enabled for Cinema table: %', required_table;
              end if;

              if has_table_privilege('anon', 'public.' || required_table, 'SELECT')
                 or has_table_privilege('anon', 'public.' || required_table, 'INSERT')
                 or has_table_privilege('anon', 'public.' || required_table, 'UPDATE')
                 or has_table_privilege('anon', 'public.' || required_table, 'DELETE') then
                raise exception 'anon unexpectedly has Cinema table privileges: %', required_table;
              end if;

              if has_table_privilege('authenticated', 'public.' || required_table, 'SELECT')
                 or has_table_privilege('authenticated', 'public.' || required_table, 'INSERT')
                 or has_table_privilege('authenticated', 'public.' || required_table, 'UPDATE')
                 or has_table_privilege('authenticated', 'public.' || required_table, 'DELETE') then
                raise exception 'authenticated unexpectedly has Cinema table privileges: %', required_table;
              end if;

              if not has_table_privilege('service_role', 'public.' || required_table, 'SELECT')
                 or not has_table_privilege('service_role', 'public.' || required_table, 'INSERT')
                 or not has_table_privilege('service_role', 'public.' || required_table, 'UPDATE')
                 or not has_table_privilege('service_role', 'public.' || required_table, 'DELETE') then
                raise exception 'service_role is missing Cinema table privileges: %', required_table;
              end if;
            end loop;

            if not exists (
              select 1
                from information_schema.columns
               where table_schema = 'public'
                 and table_name = 'dank_cinema_user_media'
                 and column_name = 'favorite'
            ) or not exists (
              select 1
                from information_schema.columns
               where table_schema = 'public'
                 and table_name = 'dank_cinema_user_media'
                 and column_name = 'rating'
            ) or not exists (
              select 1
                from information_schema.columns
               where table_schema = 'public'
                 and table_name = 'dank_cinema_user_media'
                 and column_name = 'play_count'
            ) or not exists (
              select 1
                from information_schema.columns
               where table_schema = 'public'
                 and table_name = 'dank_cinema_user_media'
                 and column_name = 'first_watched_at'
            ) or not exists (
              select 1
                from information_schema.columns
               where table_schema = 'public'
                 and table_name = 'dank_cinema_user_media'
                 and column_name = 'last_completed_at'
            ) then
              raise exception 'Cinema Library intelligence columns are incomplete';
            end if;
          end;
          $audit$;
          SQL

      - name: Exercise Cinema row contracts
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          set role service_role;

          insert into public.dank_cinema_users(user_id, preferences)
          values (42, '{"autoplay_next":true,"playback_speed":1.25}'::jsonb);

          insert into public.dank_cinema_user_media(
            user_id, media_type, tmdb_id, season_number, episode_number,
            title, metadata, progress_seconds, duration_seconds, completed,
            last_watched_at
          ) values (
            42, 'episode', 9001, 3, 7,
            'Example Show S03E07',
            '{"series_id":77,"series_title":"Example Show"}'::jsonb,
            733, 2700, false, now()
          );

          insert into public.dank_cinema_feed_discoveries(
            guild_id, source_id, discovery_key, title, media_type, tmdb_id,
            metadata, playable
          ) values (
            100, 'feed-1', 'movie:123', 'Example Movie', 'movie', 123,
            '{"poster_url":"https://image.tmdb.org/example.jpg"}'::jsonb, true
          );

          insert into public.dank_cinema_notifications(
            user_id, guild_id, kind, title, body, dedupe_key
          ) values (
            42, 100, 'watch_party_invite', 'Cinema invite', 'Join the Theater.',
            'invite:room-1'
          );

          insert into public.dank_cinema_feed_rules(
            guild_id, owner_user_id, scope, rule_type, name, query,
            media_type, tmdb_id, filters, actions, created_by
          ) values (
            100, 42, 'user', 'follow', 'Example Show', 'Example Show',
            'tv', 77, '{"min_seeds":5}'::jsonb,
            '{"notify":"instant","queue_suggest":true}'::jsonb, 42
          );

          insert into public.dank_cinema_user_feed_discoveries(
            user_id, guild_id, source_id, discovery_key, title,
            media_type, tmdb_id, metadata, playable
          ) values (
            42, 100, 'private-1', 'episode:77:s03e08', 'Example Show',
            'tv', 77,
            '{"release_title":"Example.Show.S03E08.1080p.WEB.x265"}'::jsonb,
            true
          );

          insert into public.dank_cinema_feed_source_health(
            guild_id, source_id, refresh_count, success_count, total_results,
            last_result_count, last_refreshed_at, last_success_at
          ) values (
            100, 'feed-1', 4, 4, 28, 7, now(), now()
          );

          update public.dank_cinema_user_media
             set favorite = true,
                 favorite_at = now(),
                 rating = 9,
                 rated_at = now(),
                 play_count = 2,
                 first_watched_at = now() - interval '14 days',
                 last_completed_at = now()
           where user_id = 42
             and media_type = 'episode'
             and tmdb_id = 9001;

          insert into public.dank_cinema_watch_sessions(
            user_id, session_key, guild_id, room_id, session_mode,
            candidate_id, media_type, tmdb_id, series_id,
            season_number, episode_number, title, metadata,
            max_progress_seconds, duration_seconds, completed,
            started_at, last_seen_at, completed_at
          ) values (
            42, 'room-1:candidate-1', 100, 'room-1', 'watch_party',
            'candidate-1', 'episode', 9001, 77,
            3, 7, 'Example Show S03E07',
            '{"series_title":"Example Show"}'::jsonb,
            2700, 2700, true,
            now() - interval '45 minutes', now(), now()
          );

          insert into public.dank_cinema_watch_sessions(
            user_id, session_key, guild_id, room_id, session_mode,
            candidate_id, media_type, tmdb_id, title,
            max_progress_seconds, duration_seconds, completed
          ) values (
            42, 'site-room:movie-123', 100, 'site-room', 'standalone',
            'site-candidate', 'movie', 123, 'Example Movie',
            120, 7200, false
          );

          insert into public.dank_cinema_lists(
            id, user_id, name, description, position
          ) values (
            '11111111-1111-1111-1111-111111111111'::uuid,
            42, 'Movie Night', 'Stuff to watch together', 10
          );

          insert into public.dank_cinema_list_items(
            list_id, user_id, media_type, tmdb_id,
            season_number, episode_number, title, metadata, position
          ) values (
            '11111111-1111-1111-1111-111111111111'::uuid,
            42, 'movie', 123, 0, 0, 'Example Movie',
            '{"poster_url":"https://image.tmdb.org/example.jpg"}'::jsonb, 10
          );

          do $audit$
          begin
            if not exists (
              select 1 from public.dank_cinema_user_media
               where user_id = 42
                 and media_type = 'episode'
                 and tmdb_id = 9001
                 and season_number = 3
                 and episode_number = 7
                 and progress_seconds = 733
            ) then
              raise exception 'canonical episode progress row did not persist';
            end if;

            if not exists (
              select 1 from public.dank_cinema_notifications
               where user_id = 42 and dedupe_key = 'invite:room-1'
            ) then
              raise exception 'Cinema notification row did not persist';
            end if;

            if not exists (
              select 1 from public.dank_cinema_feed_rules
               where guild_id = 100
                 and owner_user_id = 42
                 and rule_type = 'follow'
                 and tmdb_id = 77
            ) then
              raise exception 'Cinema feed rule did not persist';
            end if;

            if not exists (
              select 1 from public.dank_cinema_user_feed_discoveries
               where user_id = 42
                 and guild_id = 100
                 and source_id = 'private-1'
            ) then
              raise exception 'private Cinema feed discovery did not persist';
            end if;

            if not exists (
              select 1 from public.dank_cinema_feed_source_health
               where guild_id = 100
                 and source_id = 'feed-1'
                 and success_count = 4
            ) then
              raise exception 'Cinema source health did not persist';
            end if;

            if not exists (
              select 1 from public.dank_cinema_user_media
               where user_id = 42
                 and media_type = 'episode'
                 and tmdb_id = 9001
                 and favorite = true
                 and rating = 9
                 and play_count = 2
            ) then
              raise exception 'Cinema Library intelligence state did not persist';
            end if;

            if not exists (
              select 1 from public.dank_cinema_watch_sessions
               where user_id = 42
                 and session_key = 'room-1:candidate-1'
                 and session_mode = 'watch_party'
                 and completed = true
            ) then
              raise exception 'Cinema watch session did not persist';
            end if;

            if not exists (
              select 1 from public.dank_cinema_watch_sessions
               where user_id = 42
                 and session_key = 'site-room:movie-123'
                 and session_mode = 'standalone'
                 and completed = false
            ) then
              raise exception 'Standalone Cinema watch session did not persist';
            end if;

            if not exists (
              select 1
                from public.dank_cinema_lists l
                join public.dank_cinema_list_items i on i.list_id = l.id
               where l.user_id = 42
                 and l.name = 'Movie Night'
                 and i.tmdb_id = 123
                 and i.position = 10
            ) then
              raise exception 'Cinema custom list contract did not persist';
            end if;
          end;
          $audit$;

          reset role;
          SQL

          if psql -v ON_ERROR_STOP=1 <<'SQL'
          set role service_role;
          insert into public.dank_cinema_user_media(
            user_id, media_type, tmdb_id, progress_seconds
          ) values (42, 'game', 123, 0);
          SQL
          then
            echo "invalid Cinema media_type unexpectedly passed its constraint" >&2
            exit 1
          fi

          if psql -v ON_ERROR_STOP=1 <<'SQL'
          set role service_role;
          insert into public.dank_cinema_user_media(
            user_id, media_type, tmdb_id, progress_seconds
          ) values (42, 'movie', 124, -1);
          SQL
          then
            echo "negative Cinema progress unexpectedly passed its constraint" >&2
            exit 1
          fi

          if psql -v ON_ERROR_STOP=1 <<'SQL'
          set role service_role;
          insert into public.dank_cinema_notifications(
            user_id, guild_id, kind, title, dedupe_key
          ) values (42, 100, 'watch_party_invite', 'Duplicate', 'invite:room-1');
          SQL
          then
            echo "duplicate Cinema notification dedupe key unexpectedly passed" >&2
            exit 1
          fi


          if psql -v ON_ERROR_STOP=1 <<'SQL'
          set role service_role;
          update public.dank_cinema_user_media
             set rating = 11
           where user_id = 42 and tmdb_id = 9001;
          SQL
          then
            echo "invalid Cinema personal rating unexpectedly passed" >&2
            exit 1
          fi

          if psql -v ON_ERROR_STOP=1 <<'SQL'
          set role service_role;
          insert into public.dank_cinema_watch_sessions(
            user_id, session_key, session_mode, media_type, tmdb_id
          ) values (42, 'bad-mode', 'public', 'movie', 123);
          SQL
          then
            echo "invalid Cinema watch session mode unexpectedly passed" >&2
            exit 1
          fi

      - name: Verify client roles cannot read Cinema tables
        shell: bash
        run: |
          set -euo pipefail
          for role in anon authenticated; do
            for table in               dank_cinema_users               dank_cinema_user_media               dank_cinema_feed_discoveries               dank_cinema_notifications               dank_cinema_feed_rules               dank_cinema_user_feed_discoveries               dank_cinema_feed_source_health               dank_cinema_watch_sessions               dank_cinema_lists               dank_cinema_list_items; do
              if psql -v ON_ERROR_STOP=1 <<SQL
          set role ${role};
          select * from public.${table} limit 1;
          SQL
              then
                echo "${role} unexpectedly read service-only Cinema data from ${table}" >&2
                exit 1
              fi
            done
          done
