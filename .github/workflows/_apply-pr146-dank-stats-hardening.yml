name: Apply PR146 Dank Stats Hardening

on:
  push:
    branches:
      - fix/member-reconciliation-async-generator
    paths:
      - tools/_apply_pr146_dank_stats_hardening.py
      - .github/workflows/_apply-pr146-dank-stats-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/member-reconciliation-async-generator
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Apply source changes
        run: python tools/_apply_pr146_dank_stats_hardening.py

      - name: Compile changed Python
        run: |
          python -m py_compile \
            stoney_verify/security_stats.py \
            stoney_verify/ticket_events.py \
            stoney_verify/members_new/membership_authority.py \
            tests/test_dank_stats_authority.py \
            tests/test_member_reconciliation_authority.py

      - name: Run focused regressions
        run: |
          pytest -q \
            tests/test_dank_stats_authority.py \
            tests/test_security_stats_channels.py \
            tests/test_ticket_stats_lifecycle_refresh_behavior.py \
            tests/test_member_reconciliation_authority.py

      - name: Remove one-shot materializer and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/_apply_pr146_dank_stats_hardening.py
          git rm .github/workflows/_apply-pr146-dank-stats-hardening.yml
          git add stoney_verify/security_stats.py stoney_verify/ticket_events.py tests/test_dank_stats_authority.py
          git commit -m "Harden Dank Stats authority and refresh paths"
          git push origin HEAD:fix/member-reconciliation-async-generator
