name: Ticket Panel Single Owner

on:
  pull_request:
    paths:
      - "stoney_verify/commands_ext/public_ticket_panel_clean.py"
      - "tests/test_public_ticket_panel_single_owner.py"
      - ".github/workflows/ticket-panel-owner.yml"
  push:
    branches:
      - main
    paths:
      - "stoney_verify/commands_ext/public_ticket_panel_clean.py"
      - "tests/test_public_ticket_panel_single_owner.py"
      - ".github/workflows/ticket-panel-owner.yml"

permissions:
  contents: read

jobs:
  single-owner:
    name: One menu per Discord interaction
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Compile canonical ticket panel owner
        run: |
          python -m py_compile \
            stoney_verify/commands_ext/public_ticket_panel_clean.py \
            tests/test_public_ticket_panel_single_owner.py

      - name: Run focused single-owner regressions
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
        run: python -m pytest tests/test_public_ticket_panel_single_owner.py -q --tb=short
