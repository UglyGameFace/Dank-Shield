name: Ticket Panel Single Owner

on:
  pull_request:
    paths:
      - "stoney_verify/commands.py"
      - "stoney_verify/ticket_panel_runtime.py"
      - "stoney_verify/commands_ext/public_ticket_panel_clean.py"
      - "stoney_verify/startup_guards/ticket_category_setup_guard.py"
      - "stoney_verify/startup_guards/ticket_category_schema_bootstrap_guard.py"
      - "stoney_verify/tickets_new/managed_category_service.py"
      - "supabase/migrations/20260910163000_preserve_ticket_category_selection_on_review.sql"
      - "tests/test_public_ticket_panel_single_owner.py"
      - "tests/test_ticket_panel_native_restart_runtime.py"
      - "tests/test_ticket_panel_guild_category_source.py"
      - "tests/test_ticket_category_setup_selection.py"
      - "tests/test_ticket_category_reset_preserves_selection.py"
      - "tests/test_restart_panel_single_owner_static.py"
      - ".github/workflows/ticket-panel-owner.yml"
  push:
    branches:
      - main
    paths:
      - "stoney_verify/commands.py"
      - "stoney_verify/ticket_panel_runtime.py"
      - "stoney_verify/commands_ext/public_ticket_panel_clean.py"
      - "stoney_verify/startup_guards/ticket_category_setup_guard.py"
      - "stoney_verify/startup_guards/ticket_category_schema_bootstrap_guard.py"
      - "stoney_verify/tickets_new/managed_category_service.py"
      - "supabase/migrations/20260910163000_preserve_ticket_category_selection_on_review.sql"
      - "tests/test_public_ticket_panel_single_owner.py"
      - "tests/test_ticket_panel_native_restart_runtime.py"
      - "tests/test_ticket_panel_guild_category_source.py"
      - "tests/test_ticket_category_setup_selection.py"
      - "tests/test_ticket_category_reset_preserves_selection.py"
      - "tests/test_restart_panel_single_owner_static.py"
      - ".github/workflows/ticket-panel-owner.yml"

permissions:
  contents: read

jobs:
  single-owner:
    name: One menu per Discord interaction
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Compile ticket panel runtime and category authority
        run: |
          python -m py_compile \
            stoney_verify/commands.py \
            stoney_verify/ticket_panel_runtime.py \
            stoney_verify/commands_ext/public_ticket_panel_clean.py \
            stoney_verify/startup_guards/ticket_category_setup_guard.py \
            stoney_verify/startup_guards/ticket_category_schema_bootstrap_guard.py \
            stoney_verify/tickets_new/managed_category_service.py \
            tests/test_public_ticket_panel_single_owner.py \
            tests/test_ticket_panel_native_restart_runtime.py \
            tests/test_ticket_panel_guild_category_source.py \
            tests/test_ticket_category_setup_selection.py \
            tests/test_ticket_category_reset_preserves_selection.py \
            tests/test_restart_panel_single_owner_static.py

      - name: Run focused ticket panel regressions
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
        run: |
          python -m pytest -q --tb=short \
            tests/test_public_ticket_panel_single_owner.py \
            tests/test_ticket_panel_native_restart_runtime.py \
            tests/test_ticket_panel_guild_category_source.py \
            tests/test_ticket_category_setup_selection.py \
            tests/test_ticket_category_reset_preserves_selection.py \
            tests/test_restart_panel_single_owner_static.py