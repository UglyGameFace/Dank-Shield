name: Temporary ticket confirm patch 196

on:
  push:
    branches:
      - fix/ticket-confirm-create-runtime-196

permissions:
  contents: write

jobs:
  patch-native-ticket-owner:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ticket-confirm-create-runtime-196
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python tools/zz_patch_ticket_confirm_196.py
      - name: Validate focused ticket runtime
        run: |
          git diff --check
          python -m compileall -q stoney_verify/commands_ext/public_ticket_panel_clean.py tests/test_ticket_confirm_create_runtime_196.py
          python -m pip install -q -r requirements.txt pytest
          PYTHONHASHSEED=0 python -m pytest -q --tb=short tests/test_ticket_confirm_create_runtime_196.py tests/test_public_ticket_panel_single_owner.py tests/test_ticket_panel_native_restart_runtime.py
      - name: Commit native fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stoney_verify/commands_ext/public_ticket_panel_clean.py
          git commit -m 'fix: acknowledge ticket confirm before slow creation'
          git push origin HEAD:fix/ticket-confirm-create-runtime-196
