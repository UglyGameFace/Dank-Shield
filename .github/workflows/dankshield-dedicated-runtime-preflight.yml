name: Dedicated Supabase Runtime Contract Preflight (manual read-only)

# No bot launch, Discord actions, source DB access, REST key, or Discloud writes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dankshield-dedicated-runtime-preflight
  cancel-in-progress: false

jobs:
  dedicated-runtime-contracts:
    if: ${{ github.repository == 'UglyGameFace/Dank-Shield' && github.ref == 'refs/heads/main' && github.actor == 'UglyGameFace' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout trusted main without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refuse changed main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Main changed; rerun contract preflight."
            exit 1
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install read-only PostgreSQL connector
        run: python -m pip install -q "psycopg[binary]>=3.2,<4"
      - name: Verify private candidate database and backend RPC contracts
        env:
          DANK_FRESH_DATABASE_URL: ${{ secrets.DANK_FRESH_DATABASE_URL }}
        run: python -m tools.preflight_dedicated_supabase_runtime
