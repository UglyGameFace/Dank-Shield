name: Materialize live profile runtime delivery

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize scoped correction
        run: python tools/materialize_live_profile_runtime_delivery.py

      - name: Make refreshed config lookup backward compatible
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('stoney_verify/profile_card_runtime_core.py')
          source = path.read_text(encoding='utf-8')
          old = '''        try:\n            config = parse_live_card_config(await get_guild_config(message.guild.id, refresh=True))\n        except Exception as exc:\n            print(\n                "⚠️ live_profile_card skipped "\n                f"guild={message.guild.id} channel={message.channel.id} user={message.author.id} "\n                f"reason=config_read_failed error={type(exc).__name__}: {exc}"\n            )\n            return\n'''
          new = '''        try:\n            try:\n                raw_config = await get_guild_config(message.guild.id, refresh=True)\n            except TypeError as exc:\n                if "refresh" not in str(exc):\n                    raise\n                raw_config = await get_guild_config(message.guild.id)\n            config = parse_live_card_config(raw_config)\n        except Exception as exc:\n            print(\n                "⚠️ live_profile_card skipped "\n                f"guild={message.guild.id} channel={message.channel.id} user={message.author.id} "\n                f"reason=config_read_failed error={type(exc).__name__}: {exc}"\n            )\n            return\n'''
          if source.count(old) != 1:
              raise SystemExit('generated refreshed config block not found exactly once')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Run focused validation
        shell: bash
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
        run: |
          set +e
          (
            python -m py_compile \
              stoney_verify/profile_card_runtime.py \
              stoney_verify/profile_card_runtime_core.py \
              tests/test_live_profile_runtime_delivery_regression.py \
              tests/test_live_profile_card_runtime.py &&
            python -m pytest \
              tests/test_live_profile_runtime_delivery_regression.py \
              tests/test_live_profile_card_runtime.py \
              tests/test_profile_platform_privacy_preview_ux.py \
              -q --tb=short --disable-warnings &&
            git diff --check
          ) > focused-validation.log 2>&1
          status=$?
          set -e
          cat focused-validation.log
          printf '%s' "$status" > focused-validation.status

      - name: Upload focused validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-profile-runtime-delivery-validation
          path: |
            focused-validation.log
            focused-validation.status
          if-no-files-found: error

      - name: Verify focused validation
        run: test "$(cat focused-validation.status)" = "0"

      - name: Record focused validation and clean helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ACTIVE_TASK.md')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              '**Status:** ROOT CAUSE CONFIRMED / IMPLEMENTATION VALIDATION REQUIRED',
              '**Status:** CLEAN IMPLEMENTATION / EXACT-HEAD CI REQUIRED',
          )
          for item in (
              'A real message author posts even when `guild.get_member()` returns `None`.',
              'Missing stored cards never suppress a replacement signature.',
              'Focused tests and changed-module compilation pass.',
          ):
              source = source.replace(f'- [ ] {item}', f'- [x] {item}')
          path.write_text(source, encoding='utf-8')
          PY
          git rm .github/workflows/materialize-live-profile-runtime-delivery.yml
          git rm tools/materialize_live_profile_runtime_delivery.py

      - name: Commit verified clean implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ACTIVE_TASK.md \
            stoney_verify/profile_card_runtime.py \
            stoney_verify/profile_card_runtime_core.py \
            tests/test_live_profile_runtime_delivery_regression.py
          git commit -m 'Restore live profile signature delivery'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
