name: Discloud existing-app code update (manual, guarded)

# Dispatch is always manual. Reuse is permitted only through guarded callers:
# quick manual owner authorization, or verified-recovery auto CI release.
# All callers hit the same exact-source and data-recovery gates below.
# This updates the EXISTING app ID; it never creates/deletes apps.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "preflight only, or explicitly deploy existing app"
        type: choice
        options:
          - preflight
          - deploy_existing_app
        default: preflight
        required: true
      expected_main_sha:
        description: "Exact 40-character main commit SHA already accepted in CI"
        type: string
        required: true
      off_host_backup_receipt:
        description: "Private reference to off-Discloud backup; not a restore receipt (no secrets)"
        type: string
        required: false
      recovery_policy:
        description: "Verified recovery OR explicit owner acceptance of possible data loss"
        type: choice
        options:
          - verified_recovery
          - owner_accepts_unverified_recovery
        default: verified_recovery
        required: true
      owner_risk_acknowledgement:
        description: "Risk path only: type I_ACCEPT_STONEYVERIFY_DATA_LOSS"
        type: string
        required: false
      database_rpc_verified:
        description: "Verified required member activity batch RPCs on the REAL production Supabase DB"
        type: boolean
        default: false
        required: true
      app_files_persistence_verified:
        description: "Verified Discloud code commit cannot destroy unrecoverable app files"
        type: boolean
        default: false
        required: true
      env_recovery_verified:
        description: "Production .env is backed up securely and recovery-tested"
        type: boolean
        default: false
        required: true

  # Reuse the exact same production deployment guards from both the
  # two-field quick-release workflow and the fail-closed verified-recovery
  # automation. This is not a second deployer.
  workflow_call:
    inputs:
      operation:
        type: string
        required: true
      expected_main_sha:
        type: string
        required: true
      off_host_backup_receipt:
        type: string
        required: false
      recovery_policy:
        type: string
        required: true
      owner_risk_acknowledgement:
        type: string
        required: false
      database_rpc_verified:
        type: boolean
        required: true
      app_files_persistence_verified:
        type: boolean
        required: true
      env_recovery_verified:
        type: boolean
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: discloud-existing-stoneyverify-production-commit
  cancel-in-progress: false

jobs:
  prepare:
    name: Exact-source and safety preflight (no Discloud writes)
    runs-on: ubuntu-latest
    outputs:
      approved_sha: ${{ steps.guard.outputs.approved_sha }}
    steps:
      - name: Checkout only selected ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reject wrong ref, branch drift or unsafe archive
        id: guard
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.expected_main_sha }}
          OPERATION: ${{ inputs.operation }}
          RECOVERY_POLICY: ${{ inputs.recovery_policy }}
          OWNER_RISK_ACK: ${{ inputs.owner_risk_acknowledgement }}
          OFF_HOST_BACKUP_RECEIPT: ${{ inputs.off_host_backup_receipt }}
          RPC_VERIFIED: ${{ inputs.database_rpc_verified }}
          FILE_PERSISTENCE_VERIFIED: ${{ inputs.app_files_persistence_verified }}
          ENV_RECOVERY_VERIFIED: ${{ inputs.env_recovery_verified }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Only workflow_dispatch on main is permitted."; exit 1
          fi
          if [[ ! "${REQUESTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Provide the exact 40-character main commit SHA."; exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [[ "${actual}" != "${REQUESTED_SHA}" ]]; then
            echo "::error::Main advanced or the supplied SHA is wrong. Review new changes first."; exit 1
          fi
          [[ "$(grep -Ec '^ID=stoneyverify$' discloud.config)" == "1" ]] || {
            echo "::error::Unexpected Discloud app identity."; exit 1;
          }
          [[ "$(grep -Ec '^MAIN=main.py$' discloud.config)" == "1" ]] || {
            echo "::error::Unexpected Discloud entry point."; exit 1;
          }
          [[ -s main.py && -s requirements.txt ]] || {
            echo "::error::Required runtime entry point missing."; exit 1;
          }
          for unexpected in .env .env.production .env.local DISCORD_TOKEN.txt data; do
            if [[ -e "$unexpected" ]]; then
              echo "::error::Unsafe or mutable local artifact $unexpected found in checkout."; exit 1
            fi
          done
          [[ -f .discloudignore ]] || {
            echo "::error::.discloudignore must exist before packaging."; exit 1;
          }
          for ignored in .git .github .env .env.production .env.local data tests; do
            grep -Fxq "$ignored" .discloudignore || {
              echo "::error::Missing exact-name Discloud archive exclusion: $ignored"; exit 1;
            }
          done
          if git ls-files | grep -Eq '(^|/)(\.env|\.env\.production|\.env\.local)$'; then
            echo "::error::A confidential .env file is tracked in Git."; exit 1
          fi
          echo "approved_sha=$actual" >> "$GITHUB_OUTPUT"
          echo "Validated exact main=$actual, existing app=stoneyverify, no production write."
          if [[ "${OPERATION}" == "deploy_existing_app" ]]; then
            [[ "${RPC_VERIFIED}" == "true" ]] || {
              echo "::error::PR #540 production member-activity RPC verification is missing."; exit 1;
            }
            [[ "${#OFF_HOST_BACKUP_RECEIPT}" -ge 8 ]] || {
              echo "::error::Provide a nonsecret identifier for the backup actually stored off Discloud."; exit 1;
            }
            case "${RECOVERY_POLICY}" in
              verified_recovery)
                [[ "${FILE_PERSISTENCE_VERIFIED}" == "true" ]] || {
                  echo "::error::Verified recovery requires confirmed app-file persistence."; exit 1;
                }
                [[ "${ENV_RECOVERY_VERIFIED}" == "true" ]] || {
                  echo "::error::Verified recovery requires tested environment recovery."; exit 1;
                }
                ;;
              owner_accepts_unverified_recovery)
                [[ "${GITHUB_ACTOR}" == "UglyGameFace" ]] || {
                  echo "::error::Only the repository owner may accept unverified Discloud recovery risk."; exit 1;
                }
                [[ "${OWNER_RISK_ACK}" == "I_ACCEPT_STONEYVERIFY_DATA_LOSS" ]] || {
                  echo "::error::Owner risk acknowledgement must match the exact required phrase."; exit 1;
                }
                echo "::warning::OWNER-ACCEPTED RISK: Existing app files, sessions, Cinema downloads and dashboard environment may be lost or require manual restoration. This path does NOT verify backup integrity, recovery or Discloud file retention."
                ;;
              *)
                echo "::error::Unknown recovery policy."; exit 1;
                ;;
            esac
          fi

      - name: Confirm deployment manifest is source only
        shell: bash
        run: |
          set -euo pipefail
          # DeployAction uses a ZIP upload with its own glob expansion.
          # Discloud's retention semantics for host-only data are NOT proved
          # by a GitHub check. Always require separately restored backups.
          test -s discloud.config
          test -s stoney_verify/app.py
          test -s stoney_verify/share_router_public_server.py
          test -s stoney_verify/members_new/activity_tracker.py
          python tools/audit_cinema_discloud_package.py
          echo "Preflight only: NOT a Discloud backup or data-retention guarantee."

  deploy:
    name: Existing-app code COMMIT, never delete/upload
    if: ${{ inputs.operation == 'deploy_existing_app' }}
    needs: prepare
    runs-on: ubuntu-latest
    environment: discloud-production
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.approved_sha }}
          fetch-depth: 1
      - name: Revalidate exact approved SHA
        shell: bash
        env:
          APPROVED_SHA: ${{ needs.prepare.outputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(grep -Ec '^ID=stoneyverify$' discloud.config)" = "1"
      - name: Require current main and successful exact-SHA CI
        shell: bash
        env:
          APPROVED_SHA: ${{ needs.prepare.outputs.approved_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if [[ "$(git rev-parse origin/main)" != "$APPROVED_SHA" ]]; then
            echo "::error::main advanced since preflight; rerun with the new validated SHA."; exit 1
          fi
          runs="$(gh api --method GET -f branch=main -f event=push -f status=success -f head_sha="$APPROVED_SHA" -f per_page=100 "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs")"
          if ! jq -e --arg sha "$APPROVED_SHA" '
            .workflow_runs[]
            | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success")
          ' <<<"$runs" >/dev/null; then
            echo "::error::No successful canonical Dank Shield CI push run for current main SHA."; exit 1
          fi
      - name: Require Discloud deploy token
        shell: bash
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
        run: |
          if [[ -z "$DISCLOUD_TOKEN" ]]; then
            echo "::error::DISCLOUD_TOKEN repository/environment secret is not connected."; exit 1
          fi
      - name: Commit approved main code to EXISTING Discloud app
        # SHA-pinned official action, not moving @v1 tag.
        uses: discloud/deploy-action@fae7024653d941a19daa2b6f56d2ae208e008c54
        with:
          token: ${{ secrets.DISCLOUD_TOKEN }}
          app_id: stoneyverify
          # Never pass 'env', which overwrites the live .env file.
          # .discloudignore excludes secrets, user data, CI and tests.
          glob: "**"
      - name: Summarize submitted update
        env:
          APPROVED_SHA: ${{ needs.prepare.outputs.approved_sha }}
        shell: bash
        run: |
          echo "Existing app ID: stoneyverify" >> "$GITHUB_STEP_SUMMARY"
          echo "Submitted source SHA: $APPROVED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Recovery approval mode: ${{ inputs.recovery_policy }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Post-deployment Discloud health, database, files and rollback must be verified separately." >> "$GITHUB_STEP_SUMMARY"
