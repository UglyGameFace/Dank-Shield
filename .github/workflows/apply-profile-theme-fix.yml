name: Apply verified profile theme correction

on:
  push:
    branches:
      - fix/profile-theme-application

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-theme-application
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize verified correction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/materialize_profile_theme_fix.py')
          source = path.read_text(encoding='utf-8')
          old = r'''    """        content="## 🖼️ Signature Themes\nPick a look. Your preview updates after saving.",""",'''
          new = r'''    r"""        content="## 🖼️ Signature Themes\nPick a look. Your preview updates after saving.",""",'''
          replacement_old = r'''    """        content="## 🖼️ Signature Themes\nPick a complete look. Its colors, background, and artwork apply immediately; you can override individual parts afterward.",""",'''
          replacement_new = r'''    r"""        content="## 🖼️ Signature Themes\nPick a complete look. Its colors, background, and artwork apply immediately; you can override individual parts afterward.",""",'''
          if source.count(old) != 1 or source.count(replacement_old) != 1:
              raise SystemExit('theme guidance literals were not found exactly once')
          path.write_text(source.replace(old, new, 1).replace(replacement_old, replacement_new, 1), encoding='utf-8')
          PY
          python tools/materialize_profile_theme_fix.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Validate focused theme behavior
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
        run: |
          python -m py_compile stoney_verify/profile_signature_style.py stoney_verify/profile_signature_studio.py stoney_verify/profile_signature_renderer.py tests/test_profile_signature_theme_application.py
          python -m pytest tests/test_profile_signature_theme_application.py tests/test_compact_profile_signature_renderer.py -q --tb=short --disable-warnings
          git diff --check

      - name: Remove temporary materialization files
        run: |
          rm -f .github/workflows/apply-profile-theme-fix.yml
          rm -f .github/workflows/export-profile-theme-fix.yml
          rm -f tools/materialize_profile_theme_fix.py

      - name: Commit clean implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make profile signature themes visibly apply [skip ci]"
          git push origin HEAD:fix/profile-theme-application
