name: Ticket Counter SQL

on:
  pull_request:
    paths:
      - "supabase/migrations/**ticket_counter**.sql"
      - ".github/workflows/ticket-counter-sql.yml"
      - "stoney_verify/startup_guards/auto_schema_bootstrap.py"
      - "stoney_verify/tickets_new/counter_allocator.py"
      - "tests/test_ticket_counter_migration.py"
      - "tools/test_persistent_ticket_counter_static.py"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**ticket_counter**.sql"
      - ".github/workflows/ticket-counter-sql.yml"
      - "stoney_verify/startup_guards/auto_schema_bootstrap.py"
      - "stoney_verify/tickets_new/counter_allocator.py"
      - "tests/test_ticket_counter_migration.py"
      - "tools/test_persistent_ticket_counter_static.py"

permissions:
  contents: read

jobs:
  ticket-counter-sql:
    name: Durable ticket number allocation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        # These names are the official postgres image contract, not Dank Shield
        # runtime configuration. Test commands use DANK_TEST_DATABASE_URL below.
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DANK_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - name: Run focused static counter guards
        shell: bash
        run: |
          python tools/test_persistent_ticket_counter_static.py
          python - <<'PY'
          import runpy

          namespace = runpy.run_path("tests/test_ticket_counter_migration.py")
          tests = sorted(
              (name, value)
              for name, value in namespace.items()
              if name.startswith("test_") and callable(value)
          )
          for name, test in tests:
              test()
              print(f"PASS {name}")
          PY

      - name: Prepare Supabase-compatible roles and ticket history
        shell: bash
        run: |
          psql "$DANK_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
              if not exists (select 1 from pg_roles where rolname = 'anon') then
                  create role anon;
              end if;
              if not exists (select 1 from pg_roles where rolname = 'authenticated') then
                  create role authenticated;
              end if;
              if not exists (select 1 from pg_roles where rolname = 'service_role') then
                  create role service_role bypassrls;
              end if;
          end;
          $$;

          create table public.tickets (
              id bigserial primary key,
              guild_id text not null,
              ticket_number integer
          );

          insert into public.tickets(guild_id, ticket_number) values
              ('legacy-guild', 1),
              ('legacy-guild', 218),
              ('other-guild', 3);
          SQL

      - name: Apply every ticket-counter migration twice in order
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migration_files < <(
            find supabase/migrations -maxdepth 1 -type f -name '*ticket_counter*.sql' -print | sort
          )
          if [ "${#migration_files[@]}" -eq 0 ]; then
            echo "::error::No ticket-counter migrations were found."
            exit 1
          fi
          for pass in 1 2; do
            echo "Applying complete ticket-counter migration chain, pass ${pass}"
            for migration_file in "${migration_files[@]}"; do
              echo "Applying ${migration_file}"
              psql "$DANK_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration_file"
            done
          done

      - name: Prove history backfill, normalization, and atomic reservation
        shell: bash
        run: |
          psql "$DANK_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
              first_number integer;
              second_number integer;
              fresh_number integer;
              spaced_first integer;
              spaced_second integer;
              spaced_rows integer;
              legacy_floor integer;
          begin
              select last_ticket_number into legacy_floor
              from public.ticket_counters
              where guild_id = 'legacy-guild';

              if legacy_floor <> 218 then
                  raise exception 'expected legacy floor 218, got %', legacy_floor;
              end if;

              select public.reserve_ticket_number('legacy-guild') into first_number;
              select public.reserve_ticket_number('legacy-guild') into second_number;
              select public.reserve_ticket_number('fresh-guild') into fresh_number;
              select public.reserve_ticket_number('  spaced-guild  ') into spaced_first;
              select public.reserve_ticket_number('spaced-guild') into spaced_second;

              select count(*) into spaced_rows
              from public.ticket_counters
              where guild_id in ('spaced-guild', '  spaced-guild  ');

              if first_number <> 219 then
                  raise exception 'expected first reserved number 219, got %', first_number;
              end if;
              if second_number <> 220 then
                  raise exception 'expected second reserved number 220, got %', second_number;
              end if;
              if fresh_number <> 1 then
                  raise exception 'expected fresh guild number 1, got %', fresh_number;
              end if;
              if spaced_first <> 1 or spaced_second <> 2 or spaced_rows <> 1 then
                  raise exception 'guild-id normalization failed: first %, second %, rows %', spaced_first, spaced_second, spaced_rows;
              end if;
          end;
          $$;
          SQL

      - name: Prove complete migration-chain reruns never lower counters
        shell: bash
        run: |
          psql "$DANK_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.tickets(guild_id, ticket_number)
          values ('legacy-guild', 100);
          SQL

          mapfile -t migration_files < <(
            find supabase/migrations -maxdepth 1 -type f -name '*ticket_counter*.sql' -print | sort
          )
          for migration_file in "${migration_files[@]}"; do
            psql "$DANK_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration_file"
          done

          psql "$DANK_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
              current_floor integer;
          begin
              select last_ticket_number into current_floor
              from public.ticket_counters
              where guild_id = 'legacy-guild';

              if current_floor <> 220 then
                  raise exception 'migration lowered or changed reserved floor; expected 220, got %', current_floor;
              end if;
          end;
          $$;
          SQL

      - name: Verify service-role-only access
        shell: bash
        run: |
          psql "$DANK_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
              if has_function_privilege('anon', 'public.reserve_ticket_number(text)', 'EXECUTE') then
                  raise exception 'anon unexpectedly has reserve_ticket_number execute access';
              end if;
              if has_function_privilege('authenticated', 'public.reserve_ticket_number(text)', 'EXECUTE') then
                  raise exception 'authenticated unexpectedly has reserve_ticket_number execute access';
              end if;
              if not has_function_privilege('service_role', 'public.reserve_ticket_number(text)', 'EXECUTE') then
                  raise exception 'service_role is missing reserve_ticket_number execute access';
              end if;
              if not exists (
                  select 1 from pg_class
                  where oid = 'public.ticket_counters'::regclass
                    and relrowsecurity = true
              ) then
                  raise exception 'ticket_counters RLS is not enabled';
              end if;
          end;
          $$;
          SQL
