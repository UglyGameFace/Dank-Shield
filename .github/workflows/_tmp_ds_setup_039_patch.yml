name: Temporary DS-SETUP-039 patch

on:
  push:
    branches:
      - fix/setup-runtime-integrity-200

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Apply setup runtime integrity patch
        run: python tools/_tmp_ds_setup_039_patch.py

      - name: Compile runtime
        run: python -m compileall -q stoney_verify main.py tools tests

      - name: Run focused setup regressions
        run: |
          python -m pytest -q \
            tests/test_setup_runtime_integrity_200.py \
            tests/test_setup_compact_behavior.py \
            tests/test_setup_guided_test_behavior.py \
            tests/test_setup_native_home_ownership_behavior.py \
            tests/test_setup_nested_navigation_behavior.py \
            tests/test_setup_navigation_ux_overhaul_behavior.py \
            tests/test_setup_service_modes_native_no_patch.py \
            tests/test_setup_aio_navigation_behavior.py \
            tests/test_setup_first_screen_semantics.py \
            tests/test_setup_test_session_cache_behavior.py \
            tests/test_setup_advanced_options_behavior.py \
            tests/test_ticket_category_setup_selection.py \
            tests/test_ui_first_dank_command_surface.py

      - name: Run setup runtime integrity audit
        run: python tools/audit_setup_runtime_integrity.py

      - name: Run existing setup audits
        run: |
          set -e
          for f in tools/audit_setup_*.py; do
            [ -f "$f" ] || continue
            echo "== $f =="
            python "$f"
          done

      - name: Check diff whitespace
        run: git diff --check

      - name: Commit permanent repair
        run: |
          test ! -e tools/_tmp_ds_setup_039_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git diff --cached --check
          git commit -m 'DS-SETUP-039: stabilize setup runtime ownership and routing'
          git push origin HEAD:fix/setup-runtime-integrity-200
