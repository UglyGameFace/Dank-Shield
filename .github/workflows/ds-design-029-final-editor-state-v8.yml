name: DS-DESIGN-029 final editor authority gate v8

on:
  push:
    branches:
      - fix/dank-design-editor-state-authority

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply completed editor transformation and remaining contract repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          # v6 is the last broad transform that produced compiling source, 34/34
          # focused tests, and a green architecture ownership guard.
          v6 = Path('.github/workflows/ds-design-029-final-editor-state-v6.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = v6.index(marker) + len(marker)
          end = v6.index("\n          PY", start)
          code = dedent(v6[start:end])
          compile(code, '<v6-final-authority-transform>', 'exec')
          exec(code, {'__name__': '__main__'})

          path = Path('stoney_verify/commands_ext/public_design_studio.py')
          text = path.read_text(encoding='utf-8')

          # Keep the five-input modal batching contract explicit.
          button_start = text.index('class StyleChangeFixMissingEmojiButton')
          button_end = text.index('class StyleChangePreviewView', button_start)
          block = text[button_start:button_end]
          phrase = 'Discord modals support at most 5 text inputs'
          if phrase not in block:
              batch_line = '            batch = missing[:5]\n'
              if batch_line not in block:
                  raise SystemExit('missing-icon batch line missing')
              block = block.replace(
                  batch_line,
                  '            # Discord modals support at most 5 text inputs. The rebuilt preview\n'
                  '            # exposes this control again for the next unresolved batch.\n'
                  + batch_line,
                  1,
              )
          text = text[:button_start] + block + text[button_end:]

          # Decorate saved style rows with the frame they actually own.
          rows_start = text.index('def _lock_manager_rows(')
          rows_end = text.index('def _format_lock_manager_embed(', rows_start)
          rows_block = text[rows_start:rows_end]
          if 'row["category_frame_id"]' not in rows_block:
              return_line = '    return rows\n'
              if return_line not in rows_block:
                  raise SystemExit('lock manager return rows line missing')
              decoration = (
                  '    for row in rows:\n'
                  '        scope = _safe_str(row.get("scope"), "")\n'
                  '        target_key = _safe_str(row.get("target_id"), "0")\n'
                  '        if scope == "global":\n'
                  '            source_lock = global_lock\n'
                  '        elif scope == "category":\n'
                  '            source_lock = _mapping_dict(category_locks.get(target_key))\n'
                  '        elif scope == "channel":\n'
                  '            source_lock = _mapping_dict(channel_locks.get(target_key))\n'
                  '        else:\n'
                  '            continue\n'
                  '        row["category_frame_id"] = _safe_str(source_lock.get("category_frame_id"), "plain")\n'
              )
              rows_block = rows_block.replace(return_line, decoration + return_line, 1)
          text = text[:rows_start] + rows_block + text[rows_end:]

          # Restore full preset fidelity in Rules & Unlocks. Find the actual generated
          # style-row lines by semantics instead of matching cosmetic whitespace.
          embed_start = text.index('def _format_lock_manager_embed(')
          embed_end = text.index('async def _remove_format_lock(', embed_start)
          embed_block = text[embed_start:embed_end]
          lines = embed_block.splitlines(keepends=True)
          font_idx = next((i for i, line in enumerate(lines) if 'font = _safe_str(row.get("font"' in line), None)
          if font_idx is None:
              raise SystemExit('lock manager font row not found')
          append_idx = next((i for i in range(font_idx, min(len(lines), font_idx + 10)) if 'lines.append(f"**{index}.**' in lines[i]), None)
          if append_idx is None:
              raise SystemExit('lock manager style summary row not found')
          indent = lines[font_idx][: len(lines[font_idx]) - len(lines[font_idx].lstrip())]
          replacement = [
              indent + 'font = _safe_str(row.get("font"), "normal").replace("_", " ").title()\n',
              indent + 'frame = _safe_str(row.get("category_frame_id"), "plain").replace("_", " ").title()\n',
              indent + 'sep = _safe_str(row.get("separator_id"), "none").replace("_", " ").title()\n',
              indent + 'strength = _safe_int(row.get("strength"), 4)\n',
              indent + 'lines.append(f"**{index}.** {exists} **{scope.title()}** `{label}` · Font `{font}` · Frame `{frame}` · Separator `{sep}` · Strength `{strength}/5`")\n',
          ]
          lines[font_idx:append_idx + 1] = replacement
          embed_block = ''.join(lines)
          old_priority = 'Exact manual name → Channel override → Category rule → Global preset → Detected live style preview'
          if old_priority in embed_block:
              embed_block = embed_block.replace(
                  old_priority,
                  'Exact manual name → Protection policy → Channel override → Category rule → Global preset → Detected live style preview',
                  1,
              )
          elif 'Protection policy → Channel override → Category rule → Global preset' not in embed_block:
              raise SystemExit('lock-manager priority line missing')
          text = text[:embed_start] + embed_block + text[embed_end:]
          path.write_text(text, encoding='utf-8')

          # Strengthen the majority-preview static contract for immutable preview IDs.
          path = Path('tools/test_dank_design_safe_repair_cleanup_static.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert "DesignPreviewView(can_apply=live_apply_allowed)" in MAJORITY_GUARD\n'
          new = (
              '    assert "can_apply=live_apply_allowed" in MAJORITY_GUARD\n'
              '    assert "pending_created_at=created_at" in MAJORITY_GUARD\n'
              '    assert "_store_pending" in MAJORITY_GUARD\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'majority preview old assertion count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Keep generated regression files whitespace-clean.
          for name in (
              'tests/test_dank_design_editor_state_authority.py',
              'tests/test_server_design_strict_layout_guard.py',
          ):
              path = Path(name)
              path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Validate focused, architecture, and all standalone Dank Design paths
        shell: bash
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest
          python -m py_compile \
            stoney_verify/commands_ext/public_design_studio.py \
            stoney_verify/services/server_design_studio.py \
            stoney_verify/startup_guards/server_design_strict_layout_guard.py \
            stoney_verify/startup_guards/server_design_majority_layout_guard.py \
            tests/test_dank_design_editor_state_authority.py \
            tests/test_server_design_strict_layout_guard.py \
            tools/test_dank_design_safe_repair_cleanup_static.py
          python -m pytest -q --tb=short --disable-warnings \
            tests/test_dank_design_editor_state_authority.py \
            tests/test_server_design_strict_layout_guard.py \
            tests/test_server_design_category_aware_auto_detect.py \
            tests/test_public_design_exact_native_guard_patch_static.py
          python tools/test_design_layout_helpers_not_startup.py
          standalone_failed=0
          for f in tools/test_dank_design_*.py; do
            echo "=== $f ==="
            python "$f" || standalone_failed=1
          done
          git diff --check || standalone_failed=1
          exit "$standalone_failed"

      - name: Record validation and commit final source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ACTIVE_TASK.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('**Status:** ACTIVE — ROOT CAUSE CONFIRMED / IMPLEMENTING', '**Status:** ACTIVE — IMPLEMENTATION COMPLETE / FULL PR CI PENDING', 1)
          checks = {
              '- [ ] Stop runtime Gothic normalization from mutating saved owner-approved global/category/channel locks.': '- [x] Stop runtime Gothic normalization from mutating saved owner-approved global/category/channel locks.',
              '- [ ] Seed Channel Editor Custom Format from the selected channel\'s current live style; keep Server Style as an explicit opt-in reset/suggestion.': '- [x] Seed Channel Editor Custom Format from the selected channel\'s current live style; keep Server Style as an explicit opt-in reset/suggestion.',
              '- [ ] Treat manual exact-editor changes as exact user intent.': '- [x] Treat manual exact-editor changes as exact user intent.',
              '- [ ] Use the generic reviewed-plan Apply view for exact category/channel previews, not Style Change issue controls.': '- [x] Use the generic reviewed-plan Apply view for exact category/channel previews, not Style Change issue controls.',
              '- [ ] Bind Apply to the exact preview/session that produced it so one preview cannot hijack another.': '- [x] Bind Apply and Style Change issue controls to the exact preview/session that produced them; config mutations invalidate older previews.',
              '- [ ] Make strength 4 category-frame behavior match the UI contract.': '- [x] Make strength 4 category-frame behavior match the UI contract.',
              '- [ ] Add runtime/static regressions for each failure path above.': '- [x] Add runtime/static regressions for each failure path above, including Direct Rename, exact-name ownership, live-item locks, stale preview invalidation, separator replacement, missing-icon batching, and lock-manager preset fidelity.',
              '- [ ] Targeted Dank Design regression tests green.': '- [x] Targeted Dank Design regression tests green.',
              '- [ ] Existing category-aware/strict-layout/exact-editor tests green.': '- [x] Existing category-aware/strict-layout/exact-editor tests green.',
              '- [ ] Python compile/static coverage green.': '- [x] Python compile/static coverage green.',
          }
          for old, new in checks.items():
              text = text.replace(old, new)
          if '## Final editor-authority completion pass' not in text:
              text += '''\n## Final editor-authority completion pass\n\n- [x] Direct Rename executes inside the guarded interaction path and refreshes from Discord API when available.\n- [x] Direct Rename persists a literal exact-name rule and rolls Discord back if persistence fails when possible.\n- [x] Exact manual names outrank channel/category/global style rules until explicitly replaced or unlocked.\n- [x] Per-item Lock Rule captures the selected item\'s live style instead of copying the whole-server preset.\n- [x] Rules & Unlocks / Design Doctor can display, remove, and clean stale exact-name rules.\n- [x] Rules & Unlocks preserves full saved style detail: font, category frame, separator, and strength.\n- [x] Saved-setting mutations invalidate older reviewed previews.\n- [x] Style Change Apply and missing-icon controls carry the same immutable preview identity.\n- [x] Missing-icon repairs remain batched in groups of five and rebuild the preview for the next unresolved batch.\n- [x] Known existing separators are parsed separately from leading emoji and are replaced rather than stacked.\n- [x] Strict layout helper is activated only through the native public Design module ownership path.\n- [x] Focused tests and design architecture/standalone guards pass before this commit.\n- [ ] Full repository PR CI and auxiliary PR workflows green on this exact final head.\n- [ ] Final PR diff/review/temp-artifact inspection complete.\n'''
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/ds-design-029-final-editor-state.yml
          git rm .github/workflows/ds-design-029-diagnose-doctor-match.yml
          git rm .github/workflows/ds-design-029-final-editor-state-v2.yml
          git rm .github/workflows/ds-design-029-final-editor-state-v3.yml
          git rm .github/workflows/ds-design-029-final-editor-state-v4.yml
          git rm .github/workflows/ds-design-029-final-editor-state-v5.yml
          git rm .github/workflows/ds-design-029-final-editor-state-v6.yml
          git rm .github/workflows/ds-design-029-final-editor-state-v7.yml
          git rm .github/workflows/ds-design-029-final-editor-state-v8.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ACTIVE_TASK.md \
            stoney_verify/commands_ext/public_design_studio.py \
            stoney_verify/services/server_design_studio.py \
            stoney_verify/startup_guards/server_design_majority_layout_guard.py \
            tests/test_server_design_strict_layout_guard.py \
            tests/test_dank_design_editor_state_authority.py \
            tools/test_dank_design_safe_repair_cleanup_static.py
          git diff --cached --check
          git commit -m "DS-DESIGN-029: complete Dank Design editor authority"
          git push origin HEAD:fix/dank-design-editor-state-authority
