name: Export profile signature runtime editor correction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Correct distinct custom palette sample
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/materialize_profile_signature_runtime_editor_fix.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace('custom_primary="#5AFF2D",\n                custom_secondary="#AE4BFF",', 'custom_primary="#FF5A36",\n                custom_secondary="#22DCFF",')
          path.write_text(source, encoding='utf-8')
          PY

      - name: Materialize scoped correction
        run: python tools/materialize_profile_signature_runtime_editor_fix.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Run focused validation
        shell: bash
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
        run: |
          set +e
          {
            python -m py_compile \
              stoney_verify/profile_card_runtime.py \
              stoney_verify/profile_card_runtime_core.py \
              stoney_verify/profile_signature_renderer.py \
              stoney_verify/welcome_card_typography_engine.py \
              stoney_verify/commands_ext/public_profile_cards_core.py \
              stoney_verify/profile_card_setup_ui.py \
              stoney_verify/profile_card_setup_ui_core.py \
              tests/test_live_profile_card_runtime.py \
              tests/test_profile_signature_appearance_controls.py \
              tests/test_profile_signature_runtime_editor_static.py \
              tests/test_ui_private_followup_payloads.py
            compile_status=$?
            if [ "$compile_status" -ne 0 ]; then
              exit "$compile_status"
            fi
            python -m pytest \
              tests/test_live_profile_card_runtime.py \
              tests/test_compact_profile_signature_renderer.py \
              tests/test_profile_signature_theme_application.py \
              tests/test_profile_signature_appearance_controls.py \
              tests/test_profile_signature_runtime_editor_static.py \
              tests/test_ui_private_followup_payloads.py \
              -q --tb=short --disable-warnings
            test_status=$?
            if [ "$test_status" -ne 0 ]; then
              exit "$test_status"
            fi
            git diff --check
          } > focused-validation.log 2>&1
          status=$?
          set -e
          cat focused-validation.log
          printf '%s' "$status" > focused-validation.status

      - name: Upload focused validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-signature-focused-validation-log
          path: |
            focused-validation.log
            focused-validation.status
          if-no-files-found: error

      - name: Verify focused validation
        run: test "$(cat focused-validation.status)" = "0"

      - name: Build exact file bundle
        shell: bash
        run: |
          mkdir -p profile-signature-fix/stoney_verify/commands_ext profile-signature-fix/tests
          cp ACTIVE_TASK.md profile-signature-fix/ACTIVE_TASK.md
          cp stoney_verify/profile_card_runtime.py profile-signature-fix/stoney_verify/profile_card_runtime.py
          cp stoney_verify/profile_card_runtime_core.py profile-signature-fix/stoney_verify/profile_card_runtime_core.py
          cp stoney_verify/profile_signature_renderer.py profile-signature-fix/stoney_verify/profile_signature_renderer.py
          cp stoney_verify/welcome_card_typography_engine.py profile-signature-fix/stoney_verify/welcome_card_typography_engine.py
          cp stoney_verify/commands_ext/public_profile_cards_core.py profile-signature-fix/stoney_verify/commands_ext/public_profile_cards_core.py
          cp stoney_verify/profile_card_setup_ui.py profile-signature-fix/stoney_verify/profile_card_setup_ui.py
          cp stoney_verify/profile_card_setup_ui_core.py profile-signature-fix/stoney_verify/profile_card_setup_ui_core.py
          cp tests/test_live_profile_card_runtime.py profile-signature-fix/tests/test_live_profile_card_runtime.py
          cp tests/test_profile_signature_appearance_controls.py profile-signature-fix/tests/test_profile_signature_appearance_controls.py
          cp tests/test_profile_signature_runtime_editor_static.py profile-signature-fix/tests/test_profile_signature_runtime_editor_static.py
          cp tests/test_ui_private_followup_payloads.py profile-signature-fix/tests/test_ui_private_followup_payloads.py

      - uses: actions/upload-artifact@v4
        with:
          name: profile-signature-runtime-editor-fix
          path: profile-signature-fix
          if-no-files-found: error
