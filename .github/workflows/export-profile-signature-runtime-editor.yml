name: Export profile signature runtime editor correction

on:
  push:
    branches:
      - fix/profile-signature-runtime-editor
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-signature-runtime-editor
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Correct distinct custom palette sample
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/materialize_profile_signature_runtime_editor_fix.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace('custom_primary="#5AFF2D",\n                custom_secondary="#AE4BFF",', 'custom_primary="#FF5A36",\n                custom_secondary="#22DCFF",')
          path.write_text(source, encoding='utf-8')
          PY

      - name: Materialize scoped correction
        run: python tools/materialize_profile_signature_runtime_editor_fix.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Revalidate exact materialized files
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
        run: |
          python -m py_compile \
            stoney_verify/profile_card_runtime.py \
            stoney_verify/profile_card_runtime_core.py \
            stoney_verify/profile_signature_renderer.py \
            stoney_verify/welcome_card_typography_engine.py \
            stoney_verify/commands_ext/public_profile_cards_core.py \
            stoney_verify/profile_card_setup_ui.py \
            stoney_verify/profile_card_setup_ui_core.py \
            tests/test_live_profile_card_runtime.py \
            tests/test_profile_signature_appearance_controls.py \
            tests/test_profile_signature_runtime_editor_static.py \
            tests/test_ui_private_followup_payloads.py
          python -m pytest \
            tests/test_live_profile_card_runtime.py \
            tests/test_compact_profile_signature_renderer.py \
            tests/test_profile_signature_theme_application.py \
            tests/test_profile_signature_appearance_controls.py \
            tests/test_profile_signature_runtime_editor_static.py \
            tests/test_ui_private_followup_payloads.py \
            -q --tb=short --disable-warnings
          git diff --check

      - name: Commit clean implementation
        shell: bash
        run: |
          rm -f .github/workflows/export-profile-signature-runtime-editor.yml
          rm -f tools/materialize_profile_signature_runtime_editor_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            ACTIVE_TASK.md \
            stoney_verify/profile_card_runtime.py \
            stoney_verify/profile_card_runtime_core.py \
            stoney_verify/profile_signature_renderer.py \
            stoney_verify/welcome_card_typography_engine.py \
            stoney_verify/commands_ext/public_profile_cards_core.py \
            stoney_verify/profile_card_setup_ui.py \
            stoney_verify/profile_card_setup_ui_core.py \
            tests/test_live_profile_card_runtime.py \
            tests/test_profile_signature_appearance_controls.py \
            tests/test_profile_signature_runtime_editor_static.py \
            tests/test_ui_private_followup_payloads.py \
            .github/workflows/export-profile-signature-runtime-editor.yml \
            tools/materialize_profile_signature_runtime_editor_fix.py
          git diff --cached --check
          git commit -m "Restore live profile signatures and editor effects"
          git push origin HEAD:fix/profile-signature-runtime-editor

  export:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Correct distinct custom palette sample
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/materialize_profile_signature_runtime_editor_fix.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace('custom_primary="#5AFF2D",\n                custom_secondary="#AE4BFF",', 'custom_primary="#FF5A36",\n                custom_secondary="#22DCFF",')
          path.write_text(source, encoding='utf-8')
          PY

      - name: Materialize scoped correction
        run: python tools/materialize_profile_signature_runtime_editor_fix.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Run focused validation
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
        run: |
          python -m py_compile \
            stoney_verify/profile_card_runtime.py \
            stoney_verify/profile_card_runtime_core.py \
            stoney_verify/profile_signature_renderer.py \
            stoney_verify/welcome_card_typography_engine.py \
            stoney_verify/commands_ext/public_profile_cards_core.py \
            stoney_verify/profile_card_setup_ui.py \
            stoney_verify/profile_card_setup_ui_core.py \
            tests/test_live_profile_card_runtime.py \
            tests/test_profile_signature_appearance_controls.py \
            tests/test_profile_signature_runtime_editor_static.py \
            tests/test_ui_private_followup_payloads.py
          python -m pytest \
            tests/test_live_profile_card_runtime.py \
            tests/test_compact_profile_signature_renderer.py \
            tests/test_profile_signature_theme_application.py \
            tests/test_profile_signature_appearance_controls.py \
            tests/test_profile_signature_runtime_editor_static.py \
            tests/test_ui_private_followup_payloads.py \
            -q --tb=short --disable-warnings
          git diff --check
