name: DS-DESIGN-030 Second Audit v4

on:
  push:
    branches:
      - fix/dank-design-consistency-locks

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Extract corrected second-audit payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/ds-design-030-second-audit.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          raw = source[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines()) + '\n'
          a = script.index('# Count only effective exact-protection records')
          b = script.index('# Make Rules / Locks explain', a)
          corrected = "# Count only effective exact-protection records, not corrupt raw keys.\nneedle = '    protection_items = _mapping_dict(options.get(\"protection_item_rules\"))\\n'\nsection = p.find('def _lock_count(options: Mapping[str, Any])')\npos = p.find(needle, section)\nsection_end = p.find('def _effective_format_options(', section)\nif section < 0 or pos < 0 or pos >= section_end:\n    raise SystemExit(f'effective protection count target invalid: section={section} pos={pos} end={section_end}')\np = p[:pos] + '    protection_items = _protection_item_rules(options) if \"_protection_item_rules\" in globals() else _mapping_dict(options.get(\"protection_item_rules\"))\\n' + p[pos + len(needle):]\n\n"
          script = script[:a] + corrected + script[b:]
          Path('/tmp/ds_design_030_second_audit.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/ds_design_030_second_audit.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Validate second-pass repairs
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
        run: |
          python -m compileall -q stoney_verify tests/test_dank_design_consistency_030.py
          python -m pytest tests/test_dank_design_consistency_030.py tests/test_dank_design_editor_state_authority.py tests/test_server_design_strict_layout_guard.py tests/test_server_design_category_aware_auto_detect.py tests/test_server_design_majority_layout.py tests/test_server_design_majority_repair_safety.py tests/test_server_design_style_zones.py tests/test_server_design_repair_confidence.py -q --tb=short
          python tools/test_dank_design_safe_repair_cleanup_static.py
          python tools/audit_dank_design_smart_auto_detect.py
          python tools/test_design_layout_helpers_not_startup.py
          git diff --check

      - name: Commit clean second-pass source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ds-design-030-second-audit.yml .github/workflows/ds-design-030-second-audit-v2.yml .github/workflows/ds-design-030-second-audit-v3.yml .github/workflows/ds-design-030-second-audit-v4.yml
          git add stoney_verify/commands_ext/public_design_studio.py stoney_verify/services/server_design_studio.py stoney_verify/startup_guards/server_design_majority_layout_guard.py tests/test_dank_design_consistency_030.py
          git commit -m "DS-DESIGN-030: close second-pass Dank Design inconsistencies"
          git push origin HEAD:fix/dank-design-consistency-locks
