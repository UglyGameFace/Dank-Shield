name: Aiven PostgreSQL 18 migration compatibility (isolated)

# Uses a disposable GitHub Actions postgres:18 service only. Never accesses Aiven,
# Supabase, Discloud, production bot runtime or their secrets.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aiven-pg18-isolated-compatibility.yml"
      - "postgres/migrations/**"
      - "stoney_verify/core_data_stage.py"
      - "stoney_verify/postgres_guild_config_repo.py"
      - "stoney_verify/postgres_guild_config_shadow.py"
      - "tests/test_aiven_pg18_compatibility.py"
      - "tests/test_aiven_pg18_workflow_static.py"

permissions:
  contents: read

concurrency:
  group: dankshield-aiven-pg18-isolated
  cancel-in-progress: false

jobs:
  pg18-contract:
    if: ${{ github.repository == 'UglyGameFace/Dank-Shield' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: disposable_test_only
      PGDATABASE: postgres
      DANK_TEST_DATABASE_URL: postgresql://postgres:disposable_test_only@127.0.0.1:5432/postgres
      RUN_AIVEN_PG18_ISOLATED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated test dependencies
        run: python -m pip install -q "pytest>=8,<10" "psycopg[binary]>=3.2,<4" "discord.py>=2.6,<3" "supabase>=2.24,<3" "python-dotenv>=1,<1.1"
      - name: Verify disposable PostgreSQL 18 service
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          version_num="$(psql -X -Atqc 'show server_version_num')"
          if [[ "$version_num" != 18* ]]; then
            echo "::error::Expected isolated PostgreSQL 18"
            exit 1
          fi
      - name: Apply three migration slices twice (disposable DB only)
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2; do
            psql -X -v ON_ERROR_STOP=1 -f postgres/migrations/202610130002_core_staging.sql
            psql -X -v ON_ERROR_STOP=1 -f postgres/migrations/202610130003_guild_config_shadow.sql
            psql -X -v ON_ERROR_STOP=1 -f postgres/migrations/202610130004_guild_config_atomic_state.sql
          done
      - name: Verify PostgreSQL 18 schema, staging, CAS and isolation
        run: |
          python -m pytest -q --tb=short \
            tests/test_aiven_pg18_compatibility.py \
            tests/test_aiven_pg18_workflow_static.py \
            tests/test_postgres_guild_config_repo.py \
            tests/test_core_data_stage.py
