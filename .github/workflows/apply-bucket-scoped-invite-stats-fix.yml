name: Apply Bucket Scoped Invite Stats Fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/dank-stats-live-recovery'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dank-stats-live-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest
      - name: Apply bucket-scoped source repair
        run: python tools/apply_bucket_scoped_invite_stats_fix.py
      - name: Run focused regressions
        run: |
          python -m compileall -q stoney_verify tests/test_durable_invite_stats.py
          python -m pytest -q \
            tests/test_durable_invite_stats.py \
            tests/test_security_stats_durable_invite_overlay.py \
            tests/test_durable_invite_stats_migration.py
      - name: Commit clean source repair
        run: |
          rm -f .github/workflows/apply-bucket-scoped-invite-stats-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Scope invite stats fallback writes to owning bucket"
          git push origin HEAD:fix/dank-stats-live-recovery
