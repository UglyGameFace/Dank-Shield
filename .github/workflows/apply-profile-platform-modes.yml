name: Apply Profile Platform Modes

on:
  push:
    branches:
      - fix/live-profile-channel-spam

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip platform patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-profile-channel-spam
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply focused source patch
        run: python tools/apply_profile_platform_modes_patch.py
      - name: Validate patched Python syntax
        run: |
          python -m py_compile \
            stoney_verify/profile_card_service.py \
            stoney_verify/profile_card_runtime_core.py \
            stoney_verify/profile_card_runtime.py \
            stoney_verify/profile_signature_studio.py \
            stoney_verify/commands_ext/public_profile_cards.py \
            tests/test_live_profile_card_visual_links.py \
            tests/test_profile_platform_display_modes.py
      - name: Commit generated patch
        shell: bash
        run: |
          if git diff --quiet && [[ -z "$(git status --porcelain --untracked-files=all)" ]]; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            stoney_verify/profile_card_service.py \
            stoney_verify/profile_card_runtime_core.py \
            stoney_verify/profile_card_runtime.py \
            stoney_verify/profile_signature_studio.py \
            stoney_verify/commands_ext/public_profile_cards.py \
            tests/test_live_profile_card_visual_links.py \
            tests/test_profile_platform_display_modes.py
          git commit -m 'Add profile platform display modes [skip platform patch]'
          git push origin HEAD:fix/live-profile-channel-spam
