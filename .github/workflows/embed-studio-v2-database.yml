name: Embed Studio v2 PostgreSQL Contract

on:
  pull_request:
    paths:
      - 'supabase_fresh/migrations/202610200028_dankshield_embed_studio_v2.sql'
      - 'supabase_fresh/migrations/202610200029_dankshield_embed_studio_assets.sql'
      - 'supabase_fresh/migrations/202610200030_dankshield_embed_studio_scheduling.sql'
      - 'supabase_fresh/migrations/202610200031_dankshield_embed_studio_reviews.sql'
      - 'supabase_fresh/migrations/202610200032_dankshield_embed_studio_forms.sql'
      - 'supabase_fresh/migrations/202610200033_dankshield_embed_studio_live_text.sql'
      - 'supabase_fresh/migrations/202610200034_dankshield_embed_studio_asset_budgets.sql'
      - 'stoney_verify/embed_studio_storage_v2.py'
      - 'tests/test_embed_studio_storage_v2.py'
      - '.github/workflows/embed-studio-v2-database.yml'

permissions:
  contents: read

jobs:
  postgres:
    name: Studio v2 transactional and RLS schema smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: testonly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: testonly
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Install migration twice, proving idempotent schema
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $roles$
          begin
              if not exists(select 1 from pg_roles where rolname='service_role') then
                  create role service_role;
              end if;
              if not exists(select 1 from pg_roles where rolname='anon') then
                  create role anon;
              end if;
              if not exists(select 1 from pg_roles where rolname='authenticated') then
                  create role authenticated;
              end if;
          end;
          $roles$;
          SQL
          psql -v ON_ERROR_STOP=1 -f supabase_fresh/migrations/202610200028_dankshield_embed_studio_v2.sql
          psql -v ON_ERROR_STOP=1 -f supabase_fresh/migrations/202610200028_dankshield_embed_studio_v2.sql
      - name: Check atomic CAS and individual item durability
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $checks$
          declare
              answer jsonb;
              blocks jsonb := '{"drafts":{},"templates":{},"themes":{},"media":{},"published":{}}';
              new_blocks jsonb := '{"drafts":{},"templates":{},"themes":{},"media":{"logo":{"name":"Logo","url":"https://example.com/a.png"}},"published":{}}';
          begin
              if (select count(*) from pg_class where relname in
                  ('dank_embed_studio_libraries','dank_embed_studio_items')
                  and relrowsecurity) <> 2 then
                  raise exception 'RLS not enabled on both Studio tables';
              end if;
              answer := public.dank_embed_studio_write('123',-1,blocks,'{}');
              if answer->>'applied' <> 'true' then raise exception 'initial seed refused'; end if;
              answer := public.dank_embed_studio_write('123',-1,blocks,'{}');
              if answer->>'applied' <> 'false' then raise exception 'repeated seed overwrote a library'; end if;
              answer := public.dank_embed_studio_write('123',1,new_blocks,'{}');
              if answer->>'applied' <> 'true' then raise exception 'CAS update refused'; end if;
              answer := public.dank_embed_studio_write('123',1,blocks,'{}');
              if answer->>'applied' <> 'false' then raise exception 'stale writer overwritten newer media'; end if;
              if (select count(*) from public.dank_embed_studio_items
                  where guild_id='123' and section='media' and item_id='logo') <> 1 then
                  raise exception 'media item missing';
              end if;
              answer := public.dank_embed_studio_write('123',2,blocks,'{}');
              if answer->>'applied' <> 'true' then raise exception 'delete failed'; end if;
              if exists(select 1 from public.dank_embed_studio_items where guild_id='123') then
                  raise exception 'obsolete item was retained';
              end if;
              if (select revision from public.dank_embed_studio_libraries where guild_id='123') <> 3 then
                  raise exception 'revision did not advance';
              end if;
          end;
          $checks$;
          SQL
      - name: Confirm anon cannot inspect rows or call writer
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $checks$
          declare
              public_read boolean;
              public_execute boolean;
          begin
              select has_table_privilege('anon','public.dank_embed_studio_items','select') into public_read;
              select has_function_privilege('anon','public.dank_embed_studio_write(text,bigint,jsonb,jsonb)','execute') into public_execute;
              if public_read or public_execute then
                  raise exception 'Studio storage is publicly accessible';
              end if;
              if not has_function_privilege('service_role',
                   'public.dank_embed_studio_write(text,bigint,jsonb,jsonb)','execute') then
                  raise exception 'Service role cannot invoke Studio RPC';
              end if;
          end;
          $checks$;
          SQL

      - name: Install and validate the Supabase Storage bucket migration
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists storage;
          create table if not exists storage.buckets(
              id text primary key, name text not null, public boolean not null default false,
              file_size_limit bigint, allowed_mime_types text[]
          );
          SQL
          psql -v ON_ERROR_STOP=1 -f supabase_fresh/migrations/202610200029_dankshield_embed_studio_assets.sql
          psql -v ON_ERROR_STOP=1 -f supabase_fresh/migrations/202610200029_dankshield_embed_studio_assets.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $verify$
          begin
              if not exists(select 1 from storage.buckets where id='dank-studio-artwork'
                  and public and file_size_limit=6291456) then
                  raise exception 'Studio upload bucket not installed';
              end if;
              if not (select relrowsecurity from pg_class
                       where oid='public.dank_embed_studio_assets'::regclass) then
                  raise exception 'Studio asset metadata RLS missing';
              end if;
              if has_table_privilege('anon','public.dank_embed_studio_assets','insert') then
                  raise exception 'Public may write Studio asset metadata';
              end if;
          end;
          $verify$;
          SQL

      - name: Verify durable schedules, claim-once semantics and permissions
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase_fresh/migrations/202610200030_dankshield_embed_studio_scheduling.sql
          psql -v ON_ERROR_STOP=1 -f supabase_fresh/migrations/202610200030_dankshield_embed_studio_scheduling.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $verify$
          declare
              first_claim integer;
              second_claim integer;
          begin
              insert into public.dank_embed_studio_scheduled_posts
                  (guild_id,channel_id,scheduled_by,project,execute_at)
                  values('123','456','789','{}',now()-interval '1 minute');
              -- Guild 123 belongs to shard 0 of two.
              select count(*) into second_claim from public.dank_embed_studio_claim_due(8,2,array[1]);
              if second_claim <> 0 then raise exception 'Foreign shard claimed Studio job'; end if;
              select count(*) into first_claim from public.dank_embed_studio_claim_due(8,2,array[0]);
              select count(*) into second_claim from public.dank_embed_studio_claim_due(8,2,array[0]);
              if first_claim <> 1 or second_claim <> 0 then
                  raise exception 'Studio scheduled job was not claimed exactly once';
              end if;
              if (select count(*) from public.dank_embed_studio_scheduled_posts
                  where status='claimed' and claimed_at is not null) <> 1 then
                  raise exception 'Studio claimed job is not durable';
              end if;
              if has_table_privilege('anon','public.dank_embed_studio_scheduled_posts','select') then
                  raise exception 'Studio scheduled payload exposed to public';
              end if;
              if not (select relrowsecurity from pg_class
                      where oid='public.dank_embed_studio_scheduled_posts'::regclass) then
                  raise exception 'Studio scheduled data has no RLS';
              end if;
          end;
          $verify$;
          SQL

      - name: Install staff review schema and verify two-person decision
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase_fresh/migrations/202610200031_dankshield_embed_studio_reviews.sql
          psql -v ON_ERROR_STOP=1 -f supabase_fresh/migrations/202610200031_dankshield_embed_studio_reviews.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $checks$
          declare
              review_id uuid;
              result_count integer;
          begin
              insert into public.dank_embed_studio_reviews
                  (guild_id,submitted_by,channel_id,title,project)
                  values ('12','34','56','Welcome','{}'::jsonb) returning id into review_id;
              select count(*) into result_count
                  from public.dank_embed_studio_review_decide(review_id,'12','34','approved');
              if result_count <> 0 then
                  raise exception 'Self-approval was allowed';
              end if;
              select count(*) into result_count
                  from public.dank_embed_studio_review_decide(review_id,'13','99','approved');
              if result_count <> 0 then
                  raise exception 'Cross-server approval was allowed';
              end if;
              select count(*) into result_count
                  from public.dank_embed_studio_review_decide(review_id,'12','99','approved');
              if result_count <> 1 then
                  raise exception 'Valid second moderator approval was refused';
              end if;
              select count(*) into result_count
                  from public.dank_embed_studio_review_decide(review_id,'12','88','rejected');
              if result_count <> 0 then
                  raise exception 'An approved review was rewritten';
              end if;
              if has_table_privilege('anon','public.dank_embed_studio_reviews','select') then
                  raise exception 'Private staff reviews exposed to public';
              end if;
          end;
          $checks$;
          SQL

      - name: Validate private form-response schema and idempotent retention
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase_fresh/migrations/202610200032_dankshield_embed_studio_forms.sql
          psql -v ON_ERROR_STOP=1 -f supabase_fresh/migrations/202610200032_dankshield_embed_studio_forms.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $tests$
          declare
              purged integer;
          begin
              insert into public.dank_embed_studio_form_responses
                  (guild_id,channel_id,message_id,user_id,window_slot,answers,created_at)
                  values('12','34','56','78',1,'[{"question":"Q","answer":"A"}]'::jsonb,
                         now()-interval '31 days');
              if has_table_privilege('anon','public.dank_embed_studio_form_responses','select') then
                  raise exception 'Form responses readable by anonymous clients';
              end if;
              if not (select relrowsecurity from pg_class
                       where oid='public.dank_embed_studio_form_responses'::regclass) then
                  raise exception 'RLS missing from private responses';
              end if;
              purged := public.dank_embed_studio_purge_form_responses(50);
              if purged <> 1 then
                  raise exception 'Stale form response retention did not work';
              end if;
              if exists(select 1 from public.dank_embed_studio_form_responses) then
                  raise exception 'Deleted response remains';
              end if;
          end;
          $tests$;
          SQL

      - name: Check live text RLS and owned-shard hourly claims
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase_fresh/migrations/202610200033_dankshield_embed_studio_live_text.sql
          psql -v ON_ERROR_STOP=1 -f supabase_fresh/migrations/202610200033_dankshield_embed_studio_live_text.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $tests$
          declare
              none_claimed integer;
              one_claimed integer;
              duplicate_claimed integer;
          begin
              insert into public.dank_embed_studio_live_posts (
                  guild_id,channel_id,message_id,created_by,nonce,project,
                  next_refresh_at
              ) values (
                  '123','234','345','456',repeat('a',32),'{}'::jsonb,
                  now()-interval '1 minute'
              );
              select count(*) into none_claimed
                from public.dank_embed_studio_claim_live(4,2,array[1]);
              select count(*) into one_claimed
                from public.dank_embed_studio_claim_live(4,2,array[0]);
              select count(*) into duplicate_claimed
                from public.dank_embed_studio_claim_live(4,2,array[0]);
              if none_claimed <> 0 or one_claimed <> 1 or duplicate_claimed <> 0 then
                  raise exception 'Shard-safe Studio Live Text claim failed';
              end if;
              if has_table_privilege('anon','public.dank_embed_studio_live_posts','select') then
                  raise exception 'Studio live post metadata exposed to anon';
              end if;
              if not (select relrowsecurity from pg_class
                       where oid='public.dank_embed_studio_live_posts'::regclass) then
                  raise exception 'Live Text RLS not enabled';
              end if;
          end;
          $tests$;
          SQL

      - name: Validate per-server and global artwork quota reservations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase_fresh/migrations/202610200034_dankshield_embed_studio_asset_budgets.sql
          psql -v ON_ERROR_STOP=1 -f supabase_fresh/migrations/202610200034_dankshield_embed_studio_asset_budgets.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $tests$
          declare
              path1 text := '123/'||repeat('a',32)||'.png';
              path2 text := '123/'||repeat('b',32)||'.png';
              path3 text := '456/'||repeat('c',32)||'.png';
              attempt jsonb;
              report jsonb;
              finalized jsonb;
          begin
              if not (select relrowsecurity from pg_class
                      where oid='public.dank_embed_studio_asset_holds'::regclass) then
                  raise exception 'Artwork hold RLS is missing';
              end if;
              if has_table_privilege('anon','public.dank_embed_studio_asset_holds','select')
                 or has_function_privilege('anon','public.dank_embed_studio_asset_reserve(text,text,bigint,bigint,bigint)','execute') then
                  raise exception 'Public may read or reserve artwork quota';
              end if;
              attempt:=public.dank_embed_studio_asset_reserve('123',path1,4194304,6291456,8388608);
              if attempt->>'reserved' <> 'true' then
                  raise exception 'Valid first artwork reservation was refused';
              end if;
              attempt:=public.dank_embed_studio_asset_reserve('123',path2,4194304,6291456,8388608);
              if attempt->>'reserved' <> 'false' then
                  raise exception 'Per-guild storage limit was bypassed';
              end if;
              attempt:=public.dank_embed_studio_asset_reserve('456',path3,4194304,6291456,8388608);
              if attempt->>'reserved' <> 'true' then
                  raise exception 'Valid second guild reservation was refused';
              end if;
              report:=public.dank_embed_studio_asset_usage('123');
              if (report->>'global_used')::bigint <> 8388608
                 or (report->>'guild_used')::bigint <> 4194304
                 or (report->>'reservation_count')::integer <> 2 then
                  raise exception 'Allocated storage usage is not exact';
              end if;
              finalized:=public.dank_embed_studio_asset_finalize(
                  '123',path1,repeat('a',64),'Brand art','image/png',4194304
              );
              if finalized->>'finalized' <> 'true' then
                  raise exception 'Artwork metadata did not finalize';
              end if;
              if (select count(*) from public.dank_embed_studio_assets
                  where object_path=path1) <> 1 then
                  raise exception 'Finalized artwork metadata is missing';
              end if;
              if not public.dank_embed_studio_asset_release('456',path3) then
                  raise exception 'Confirmed rollback could not release quota';
              end if;
              report:=public.dank_embed_studio_asset_usage('123');
              if (report->>'global_used')::bigint <> 4194304
                 or (report->>'reservation_count')::integer <> 0
                 or (report->>'asset_count')::integer <> 1 then
                  raise exception 'Released capacity was counted incorrectly';
              end if;
              if exists(select 1 from public.dank_embed_studio_asset_holds where object_path=path1) then
                  raise exception 'Finalized art still consumes a hold';
              end if;
          end;
          $tests$;
          SQL
