name: Temporary persistent interaction repair

on:
  push:
    branches:
      - audit/persistent-interaction-compatibility

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/persistent-interaction-compatibility
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Recreate validated strict patcher
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          payload = ''''''
          with open('/tmp/apply_persistent_interaction_fix.py', 'wb') as fh:
              fh.write(gzip.decompress(base64.b64decode(payload)))
          PY
          python /tmp/apply_persistent_interaction_fix.py

      - name: Run focused regression validation
        run: |
          python -m pytest -q --tb=short --disable-warnings tests/test_persistent_interaction_compatibility.py
          python -m pytest -q --tb=short --disable-warnings \
            tests/test_ticket_panel_native_restart_runtime.py \
            tests/test_basic_verify_native_restart_runtime_static.py \
            tests/test_public_panels_persistence_static.py
          python -m compileall -q stoney_verify main.py tools tests
          git diff --check

      - name: Commit validated repair and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/_temp_persistent_interaction_repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            stoney_verify/commands_ext/public_members_group.py \
            stoney_verify/spam_guard.py \
            stoney_verify/tickets_new/panel.py \
            stoney_verify/transcripts.py \
            tests/test_persistent_interaction_compatibility.py \
            .github/workflows/_temp_persistent_interaction_repair.yml
          git diff --cached --check
          git commit -m 'Harden persistent interaction restart compatibility'
          git push origin HEAD:audit/persistent-interaction-compatibility
