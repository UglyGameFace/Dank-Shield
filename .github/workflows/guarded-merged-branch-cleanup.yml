                if (scanUiReview) {
                  if (scanUiReview.sha !== branch.commit.sha) continue;
                  if (scanUiReview.mergedPr) {
                    if (prs.length !== 1 ||
                        prs[0].number !== scanUiReview.mergedPr ||
                        !prs[0].merged_at ||
                        prs[0].state !== 'closed' ||
                        prs[0].base?.ref !== defaultBranch ||
                        prs[0].head.sha !== scanUiReview.mergedPrHead) continue;
                    const comparison = await github.rest.repos.compareCommits({
                      owner, repo, base: scanUiReview.mergedPrHead,
                      head: branch.commit.sha
                    });
                    if (comparison.data.ahead_by !== 1 ||
                        comparison.data.behind_by !== 0 ||
                        comparison.data.files?.length !== 1 ||
                        comparison.data.files[0].filename !== scanUiReview.onlyFile) continue;
                  } else if (scanUiReview.closedPr) {
                    // A closed, unmerged historical PR is retained as an immutable
                    // review record. Refuse if any other PR uses this branch.
                    if (prs.length !== 1 ||
                        prs[0].number !== scanUiReview.closedPr ||
                        prs[0].merged_at ||
                        prs[0].state !== 'closed' ||
                        prs[0].head.sha !== branch.commit.sha) continue;
                  } else if (prs.length) continue;
                  const original = (await github.rest.repos.getCommit({
                    owner, repo, ref: branch.commit.sha
                  })).data;
                  if (original.parents?.length !== 1 ||
                      original.files?.length !== 1 ||
                      original.files[0].filename !== scanUiReview.onlyFile ||
                      original.files[0].status !== 'modified') continue;
                  const currentUi = await github.rest.repos.getContent({
                    owner, repo, path: scanUiReview.onlyFile, ref: defaultBranch
                  });
                  const uiText = Buffer.from(currentUi.data.content, 'base64').toString('utf8');
                  if (!uiText.includes('name=f"Users Found — Page {page + 1}/{pages}"') ||
                      !uiText.includes('value=_build_page_users_text(report, page=page)') ||
                      !uiText.includes('def _candidate_display_name(') ||
                      !uiText.includes('manual-only') ||
                      !uiText.includes('No current members matched this inactivity review.') ||
                      !uiText.includes('Preview only. No action is taken here.') ||
                      ((scanUiReview.closedPr || scanUiReview.mergedPr) && (
                        !uiText.includes('name="Data Sources"') ||
                        !uiText.includes('Data Notes') ||
                        !uiText.includes('Page IDs') ||
                        !uiText.includes('30d') ||
                        !uiText.includes('90d') ||
                        !uiText.includes('180d')
                      ))) continue;
                  candidates.push({ name, sha: branch.commit.sha,
                    reason: 'reviewed member scan UI branch superseded by main mobile review dashboard' });
                  continue;
                }
                const evidenceReview = reviewedMemberEvidence.get(name);
                if (evidenceReview) {
                  if (evidenceReview.sha !== branch.commit.sha || prs.length) continue;
                  const original = (await github.rest.repos.getCommit({
                    owner, repo, ref: branch.commit.sha
                  })).data;
                  if (original.parents?.length !== 1 ||
                      original.files?.length !== 1 ||
                      original.files[0].filename !== evidenceReview.onlyFile ||
                      original.files[0].status !== 'added') continue;
                  const currentService = await github.rest.repos.getContent({
                    owner, repo, path: 'stoney_verify/members_new/activity_service.py',
                    ref: defaultBranch
                  });
                  const currentUi = await github.rest.repos.getContent({
                    owner, repo, path: 'stoney_verify/commands_ext/public_members_group.py',
                    ref: defaultBranch
                  });
                  const serviceText = Buffer.from(currentService.data.content, 'base64').toString('utf8');
                  const uiText = Buffer.from(currentUi.data.content, 'base64').toString('utf8');
                  if (!serviceText.includes('async def _load_recent_discord_evidence(') ||
                      !serviceText.includes('recent_signals, recent_warnings, recent_read, recent_attempted') ||
                      !serviceText.includes('activity_signals.setdefault(int(uid), []).extend(signals)') ||
                      !serviceText.includes('if not is_modlog:') ||
                      !uiText.includes('Users Found — Page')) continue;
                  candidates.push({ name, sha: branch.commit.sha,
                    reason: 'reviewed single-file member evidence prototype replaced in main' });
                  continue;
                }
                const review = reviewedRetirements.get(name);
                if (!review || review.sha !== branch.commit.sha) continue;
                if (review.kind === 'merged') {
                  if (prs.some(pr => !pr.merged_at)) continue;
                  if (!prs.some(pr =>
                    pr.number === review.pr && pr.merged_at &&
                    pr.base?.ref === defaultBranch &&
                    pr.head.sha === branch.commit.sha
                  )) continue;
                } else if (review.kind === 'linked-ancestor') {
                  // These PRs landed in the dashboard-linked production branch
                  // before that history was merged into main. Require a frozen
                  // merged PR head PLUS ancestry of both retained branch refs.
                  if (prs.some(pr => !pr.merged_at)) continue;
                  if (!prs.some(pr =>
                    pr.number === review.pr && pr.merged_at &&
                    pr.base?.ref === 'aaa-cinema-pre-pregateway-bind' &&
                    pr.head.sha === branch.commit.sha
                  )) continue;
                  if (!await ancestorOfMain(branch.commit.sha)) continue;
                  if (!await ancestorOfLinkedDiscloud(branch.commit.sha)) continue;
                } else if (review.kind === 'superseded' || review.kind === 'closed-record') {
                  const original = prs.find(pr =>
                    pr.number === review.pr && !pr.merged_at &&
                    pr.head.sha === branch.commit.sha
                  );
                  const replacement = closedPRs.find(pr =>
                    pr.number === review.replacement && pr.merged_at &&
                    pr.base?.ref === defaultBranch &&
                    pr.head?.repo?.full_name === fullName
                  );
                  if (!original || !replacement) continue;
                } else if (review.kind === 'superseded-no-pr') {
                  // This unique historical commit never entered a PR. Its only
                  // changed file was independently checked against a newer,
                  // merged replacement. The current tree's behavioral parity
                  // is separately asserted by source-level regression tests.
                  if (prs.length) continue;
                  const replacement = closedPRs.find(pr =>
                    pr.number === review.replacement && pr.merged_at &&
                    pr.base?.ref === defaultBranch &&
                    pr.head?.repo?.full_name === fullName &&
                    pr.head.sha === review.replacementSha
                  );
                  if (!replacement) continue;
                  const original = (await github.rest.repos.getCommit({
                    owner, repo, ref: branch.commit.sha
                  })).data;
                  if (original.parents?.length !== 1 ||
                      original.files?.length !== 1 ||
                      original.files[0].filename !== review.onlyFile ||
                      original.files[0].status !== 'modified') continue;
                  const replacementFiles = await github.paginate(
                    github.rest.pulls.listFiles, {
                      owner, repo, pull_number: review.replacement, per_page: 100
                    }
                  );
                  if (!replacementFiles.some(f =>
                    f.filename === review.onlyFile && f.status === 'modified'
                  )) continue;
                } else if (review.kind === 'ancestor-only') {
                  // Audited no-PR refs without unique commits require ancestry.
                  if (prs.length || !await ancestorOfMain(branch.commit.sha)) continue;
                } else {
                  continue;
                }
                const reason = review.kind === 'merged'
                  ? 'reviewed merged PR #' + review.pr
                  : review.kind === 'linked-ancestor'
                    ? 'reviewed production PR #' + review.pr + ' (verified ancestors of main and linked Discloud)'
                  : review.kind === 'ancestor-only'
                    ? 'reviewed no-PR ancestor of main'
                  : review.kind === 'superseded-no-pr'
                    ? 'reviewed single-file no-PR change superseded by merged #' + review.replacement
                    : review.kind === 'closed-record'
                      ? 'reviewed closed record #' + review.pr + ' after merged implementation #' + review.replacement
                      : 'reviewed closed PR #' + review.pr + ' superseded by #' + review.replacement;
                candidates.push({ name, sha: branch.commit.sha, reason });
                continue;
              }
              // Never discard any branch associated with a closed-unmerged PR,
              // even if another PR from this head was merged.
              if (prs.some(pr => !pr.merged_at)) continue;

              if (!nextBatch) {
                if (!eligiblePrefixes.some(prefix => name.startsWith(prefix))) continue;
                if (segments.some(segment => reservedSegments.has(segment))) continue;
                const merged = prs.find(pr =>
                  pr.merged_at &&
                  pr.merged_at < mergedBefore &&
                  pr.base?.ref === defaultBranch &&
                  pr.head.sha === branch.commit.sha
                );
                if (merged) {
                  candidates.push({
                    name, sha: branch.commit.sha,
                    reason: 'merged PR #' + merged.number + ' into main'
                  });
                }
                continue;
              }

              if (explicitlyRetained.has(name)) continue;
              if (nextProtectedPrefixes.some(prefix => name.startsWith(prefix))) continue;
              if (segments.some(segment => nextSensitiveSegments.has(segment))) continue;
              const recognized = nextPrefixes.some(prefix => name.startsWith(prefix));
              if (!recognized && !checkedNoPR.has(name)) continue;

              const merged = prs.find(pr =>
                pr.merged_at &&
                pr.merged_at < nextMergedBefore &&
                pr.head.sha === branch.commit.sha &&
                pr.base?.ref === defaultBranch
              );
              if (merged) {
                // GitHub's merged status and unchanged branch tip prove this
                // revision was submitted; squash merges need not be ancestors.
                candidates.push({
                  name, sha: branch.commit.sha,
                  reason: 'merged PR #' + merged.number + ' into main'
                });
                continue;
              }
              const mergedElsewhere = prs.find(pr =>
                pr.merged_at &&
                pr.merged_at < nextMergedBefore &&
                pr.head.sha === branch.commit.sha &&
                pr.base?.ref !== defaultBranch
              );
              if (mergedElsewhere) {
                // Merged into a prior production branch: ensure that history
                // itself is now reachable from main before deleting the ref.
                if (await ancestorOfMain(branch.commit.sha)) {
                  candidates.push({
                    name, sha: branch.commit.sha,
                    reason: 'merged PR #' + mergedElsewhere.number + ' + ancestor of main'
                  });
                }
                continue;
              }
              if (!prs.length && checkedNoPR.has(name)) {
                if (await ancestorOfMain(branch.commit.sha)) {
                  candidates.push({
                    name, sha: branch.commit.sha,
                    reason: 'audited no-PR ancestor of main'
                  });
                }
              }
            }
            if (candidates.length > 250) {
              throw new Error('Fail closed: too many candidates for reviewed batch');
            }

            const batchLabel = reviewedBatch ? 'reviewed historical' : nextBatch ? 'second-wave' : 'first-wave';
            core.info(`Found ${branches.length} branches, ${openPRs.length} open PRs, ${candidates.length} eligible ${batchLabel} branches.`);
            for (const candidate of candidates) {
              core.info(`Candidate: ${candidate.name} (${candidate.reason}, ${candidate.sha})`);
            }
            const deleted = [];
            const skipped = [];
            const failed = [];

            if (deleting) {
              for (const candidate of candidates) {
                let deletionStage = 'branch recheck';
                try {
                  // Recheck the head immediately before the destructive call.
                  const current = (await github.rest.repos.getBranch({
                    owner, repo, branch: candidate.name
                  })).data;
                  if (current.protected || current.commit.sha !== candidate.sha) {
                    skipped.push(candidate.name);
                    continue;
                  }
                  // Always preserve and verify a lightweight Git tag at the
                  // exact original SHA before deleting an active branch ref.
                  const tagRef = `tags/branch-retirement-20261016/${candidate.name}`;
                  deletionStage = 'archive tag lookup';
                  let archive = null;
                  try {
                    deletionStage = 'archive tag verification';
                    archive = (await github.rest.git.getRef({
                      owner, repo, ref: tagRef
                    })).data;
                  } catch (error) {
                    if (error.status !== 404) throw error;
                  }
                  if (!archive) {
                    deletionStage = 'archive tag creation';
                    await github.rest.git.createRef({
                      owner, repo, ref: `refs/${tagRef}`, sha: candidate.sha
                    });
                    archive = (await github.rest.git.getRef({
                      owner, repo, ref: tagRef
                    })).data;
                  }
                  if (
                    archive.object?.type !== 'commit' ||
                    archive.object.sha !== candidate.sha
                  ) {
                    throw new Error(`Archived tag head mismatch for ${candidate.name}`);
                  }
                  deletionStage = 'branch deletion';
                  // Retry only a recognized transient GitHub API failure.
                  // Do not retry 403 permission/ruleset denial, 404 or 422:
                  // those require investigation, not a destructive fallback.
                  for (let attempt = 1; attempt <= 2; attempt++) {
                    try {
                      await github.rest.git.deleteRef({
                        owner, repo, ref: `heads/${candidate.name}`
                      });
                      break;
                    } catch (error) {
                      const status = Number(error.status || 0);
                      const isRateLimited = (status === 403 || status === 429) &&
                        /secondary rate limit|rate limit exceeded|abuse detection/i.test(
                          String(error.message || '')
                        );
                      const isTransient = status === 429 || status >= 500 || isRateLimited;
                      if (!isTransient || attempt === 2) throw error;
                      core.warning(
                        `Transient GitHub delete failure for ${candidate.name} (${status}); retrying once`
                      );
                      await new Promise(resolve => setTimeout(resolve, 4000));
                      // Preserve lease safety even on retry.
                      const rechecked = (await github.rest.repos.getBranch({
                        owner, repo, branch: candidate.name
                      })).data;
                      if (rechecked.protected || rechecked.commit.sha !== candidate.sha) {
                        throw new Error('Branch head changed or became protected before retry');
                      }
                    }
                  }
                  deleted.push(candidate.name);
                  // Pace writes instead of provoking GitHub secondary rate limits.
                  await new Promise(resolve => setTimeout(resolve, 650));
                } catch (error) {
                  failed.push(`${candidate.name} [${deletionStage}]: ${error.status || 'error'} ${error.message}`);
                }
              }
            }
            const lines = [
              `Mode: **${mode}**`,
              `Branches before cleanup: **${branches.length}**`,
              `Eligible ${batchLabel} branches: **${candidates.length}**`,
              `Deleted: **${deleted.length}**; skipped changed/protected: **${skipped.length}**; failures: **${failed.length}**`,
              '',
              ...candidates.map(c => `- \`${c.name}\` (${c.reason})`)
            ];
            if (failed.length) lines.push('', 'Failures:', ...failed.map(s => `- ${s}`));
            await core.summary
              .addHeading('Guarded merged-branch cleanup')
              .addRaw(lines.join('\n'))
              .write();
            if (failed.length) {
              for (const failure of failed) {
                // A failed deletion must be diagnosable from the ordinary job log.
                // Do not require users to hunt for the separate run summary.
                core.error(`Cleanup deletion failed: ${failure}`);
              }
              core.setFailed(`Partial cleanup: ${failed.length} branch deletions failed; inspect errors above`);
            }
