name: Guarded merged-branch cleanup

# This is deliberately owner-dispatched. Merging the workflow cannot delete branches.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview candidates first; deletion requires separate confirmation"
        type: choice
        options:
          - preview
          - delete
          - preview-next
          - delete-next
          - preview-reviewed
          - delete-reviewed
        default: preview
        required: true
      confirmation:
        description: "Confirm delete with the token for the selected batch (see run summary)"
        type: string
        required: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: guarded-merged-branch-cleanup
  cancel-in-progress: false

jobs:
  prune-stale-merged-branches:
    if: ${{ github.ref == 'refs/heads/main' && github.actor == 'UglyGameFace' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Preview or prune verified old merged PR branches
        uses: actions/github-script@v7
        env:
          CLEANUP_MODE: ${{ inputs.mode }}
          CLEANUP_CONFIRMATION: ${{ inputs.confirmation }}
        with:
          script: |
            const mode = process.env.CLEANUP_MODE;
            const nextBatch = mode === 'preview-next' || mode === 'delete-next';
            const reviewedBatch = mode === 'preview-reviewed' || mode === 'delete-reviewed';
            const deleting = mode === 'delete' || mode === 'delete-next' || mode === 'delete-reviewed';
            if (!['preview', 'delete', 'preview-next', 'delete-next', 'preview-reviewed', 'delete-reviewed'].includes(mode)) {
              throw new Error('Unsupported cleanup mode');
            }
            if (
              deleting &&
              process.env.CLEANUP_CONFIRMATION !== (
                reviewedBatch ? 'DELETE_REVIEWED_HISTORICAL_BRANCHES' :
                nextBatch ? 'DELETE_VERIFIED_NEXT_BATCH' : 'DELETE_STALE_MERGED_BRANCHES'
              )
            ) {
              throw new Error('Delete mode requires the exact owner confirmation');
            }

            const { owner, repo } = context.repo;
            const fullName = `${owner}/${repo}`;
            const defaultBranch = (await github.rest.repos.get({ owner, repo }))
              .data.default_branch;
            if (defaultBranch !== 'main') {
              throw new Error('Fail closed: unexpected default branch');
            }

            // One-time historical batch. Never widen this date automatically.
            const mergedBefore = '2026-10-01T00:00:00Z';
            const eligiblePrefixes = [
              'agent/', 'audit/', 'chore/', 'feat/', 'feature/',
              'fix/', 'hotfix/', 'improve/'
            ];
            const reservedSegments = new Set([
              'backup', 'restore', 'recovery', 'archive', 'release',
              'deploy', 'deployment', 'discloud', 'staging', 'migration',
              'supabase', 'database', 'postgres', 'pg', 'main',
              'production', 'ops', 'reconcile', 'rollback', 'revert',
              'known', 'good', 'pre', 'snapshot', 'stable', 'ci', 'test'
            ]);

            // Second reviewed wave: fixed historical date, never rolls forward.
            const nextMergedBefore = '2026-10-14T00:00:00Z';
            const nextPrefixes = [
              'agent/', 'audit/', 'chore/', 'feat/', 'feature/',
              'fix/', 'hotfix/', 'improve/', 'diagnostics/',
              'stabilization/', 'test/', 'investigate/', 'refactor/', 'revert/'
            ];
            // These may be real rollback/deploy targets, including the Discloud
            // dashboard-linked branch. No branch naming alone proves redundancy.
            const nextProtectedPrefixes = [
              'aaa-', 'archive/', 'backup/', 'recovery/', 'integration/',
              'reconcile/', 'rebuild/', 'ops/', 'ci/'
            ];
            const nextSensitiveSegments = new Set([
              'backup', 'restore', 'recovery', 'archive', 'release', 'deploy',
              'deployment', 'discloud', 'staging', 'migration', 'supabase',
              'database', 'postgres', 'pg17', 'production', 'ops', 'reconcile',
              'rollback', 'revert', 'known', 'snapshot', 'stable'
            ]);
            const explicitlyRetained = new Set([
              'aaa-cinema-pre-pregateway-bind',
              'backup/stoneyverify-stable-7fdc331-20261008',
              'chore/guarded-merged-branch-cleanup-20261015'
            ]);
            // Audited no-PR refs with zero commits ahead of main. The runtime
            // MUST still prove ancestry and unchanged SHA before deletion.
            const checkedNoPR = new Set([
              'audit/p0-int-verify-panel-closeout',
              'chore/close-release-governance-009',
              'feat/cinema-subtitles-per-viewer-20261010',
              'feat/welcome-card-renderer',
              'feat/517-membership-agreement-sync-20261013',
              'fix/authoritative-stats-and-ticket-categories',
              'fix/cinema-audio-track-selector',
              'fix/profile-signature-compact-ui',
              'fix/430-cinema-playback-readiness-audio',
              'fix/430-cinema-private-invite-responsive',
              'noop', 'noop2', 'temp-ignore', 'tmp-noop', 'tmp-noop2'
            ]);

            // Third wave is reviewed individually, never inferred from prefixes.
            // Closed-unmerged entries were explicitly superseded or validation-only.
            // GitHub retains their PR discussion/diff, but their branches are not
            // removed until the owner reviews a separate preview.
            const reviewedRetirements = new Map([
              ['feature/config-backup-version-history', { kind: 'merged', pr: 107, sha: '0934a2f37642df8b46e713fba1febc7fe4089854' }],
              ['feature/selective-config-backup-restore', { kind: 'merged', pr: 109, sha: '8027bf061a07a1da1ff10657bda326e06d421837' }],
              ['feat/production-welcome-cards-clean', { kind: 'merged', pr: 115, sha: 'e59cc11d6b1011ecfba2a5d871def90cf6015e9f' }],
              ['fix/dank-stats-live-recovery', { kind: 'merged', pr: 167, sha: '5ab92f4fe1bdd8bc28cc6aa8add890d87aaa3013' }],
              ['fix/ds-ops-021-owner-bulk-welcome', { kind: 'merged', pr: 174, sha: 'c6485bb7e7bfef552c106e5a85b273e42f9413e3' }],
              ['fix/ds-purge-025-restore-direct-purge', { kind: 'merged', pr: 179, sha: 'ea373914c509ae2eeab47886a2333153a87a846f' }],
              ['fix/invite-reconcile-runtime-194', { kind: 'merged', pr: 194, sha: 'a122c6273c4c38f71389f23aba1f70bac759d2f6' }],
              ['fix/invite-reconcile-production-hardening-195', { kind: 'merged', pr: 195, sha: '25169b0800dfdf88ceaf0308209c6a2746b23e34' }],
              ['fix/release-governance-009', { kind: 'merged', pr: 212, sha: '60a20e3b657e57ace29d092663fa8003b9e3e822' }],
              ['fix/startup-recovery-storm', { kind: 'merged', pr: 280, sha: '979f8e4ea293f885975e64a643507d74d62ed8f1' }],
              ['fix/408-release-first-selection', { kind: 'merged', pr: 412, sha: '957293c3ebddcb3f030e576209d8e42cf11665d8' }],
              ['fix/408-movie-stale-recovery', { kind: 'merged', pr: 414, sha: '77c2b51cce33fd3caea640be9b19e791d85866a5' }],
              ['fix/430-cinema-production-polish', { kind: 'merged', pr: 435, sha: '25648d5e827ffd55939eb0c7a46a7fdf15b14e04' }],
              ['fix/runtime-startup-hygiene-spamguard-default', { kind: 'superseded', pr: 95, replacement: 94, sha: '6a1f9617320d8adc54d7a792037210beacceb63c' }],
              ['fix/startup-spamguard-command-activity-health', { kind: 'superseded', pr: 93, replacement: 94, sha: '6dd2d71176e2b7845f1b1136fa668c442d561f1e' }],
              ['ci/ds-setup-020-final-validation', { kind: 'superseded', pr: 173, replacement: 171, sha: '008e705cb9b59fdeaf76fc908acdfd8723c752e2' }],
              ['ci/ds-setup-020-macos-trigger', { kind: 'superseded', pr: 172, replacement: 171, sha: '15482f01deea0ab9e439d0ed603e4f219212abfe' }],
            ]);
            const [branches, closedPRs, openPRs] = await Promise.all([
              github.paginate(github.rest.repos.listBranches, {
                owner, repo, per_page: 100
              }),
              github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'closed', per_page: 100
              }),
              github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', per_page: 100
              })
            ]);
            const closedByHead = new Map();
            for (const pr of closedPRs) {
              if (pr.head?.repo?.full_name !== fullName) continue;
              const list = closedByHead.get(pr.head.ref) || [];
              list.push(pr);
              closedByHead.set(pr.head.ref, list);
            }
            const inUseByOpenPR = new Set();
            for (const pr of openPRs) {
              if (pr.head?.repo?.full_name === fullName) {
                inUseByOpenPR.add(pr.head.ref);
              }
              if (pr.base?.repo?.full_name === fullName) {
                inUseByOpenPR.add(pr.base.ref);
              }
            }

            const ancestors = new Map();
            async function ancestorOfMain(sha) {
              if (ancestors.has(sha)) return ancestors.get(sha);
              const { data } = await github.rest.repos.compareCommits({
                owner, repo, base: defaultBranch, head: sha
              });
              const safe = data.ahead_by === 0 &&
                (data.status === 'behind' || data.status === 'identical');
              ancestors.set(sha, safe);
              return safe;
            }

            const candidates = [];
            for (const branch of branches) {
              const name = branch.name;
              if (name === defaultBranch || branch.protected) continue;
              if (inUseByOpenPR.has(name)) continue;
              const segments = name.toLowerCase().split(/[\\/._-]+/);
              const prs = closedByHead.get(name) || [];
              if (reviewedBatch) {
                const review = reviewedRetirements.get(name);
                if (!review || review.sha !== branch.commit.sha) continue;
                if (review.kind === 'merged') {
                  if (prs.some(pr => !pr.merged_at)) continue;
                  if (!prs.some(pr =>
                    pr.number === review.pr && pr.merged_at &&
                    pr.base?.ref === defaultBranch &&
                    pr.head.sha === branch.commit.sha
                  )) continue;
                } else if (review.kind === 'superseded') {
                  const original = prs.find(pr =>
                    pr.number === review.pr && !pr.merged_at &&
                    pr.head.sha === branch.commit.sha
                  );
                  const replacement = closedPRs.find(pr =>
                    pr.number === review.replacement && pr.merged_at &&
                    pr.base?.ref === defaultBranch &&
                    pr.head?.repo?.full_name === fullName
                  );
                  if (!original || !replacement) continue;
                } else {
                  continue;
                }
                candidates.push({
                  name, sha: branch.commit.sha,
                  reason: review.kind === 'merged'
                    ? 'reviewed merged PR #' + review.pr
                    : 'reviewed closed PR #' + review.pr + ' superseded by #' + review.replacement
                });
                continue;
              }
              // Never discard any branch associated with a closed-unmerged PR,
              // even if another PR from this head was merged.
              if (prs.some(pr => !pr.merged_at)) continue;

              if (!nextBatch) {
                if (!eligiblePrefixes.some(prefix => name.startsWith(prefix))) continue;
                if (segments.some(segment => reservedSegments.has(segment))) continue;
                const merged = prs.find(pr =>
                  pr.merged_at &&
                  pr.merged_at < mergedBefore &&
                  pr.base?.ref === defaultBranch &&
                  pr.head.sha === branch.commit.sha
                );
                if (merged) {
                  candidates.push({
                    name, sha: branch.commit.sha,
                    reason: 'merged PR #' + merged.number + ' into main'
                  });
                }
                continue;
              }

              if (explicitlyRetained.has(name)) continue;
              if (nextProtectedPrefixes.some(prefix => name.startsWith(prefix))) continue;
              if (segments.some(segment => nextSensitiveSegments.has(segment))) continue;
              const recognized = nextPrefixes.some(prefix => name.startsWith(prefix));
              if (!recognized && !checkedNoPR.has(name)) continue;

              const merged = prs.find(pr =>
                pr.merged_at &&
                pr.merged_at < nextMergedBefore &&
                pr.head.sha === branch.commit.sha &&
                pr.base?.ref === defaultBranch
              );
              if (merged) {
                // GitHub's merged status and unchanged branch tip prove this
                // revision was submitted; squash merges need not be ancestors.
                candidates.push({
                  name, sha: branch.commit.sha,
                  reason: 'merged PR #' + merged.number + ' into main'
                });
                continue;
              }
              const mergedElsewhere = prs.find(pr =>
                pr.merged_at &&
                pr.merged_at < nextMergedBefore &&
                pr.head.sha === branch.commit.sha &&
                pr.base?.ref !== defaultBranch
              );
              if (mergedElsewhere) {
                // Merged into a prior production branch: ensure that history
                // itself is now reachable from main before deleting the ref.
                if (await ancestorOfMain(branch.commit.sha)) {
                  candidates.push({
                    name, sha: branch.commit.sha,
                    reason: 'merged PR #' + mergedElsewhere.number + ' + ancestor of main'
                  });
                }
                continue;
              }
              if (!prs.length && checkedNoPR.has(name)) {
                if (await ancestorOfMain(branch.commit.sha)) {
                  candidates.push({
                    name, sha: branch.commit.sha,
                    reason: 'audited no-PR ancestor of main'
                  });
                }
              }
            }
            if (candidates.length > 250) {
              throw new Error('Fail closed: too many candidates for reviewed batch');
            }

            const batchLabel = reviewedBatch ? 'reviewed historical' : nextBatch ? 'second-wave' : 'first-wave';
            core.info(`Found ${branches.length} branches, ${openPRs.length} open PRs, ${candidates.length} eligible ${batchLabel} branches.`);
            for (const candidate of candidates) {
              core.info(`Candidate: ${candidate.name} (${candidate.reason}, ${candidate.sha})`);
            }
            const deleted = [];
            const skipped = [];
            const failed = [];

            if (deleting) {
              for (const candidate of candidates) {
                try {
                  // Recheck the head immediately before the destructive call.
                  const current = (await github.rest.repos.getBranch({
                    owner, repo, branch: candidate.name
                  })).data;
                  if (current.protected || current.commit.sha !== candidate.sha) {
                    skipped.push(candidate.name);
                    continue;
                  }
                  await github.rest.git.deleteRef({
                    owner, repo, ref: `heads/${candidate.name}`
                  });
                  deleted.push(candidate.name);
                  // Pace writes instead of provoking GitHub secondary rate limits.
                  await new Promise(resolve => setTimeout(resolve, 650));
                } catch (error) {
                  failed.push(`${candidate.name}: ${error.message}`);
                }
              }
            }
            const lines = [
              `Mode: **${mode}**`,
              `Branches before cleanup: **${branches.length}**`,
              `Eligible ${batchLabel} branches: **${candidates.length}**`,
              `Deleted: **${deleted.length}**; skipped changed/protected: **${skipped.length}**; failures: **${failed.length}**`,
              '',
              ...candidates.map(c => `- \`${c.name}\` (${c.reason})`)
            ];
            if (failed.length) lines.push('', 'Failures:', ...failed.map(s => `- ${s}`));
            await core.summary
              .addHeading('Guarded merged-branch cleanup')
              .addRaw(lines.join('\n'))
              .write();
            if (failed.length) {
              core.setFailed(`Partial cleanup: ${failed.length} branch deletions failed; inspect summary`);
            }
