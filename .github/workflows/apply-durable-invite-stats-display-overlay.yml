name: Apply Durable Invite Stats Display Overlay

on:
  push:
    branches:
      - fix/dank-stats-invite-block-counting
    paths:
      - tools/apply_durable_invite_stats_display_overlay.py
      - .github/workflows/apply-durable-invite-stats-display-overlay.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dank-stats-invite-block-counting
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact display overlay edits
        run: python tools/apply_durable_invite_stats_display_overlay.py
      - name: Commit exact edits and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Read durable invite totals directly in Dank Stats"
          git push origin HEAD:fix/dank-stats-invite-block-counting
