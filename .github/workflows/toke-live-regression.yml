name: Toke Live Meetup Regression

on:
  pull_request:
    paths:
      - "stoney_verify/toke_sessions.py"
      - "stoney_verify/toke_live_ui.py"
      - "stoney_verify/commands_ext/public_toke.py"
      - "stoney_verify/commands_ext/public_community_pings.py"
      - "stoney_verify/commands_ext/public_command_surface_v2.py"
      - "tests/test_toke_live_sessions.py"
      - "tests/test_profile_community_toke.py"
      - "tests/test_navigation_registry_runtime.py"
      - ".github/workflows/toke-live-regression.yml"
  push:
    branches: [main]
    paths:
      - "stoney_verify/toke_sessions.py"
      - "stoney_verify/toke_live_ui.py"
      - "stoney_verify/commands_ext/public_toke.py"
      - "tests/test_toke_live_sessions.py"

permissions:
  contents: read

jobs:
  toke-live:
    name: Toke workflow and session guards
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Discord bot dependencies and pytest
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
      - name: Compile Toke modules
        run: python -m py_compile stoney_verify/toke_sessions.py stoney_verify/toke_live_ui.py stoney_verify/commands_ext/public_toke.py stoney_verify/commands_ext/public_community_pings.py
      - name: Test participation, normal GIF capture, and compatibility
        run: python -m pytest tests/test_toke_live_sessions.py tests/test_profile_community_toke.py tests/test_navigation_registry_runtime.py -q --tb=short --disable-warnings
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
