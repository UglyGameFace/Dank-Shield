name: DS Design 033 Legacy Owner Cleanup

on:
  push:
    branches:
      - fix/ds-design-033-editor-separator-reset-correctness
    paths:
      - '.github/workflows/_ds-design-033-legacy-owner-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/ds-design-033-editor-separator-reset-correctness
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Remove competing legacy owners and validate
        run: |
          python tools/_ds_design_033_legacy_owner_cleanup.py
          python -m py_compile \
            stoney_verify/commands_ext/public_design_studio.py \
            stoney_verify/commands_ext/public_design_studio_v2.py \
            stoney_verify/services/server_design_plan_service.py \
            tools/audit_dank_design_redundancy_033.py
          python -m pytest -q --tb=short --disable-warnings \
            tests/test_design_studio_consolidation_032.py \
            tests/test_dank_design_runtime_ownership_033.py \
            tests/test_dank_design_editor_state_authority.py \
            tests/test_public_design_style_change_native_guard_applier_static.py \
            tests/test_public_design_rollback_native_guard_applier_static.py
          python tools/audit_dank_design_redundancy_033.py
          python tools/audit_dank_design_smart_auto_detect.py
          git diff --check

      - name: Commit validated cleanup
        run: |
          rm tools/_ds_design_033_legacy_owner_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Expected legacy cleanup produced no changes"
            exit 1
          fi
          git commit -m "DS-DESIGN-033: remove competing legacy home and apply owners"
          git push origin HEAD:fix/ds-design-033-editor-separator-reset-correctness
