name: Lifecycle Unicode Font Provisioning

on:
  pull_request:
    paths:
      - "discloud.config"
      - "stoney_verify/unicode_font_fallback.py"
      - "tools/provision_unicode_fonts.py"
      - "tests/test_unicode_font_provisioner.py"
      - "tests/test_welcome_card_unicode_fallback.py"
      - ".github/workflows/unicode-font-provisioning.yml"
  push:
    branches:
      - main
    paths:
      - "discloud.config"
      - "stoney_verify/unicode_font_fallback.py"
      - "tools/provision_unicode_fonts.py"
      - "tests/test_unicode_font_provisioner.py"
      - "tests/test_welcome_card_unicode_fallback.py"
      - ".github/workflows/unicode-font-provisioning.yml"

permissions:
  contents: read

jobs:
  provision-and-cover:
    name: Provision fonts and verify live Unicode coverage
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install font inspection dependencies
        run: >-
          python -m pip install -q
          "fonttools>=4.55.0,<5.0.0"
          "Pillow>=10.4.0,<12.0.0"
          "regex>=2024.11.6,<2027.0.0"

      - name: Provision pinned runtime fonts
        run: python tools/provision_unicode_fonts.py

      - name: Verify pinned runtime fonts
        run: python tools/provision_unicode_fonts.py --verify-only

      - name: Verify exact live Canadian-syllabics coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont

          root = Path(".runtime_fonts")
          sample = "PᗩᗰƐᒪᗩ"
          required = {ord(ch) for ch in sample}

          coverage = set()
          details = {}
          for path in sorted(root.glob("*")):
              if path.suffix.lower() not in {".ttf", ".otf"}:
                  continue
              font = TTFont(str(path), lazy=True)
              points = set()
              try:
                  for table in font["cmap"].tables:
                      if table.isUnicode():
                          points.update(table.cmap)
              finally:
                  font.close()
              coverage.update(points)
              details[path.name] = sorted(
                  f"U+{codepoint:04X}" for codepoint in required.intersection(points)
              )

          missing = sorted(required - coverage)
          print("live sample:", sample)
          print("runtime coverage:", details)
          if missing:
              raise SystemExit(
                  "runtime fallback missing live codepoints: "
                  + ", ".join(f"U+{codepoint:04X}" for codepoint in missing)
              )
          PY

      - name: Resolve exact live name through production fallback engine
        shell: bash
        run: |
          python - <<'PY'
          from stoney_verify import unicode_font_fallback as fallback

          sample = "PᗩᗰƐᒪᗩ"
          runs = fallback.resolve_font_runs(
              sample,
              primary_paths=(
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              ),
              bold=True,
          )
          assert runs, "fallback engine returned no runs"
          assert "".join(run.text for run in runs) == sample
          uncovered = [
              (run.text, run.source.key)
              for run in runs
              if not fallback.source_supports(run.source, run.text)
          ]
          print(
              "resolved runs:",
              [(run.text, run.source.key, run.source.path) for run in runs],
          )
          if uncovered:
              raise SystemExit(f"fallback engine selected uncovered runs: {uncovered}")
          PY
