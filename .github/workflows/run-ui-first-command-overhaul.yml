name: Diagnose UI First Command Patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-command-payload-limit
          fetch-depth: 0
      - name: Restore canonical patch inputs
        run: |
          git checkout origin/main -- \
            ACTIVE_TASK.md \
            stoney_verify/commands.py \
            stoney_verify/commands_ext/public_self_roles_group.py \
            stoney_verify/commands_ext/public_setup_recommend.py \
            stoney_verify/profile_card_runtime.py \
            stoney_verify/profile_card_runtime_core.py \
            stoney_verify/profile_card_service.py \
            stoney_verify/profile_card_setup_ui.py \
            stoney_verify/profile_card_setup_ui_core.py
          rm -f tests/test_ui_first_dank_command_surface.py tools/test_dank_command_payload.py
      - name: Run patch and preserve log
        id: patch
        continue-on-error: true
        run: |
          set +e
          python tools/apply_ui_first_command_overhaul.py > /tmp/ui-first-patch.log 2>&1
          status=$?
          set -e
          echo "exit_status=$status" >> /tmp/ui-first-patch.log
          cat /tmp/ui-first-patch.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ui-first-deterministic-patch-log
          path: /tmp/ui-first-patch.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail when patch failed
        if: steps.patch.outputs.status != '0'
        run: exit 1
