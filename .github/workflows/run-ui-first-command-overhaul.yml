name: Export UI First Command Overhaul

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-tested-tree:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-command-payload-limit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest
      - name: Restore canonical patch inputs
        run: |
          git checkout origin/main -- \
            ACTIVE_TASK.md \
            stoney_verify/commands.py \
            stoney_verify/commands_ext/public_self_roles_group.py \
            stoney_verify/commands_ext/public_setup_recommend.py \
            stoney_verify/profile_card_runtime.py \
            stoney_verify/profile_card_runtime_core.py \
            stoney_verify/profile_card_service.py \
            stoney_verify/profile_card_setup_ui.py \
            stoney_verify/profile_card_setup_ui_core.py
          rm -f tests/test_ui_first_dank_command_surface.py tools/test_dank_command_payload.py
      - name: Make one-time patch self contained
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('stoney_verify/profile_card_service.py')
          service_text = service.read_text(encoding='utf-8')
          old_import = 'from .globals import get_supabase, reset_supabase\n'
          new_import = (
              'from .globals import get_supabase, reset_supabase\n'
              'from .profile_signature_style import (\n'
              '    DEFAULT_MEMBER_PROFILE_STYLE,\n'
              '    normalize_member_profile_style,\n'
              ')\n'
          )
          if service_text.count(old_import) != 1:
              raise SystemExit('profile service import anchor changed')
          service.write_text(service_text.replace(old_import, new_import, 1), encoding='utf-8')

          patch = Path('tools/apply_ui_first_command_overhaul.py')
          patch_text = patch.read_text(encoding='utf-8')
          old_block = '''    ''' + "'''" + '''            permissions.embed_links
            and permissions.read_message_history
        )
''' + "'''" + ''',
    ''' + "'''" + '''            permissions.embed_links
            and permissions.read_message_history
            and permissions.attach_files
        )
''' + "'''" + ''',
'''
          new_block = '''    ''' + "'''" + '''            permissions.view_channel
            and permissions.send_messages
            and permissions.embed_links
            and permissions.read_message_history
        )
''' + "'''" + ''',
    ''' + "'''" + '''            permissions.view_channel
            and permissions.send_messages
            and permissions.embed_links
            and permissions.read_message_history
            and permissions.attach_files
        )
''' + "'''" + ''',
'''
          if patch_text.count(old_block) != 1:
              raise SystemExit('runtime permission patch anchor changed')
          patch.write_text(patch_text.replace(old_block, new_block, 1), encoding='utf-8')
          PY
      - name: Apply exact repository patch
        run: python tools/apply_ui_first_command_overhaul.py
      - name: Normalize and validate generated tree
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = (
              'ACTIVE_TASK.md',
              'stoney_verify/commands.py',
              'stoney_verify/commands_ext/public_command_hub.py',
              'stoney_verify/commands_ext/public_self_roles_group.py',
              'stoney_verify/commands_ext/public_setup_recommend.py',
              'stoney_verify/profile_card_runtime.py',
              'stoney_verify/profile_card_runtime_core.py',
              'stoney_verify/profile_card_service.py',
              'stoney_verify/profile_card_setup_ui.py',
              'stoney_verify/profile_card_setup_ui_core.py',
              'stoney_verify/profile_signature_renderer.py',
              'stoney_verify/profile_signature_studio.py',
              'stoney_verify/profile_signature_style.py',
              'stoney_verify/welcome_setup_ui.py',
              'tests/test_ui_first_dank_command_surface.py',
              'tools/test_dank_command_payload.py',
          )
          for raw in paths:
              path = Path(raw)
              text = path.read_text(encoding='utf-8')
              path.write_text('\n'.join(line.rstrip() for line in text.splitlines()) + '\n', encoding='utf-8')
          PY
          git diff --check
          test ! -e tools/apply_ui_first_command_overhaul.py
          test ! -e .github/workflows/run-ui-first-command-overhaul.yml
          test ! -e .github/workflows/apply-profile-welcome-ux.yml
          test ! -e .github/workflows/run-profile-welcome-ux-patch.yml
      - name: Compile changed modules
        run: |
          python -m py_compile \
            stoney_verify/commands.py \
            stoney_verify/commands_ext/public_command_hub.py \
            stoney_verify/commands_ext/public_setup_recommend.py \
            stoney_verify/commands_ext/public_self_roles_group.py \
            stoney_verify/profile_card_runtime.py \
            stoney_verify/profile_card_runtime_core.py \
            stoney_verify/profile_card_service.py \
            stoney_verify/profile_card_setup_ui.py \
            stoney_verify/profile_card_setup_ui_core.py \
            stoney_verify/profile_signature_renderer.py \
            stoney_verify/profile_signature_studio.py \
            stoney_verify/profile_signature_style.py \
            stoney_verify/welcome_setup_ui.py
      - name: Run focused UI and profile tests
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
        run: |
          python -m pytest -q --tb=short --disable-warnings \
            tests/test_ui_first_dank_command_surface.py \
            tests/test_live_profile_card_final_safety.py \
            tests/test_live_profile_card_integration_contract.py \
            tests/test_profile_card_setup_picker_ux.py \
            tests/test_profile_card_service.py \
            tests/test_profile_signature_renderer.py \
            tests/test_setup_aio_navigation_behavior.py \
            tests/test_welcome_card_live_command_tree.py
      - name: Prove exact command payload fits
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
        run: python tools/test_dank_command_payload.py
      - name: Stage exact tested files
        run: |
          rm -rf /tmp/ui-first-tree
          mkdir -p /tmp/ui-first-tree
          for path in \
            ACTIVE_TASK.md \
            stoney_verify/commands.py \
            stoney_verify/commands_ext/public_command_hub.py \
            stoney_verify/commands_ext/public_self_roles_group.py \
            stoney_verify/commands_ext/public_setup_recommend.py \
            stoney_verify/profile_card_runtime.py \
            stoney_verify/profile_card_runtime_core.py \
            stoney_verify/profile_card_service.py \
            stoney_verify/profile_card_setup_ui.py \
            stoney_verify/profile_card_setup_ui_core.py \
            stoney_verify/profile_signature_renderer.py \
            stoney_verify/profile_signature_studio.py \
            stoney_verify/profile_signature_style.py \
            stoney_verify/welcome_setup_ui.py \
            tests/test_ui_first_dank_command_surface.py \
            tools/test_dank_command_payload.py; do
            mkdir -p "/tmp/ui-first-tree/$(dirname "$path")"
            cp "$path" "/tmp/ui-first-tree/$path"
          done
          cat > /tmp/ui-first-tree/DELETE_PATHS.txt <<'EOF'
          .github/workflows/run-ui-first-command-overhaul.yml
          .github/workflows/apply-profile-welcome-ux.yml
          .github/workflows/run-profile-welcome-ux-patch.yml
          tools/apply_ui_first_command_overhaul.py
          UI_FIRST_PATCH_ERROR.txt
          UI_FIRST_CLEAN_ERROR.txt
          UI_FIRST_TEST_ERROR.txt
          DANK_PAYLOAD_ERROR.txt
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: ui-first-tested-tree
          path: /tmp/ui-first-tree
          if-no-files-found: error
          retention-days: 1
