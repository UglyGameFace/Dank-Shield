name: Diagnose Final Dank Payload

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-command-payload-limit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest
      - name: Build clean implementation
        run: |
          git checkout origin/main -- \
            ACTIVE_TASK.md \
            stoney_verify/commands.py \
            stoney_verify/commands_ext/public_self_roles_group.py \
            stoney_verify/commands_ext/public_setup_recommend.py \
            stoney_verify/profile_card_runtime.py \
            stoney_verify/profile_card_runtime_core.py \
            stoney_verify/profile_card_service.py \
            stoney_verify/profile_card_setup_ui.py \
            stoney_verify/profile_card_setup_ui_core.py \
            tests/test_live_profile_card_final_safety.py \
            tests/test_live_profile_card_integration_contract.py \
            tests/test_setup_aio_navigation_behavior.py
          rm -f tests/test_ui_first_dank_command_surface.py tools/test_dank_command_payload.py
          python tools/prepare_ui_first_patch.py
          python tools/apply_ui_first_command_overhaul.py
          python tools/finalize_ui_first_patch.py
      - name: Run exact payload check
        id: payload
        continue-on-error: true
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
        run: |
          set +e
          python tools/test_dank_command_payload.py > /tmp/final-dank-payload.log 2>&1
          status=$?
          set -e
          cat /tmp/final-dank-payload.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: final-dank-payload-log
          path: /tmp/final-dank-payload.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail when payload check failed
        if: steps.payload.outputs.status != '0'
        run: exit 1
