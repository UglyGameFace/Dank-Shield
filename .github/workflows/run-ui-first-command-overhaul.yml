name: Finalize UI First Command Overhaul

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-command-payload-limit
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt
          pip install -q pytest

      - name: Build clean-main implementation tree
        run: |
          git checkout origin/main -- \
            ACTIVE_TASK.md \
            stoney_verify/commands.py \
            stoney_verify/commands_ext/public_self_roles_group.py \
            stoney_verify/commands_ext/public_setup_recommend.py \
            stoney_verify/profile_card_runtime.py \
            stoney_verify/profile_card_runtime_core.py \
            stoney_verify/profile_card_service.py \
            stoney_verify/profile_card_setup_ui.py \
            stoney_verify/profile_card_setup_ui_core.py \
            tests/test_live_profile_card_final_safety.py \
            tests/test_live_profile_card_integration_contract.py \
            tests/test_setup_aio_navigation_behavior.py
          rm -f tests/test_ui_first_dank_command_surface.py tools/test_dank_command_payload.py
          python tools/prepare_ui_first_patch.py
          python tools/apply_ui_first_command_overhaul.py
          python tools/finalize_ui_first_patch.py

      - name: Normalize and validate tree
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = (
              "ACTIVE_TASK.md",
              "stoney_verify/commands.py",
              "stoney_verify/commands_ext/public_command_hub.py",
              "stoney_verify/commands_ext/public_self_roles_group.py",
              "stoney_verify/commands_ext/public_setup_recommend.py",
              "stoney_verify/profile_card_runtime.py",
              "stoney_verify/profile_card_runtime_core.py",
              "stoney_verify/profile_card_service.py",
              "stoney_verify/profile_card_setup_ui.py",
              "stoney_verify/profile_card_setup_ui_core.py",
              "stoney_verify/profile_signature_renderer.py",
              "stoney_verify/profile_signature_studio.py",
              "stoney_verify/profile_signature_style.py",
              "stoney_verify/welcome_setup_ui.py",
              "tests/test_live_profile_card_final_safety.py",
              "tests/test_live_profile_card_integration_contract.py",
              "tests/test_setup_aio_navigation_behavior.py",
              "tests/test_ui_first_dank_command_surface.py",
              "tools/test_dank_command_payload.py",
          )
          for raw in paths:
              path = Path(raw)
              text = path.read_text(encoding="utf-8")
              path.write_text("\n".join(line.rstrip() for line in text.splitlines()) + "\n", encoding="utf-8")
          PY
          git diff --check

      - name: Compile changed modules
        run: |
          python -m py_compile \
            stoney_verify/commands.py \
            stoney_verify/commands_ext/public_command_hub.py \
            stoney_verify/commands_ext/public_setup_recommend.py \
            stoney_verify/commands_ext/public_self_roles_group.py \
            stoney_verify/profile_card_runtime.py \
            stoney_verify/profile_card_runtime_core.py \
            stoney_verify/profile_card_service.py \
            stoney_verify/profile_card_setup_ui.py \
            stoney_verify/profile_card_setup_ui_core.py \
            stoney_verify/profile_signature_renderer.py \
            stoney_verify/profile_signature_studio.py \
            stoney_verify/profile_signature_style.py \
            stoney_verify/welcome_setup_ui.py

      - name: Run focused regression suite
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
        run: |
          python -m pytest -q --tb=short --disable-warnings \
            tests/test_ui_first_dank_command_surface.py \
            tests/test_live_profile_card_final_safety.py \
            tests/test_live_profile_card_integration_contract.py \
            tests/test_profile_card_setup_picker_ux.py \
            tests/test_profile_card_service.py \
            tests/test_setup_aio_navigation_behavior.py \
            tests/test_welcome_card_live_command_tree.py

      - name: Prove exact command payload fits
        env:
          DANK_STARTUP_LOG_STYLE: quiet
          DANK_COMMAND_LOG_STYLE: quiet
        run: python tools/test_dank_command_payload.py

      - name: Remove temporary patch machinery
        run: |
          rm -f \
            .github/workflows/run-ui-first-command-overhaul.yml \
            .github/workflows/apply-profile-welcome-ux.yml \
            .github/workflows/run-profile-welcome-ux-patch.yml \
            tools/apply_ui_first_command_overhaul.py \
            tools/prepare_ui_first_patch.py \
            tools/finalize_ui_first_patch.py \
            UI_FIRST_PATCH_ERROR.txt \
            UI_FIRST_CLEAN_ERROR.txt \
            UI_FIRST_TEST_ERROR.txt \
            DANK_PAYLOAD_ERROR.txt
          git diff --check
          git status --short

      - name: Commit exact tested tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Overhaul Dank commands into guided UI menus"
          git push origin HEAD:fix/profile-command-payload-limit
